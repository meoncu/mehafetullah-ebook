fıkhı öğren. Zahiri fıkıhla amel et ki; bu amel seni bilmediğin şeyleri öğrenmeye götürsün. Zahir ilim zâhirin aydınlığı, bâtın bilgi de bâtının aydınlığıdır. Bâtın bilgi, seninle Rabbin arasındaki</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 12 Kehf, 44</div>", "raw_text": "ِّۜ ě َéْĤا ِِّٰ ų ُÙَĺ َź َĳْĤا ِכَĤَאĭُİ\n“İşte burada yardım, dostluk hak olan Allah’a\nmahsustur.”12\nKim ki bu mertebeye ulaşırsa; onun için acilen rahatlık\nmeydana gelir. Oysaki sen, içinde bulunduğun ortamla\ndünyada rahatlık bulamazsın. Çünkü dünya keder ve afet\nyurdudur. Senin için tek çare, hemen oradan çıkmaktır.\nDünyayı, kalbinden ve elinden çıkarman gerekir. Eğer kal-\nbinden ve elinden çıkarmaya güç yetiremezsen, hiç olmazsa\nonu kalbinden çıkarmış halde elinde bırak. Eğer elinden de\nçıkarmaya gücün yeterse, oradan da çıkararak onları fakirlere\nver. Miskinler Allah Teala’nın ıyâlidir. Bununla birlikte ister\nzengin ol isterse fakir, ister zahid isterse de dünyayı isteyen\nol, dünyadaki nasibin gelir seni bulur. Her şey senin kalp\nve sırrının sağlamlığı ve her ikisinin berraklığı üzere deveran\neder. Kalp ve sırrın berraklığı, ilim öğrenmek ve öğrenilen\nilimle amel etmek, amellerde ihlaslı olmak ve hakkı istemede\ndoğru olmakla gerçekleşir.\nEy evladım!\nŞu sözü hiç duymadın mı? Önce fıkıh öğren, sonra\nuzlete çekil. Önce zâhirî fıkhı, sonra da bâtınî fıkhı öğren.\nZahiri fıkıhla amel et ki; bu amel seni bilmediğin şeyleri\nöğrenmeye götürsün. Zahir ilim zâhirin aydınlığı, bâtın bilgi\nde bâtının aydınlığıdır. Bâtın bilgi, seninle Rabbin arasındaki\n12 Kehf, 44", "word_count": 190, "char_count": 1277, "has_topics": false}, {"page": 35, "printed_page": 34, "title": "Mehâfetullâh — Sayfa 35", "content_html": "<p class=\"book-paragraph\">bir aydınlıktır. İlminle amel ettikçe, Hakk Teala’ya yaklaşırsın. Seninle Rabbin arasındaki kapı genişler. Sana mahsus olan kapının kanadı kaldırılır.</p>\n<p class=\"book-paragraph\">َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Ey Rabbimiz! Bize dünyada iyilik ver. Ahirette de iyilik ver ve bizi cehennem azabından koru.”13</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 13 Bakara, 201</div>", "raw_text": "bir aydınlıktır. İlminle amel ettikçe, Hakk Teala’ya yaklaşırsın.\nSeninle Rabbin arasındaki kapı genişler. Sana mahsus olan\nkapının kanadı kaldırılır.\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Ey Rabbimiz! Bize dünyada iyilik ver. Ahirette\nde iyilik ver ve bizi cehennem azabından koru.”13\n13 Bakara, 201", "word_count": 58, "char_count": 366, "has_topics": false}, {"page": 36, "printed_page": 35, "title": "Dünyayı Ahiretin Önüne Geçirmek", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Dünyayı Ahiretin Önüne Geçirmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Ahireti dünyanın önüne geçir. Şüphesiz ki sen böyle yaptığında, her ikisini de elde edersin. Eğer dünyayı ahirete tercih edersen, o zaman ceza olarak dünyayı da ahireti de kaybedersin. Emredilmediğin bir şeyle, nasıl meşgul olabilirsin? Eğer sen dünya ile meşgul olmazsan, Allah (cc) dünyaya karşı sana yardımını çoğaltır ve dünyadan faydalanma vaktinde başarıyla ödüllendirir. Dünyalık elde ettiğin şeylere bereket koyar. Mümin hem dünya, hem de ahiret için çalışır. İhtiyacı kadar dünyası için çalışır. Bir yolcunun azığı kadar ondan alır, fazlasını elde etmek için uğraşmaz. Cahil kimsenin bütün gayreti dünyadır. Arif kimsenin bütün gayreti önce ahiret, sonra da Mevlâ’sıdır. Eline dünyalık bir parça ekmek geçtiğinde, nefsin seninle çekişiyor ve daha başka arzular peşine düşüyorsa, o zaman birkaç parça ekmek geçtiğinde olanları düşün. Hakk’ın tarafına geçerek, nefsine düşman olup, onu kınamadıkça, asla kurtuluşa eremezsin.</p>", "raw_text": "Dünyayı Ahiretin Önüne Geçirmek\nEy evladım!\nAhireti dünyanın önüne geçir. Şüphesiz ki sen böyle\nyaptığında, her ikisini de elde edersin. Eğer dünyayı ahirete\ntercih edersen, o zaman ceza olarak dünyayı da ahireti de\nkaybedersin. Emredilmediğin bir şeyle, nasıl meşgul olabilirsin?\nEğer sen dünya ile meşgul olmazsan, Allah (cc) dünyaya karşı\nsana yardımını çoğaltır ve dünyadan faydalanma vaktinde\nbaşarıyla ödüllendirir. Dünyalık elde ettiğin şeylere bereket\nkoyar. Mümin hem dünya, hem de ahiret için çalışır. İhtiyacı\nkadar dünyası için çalışır. Bir yolcunun azığı kadar ondan\nalır, fazlasını elde etmek için uğraşmaz. Cahil kimsenin\nbütün gayreti dünyadır. Arif kimsenin bütün gayreti önce\nahiret, sonra da Mevlâ’sıdır. Eline dünyalık bir parça ekmek\ngeçtiğinde, nefsin seninle çekişiyor ve daha başka arzular\npeşine düşüyorsa, o zaman birkaç parça ekmek geçtiğinde\nolanları düşün. Hakk’ın tarafına geçerek, nefsine düşman\nolup, onu kınamadıkça, asla kurtuluşa eremezsin.", "word_count": 137, "char_count": 975, "has_topics": true}, {"page": 37, "printed_page": 36, "title": "Sâdık Kişiler", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Sâdık Kişiler</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Sâdıklar, birbirlerini tanır ve birbirlerinin kabul ve doğruluk kokularını alırlar. Ey Hakk’tan ve onun sâdık kullarından yüz çevirerek, halka yönelen ve onlara karışan kişi! Ne zamana kadar halka yöneleceksin? Halk sana ne fayda sağlayacak? Halkın elleri sana ne fayda verir ne de zarar. Vermek de vermemek de onların ellerinde değildir. Zarar ve menfaat verme konusunda onların diğer cansız varlıklardan bir farkı yoktur. Hükümdar birdir. Zarar veren de fayda veren de, hareket ettiren de durduran da, musallat eden de, emre amade kılan da, veren de, engelleyen de, Yaratan ve rızık veren de sadece Allah (c.c)’tır. O başlangıcı ve sonu olmayan ezeli ve ebedidir. O yaratılmışlardan önce vardır. O babalarınızdan, annelerinizden ve zenginlerinizden önce vardı. Yerleri, gökleri ve aralarında olan her şeyin yaratan O’dur. Allah (cc) şöyle buyuruyor: ُóĻ ۪āَ×ْĤا ُďĻ ۪ĩ َّùĤا َĳُİ وَ ْءٌۚ Ĺ َü ۪įِĥْá ِĩכَ َ÷ْĻَĤ “O’nun benzeri hiçbir şey yoktur. O her şeyi işiten ve görendir.”14 Ey Allah’ın kulları!</p>\n<p class=\"book-paragraph\">Yazık sizlere; yaratıcınızı gerçek manada tanımıyorsunuz. Eğer kıyamet gününde Allah Teala’nın katında itibarı olan 14 Şûra, 11</p>", "raw_text": "Sâdık Kişiler\nSâdıklar, birbirlerini tanır ve birbirlerinin kabul ve doğ-\nruluk kokularını alırlar.\nEy Hakk’tan ve onun sâdık kullarından yüz çevirerek,\nhalka yönelen ve onlara karışan kişi! Ne zamana kadar halka\nyöneleceksin? Halk sana ne fayda sağlayacak? Halkın elleri\nsana ne fayda verir ne de zarar. Vermek de vermemek de\nonların ellerinde değildir. Zarar ve menfaat verme konusunda\nonların diğer cansız varlıklardan bir farkı yoktur. Hükümdar\nbirdir. Zarar veren de fayda veren de, hareket ettiren de\ndurduran da, musallat eden de, emre amade kılan da, veren\nde, engelleyen de, Yaratan ve rızık veren de sadece Allah\n(c.c)’tır. O başlangıcı ve sonu olmayan ezeli ve ebedidir. O\nyaratılmışlardan önce vardır. O babalarınızdan, annelerinizden\nve zenginlerinizden önce vardı. Yerleri, gökleri ve aralarında\nolan her şeyin yaratan O’dur. Allah (cc) şöyle buyuruyor:\nُóĻ ۪āَ×ْĤا ُďĻ ۪ĩ َّùĤا َĳُİ وَ ْءٌۚ Ĺ َü ۪įِĥْá ِĩכَ َ÷ْĻَĤ\n“O’nun benzeri hiçbir şey yoktur. O her şeyi\nişiten ve görendir.”14\nEy Allah’ın kulları!\nYazık sizlere; yaratıcınızı gerçek manada tanımıyorsunuz.\nEğer kıyamet gününde Allah Teala’nın katında itibarı olan\n14 Şûra, 11", "word_count": 173, "char_count": 1146, "has_topics": true}, {"page": 38, "printed_page": 37, "title": "Mehâfetullâh — Sayfa 38", "content_html": "<p class=\"book-paragraph\">bir kul olsaydım, sizlerin başınızdan sonunuza günahlarınızı yüklenirdim. (Ancak böyle bir şey yok) Ey okuyucu! Gök ve yer ehli için değil sadece benim için oku. İlmiyle amel eden her kişi için, kalbini Allah Teala’nın huzuruna sokacağı bir kapı vardır.</p>\n<p class=\"book-paragraph\">Ey alim!</p>\n<p class=\"book-paragraph\">Sana gelince sen kilu-kal (dedikoduyla) meşgul oluyorsun. İlminle amel etmeyi bırakarak, mal biriktirmekle uğraşıyorsun. Şüphesiz ki senin nasibine mânâ ile değil, şekille meşgul olmak düşmüş. Allah (cc) kullarından birinin hayrını isterse, o kuluna ilim öğretir, sonra da o kuluna amel ve ihlas ilham eder. Böylece onu kendine yaklaştırır. Onu yakınlık ve irfan sahibi yapar. O kişiye, başkasına değil, sadece kendine ait olan gönüllerin ve sırların ilmini öğretir. Allah (cc), onu kendine Musa (as)’ı seçtiği gibi seçer. Allah (cc) şöyle buyuruyor:</p>\n<p class=\"book-paragraph\">ۚĹ ۪ù ْęَĭِĤ ُכَÝ ْđَĭَĉ ْĀوَا “Seni kendim için seçtim.”15 Ben seni başkası için değil, kendim için seçtim. Şehvetler, lezzetler, hırslar, yerler, gökler, cennet, cehennem, mülk sahibi yapmak için veya helak etmek için seçmedim. Hiçbir şey seni benden alamaz ve benden başkasıyla meşgul</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 15 Taha, 41</div>", "raw_text": "bir kul olsaydım, sizlerin başınızdan sonunuza günahlarınızı\nyüklenirdim. (Ancak böyle bir şey yok)\nEy okuyucu! Gök ve yer ehli için değil sadece benim için\noku. İlmiyle amel eden her kişi için, kalbini Allah Teala’nın\nhuzuruna sokacağı bir kapı vardır.\nEy alim!\nSana gelince sen kilu-kal (dedikoduyla) meşgul olu-\nyorsun. İlminle amel etmeyi bırakarak, mal biriktirmekle\nuğraşıyorsun. Şüphesiz ki senin nasibine mânâ ile değil,\nşekille meşgul olmak düşmüş. Allah (cc) kullarından birinin\nhayrını isterse, o kuluna ilim öğretir, sonra da o kuluna\namel ve ihlas ilham eder. Böylece onu kendine yaklaştırır.\nOnu yakınlık ve irfan sahibi yapar. O kişiye, başkasına değil,\nsadece kendine ait olan gönüllerin ve sırların ilmini öğretir.\nAllah (cc), onu kendine Musa (as)’ı seçtiği gibi seçer. Allah\n(cc) şöyle buyuruyor:\nۚĹ ۪ù ْęَĭِĤ ُכَÝ ْđَĭَĉ ْĀوَا\n“Seni kendim için seçtim.”15\nBen seni başkası için değil, kendim için seçtim. Şeh-\nvetler, lezzetler, hırslar, yerler, gökler, cennet, cehennem,\nmülk sahibi yapmak için veya helak etmek için seçmedim.\nHiçbir şey seni benden alamaz ve benden başkasıyla meşgul\n15 Taha, 41", "word_count": 169, "char_count": 1117, "has_topics": false}, {"page": 39, "printed_page": 38, "title": "Allah’ın Rahmetinden Ümit Kesmek", "content_html": "<p class=\"book-paragraph\">edemez. Hiçbir suret seni benden engelleyemez, hiçbir yaratık seni benden perdeleyemez. Hiçbir şehvet seni benden uzaklaştıramaz.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Allah’ın Rahmetinden Ümit Kesmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">İşlediğin günahtan dolayı, Allah Teala’nın rahmetinden ümit kesme. Bilakis dindarlık giysindeki necaseti, tevbe suyu ile yıka ve tövbe et. Tevbende ihlas üzere sebat et. Tövbeni de marifet kokusuyla tütsüle. Bu menzilde günaha düşmekten sakın. Sen ne tarafa yönelsen, etrafının yırtıcı hayvanlar tarafından kuşatıldığını ve eziyetlerin sana yöneldiğini görürsün. Bu takdirde hemen oradan yüz çevir ve kalbinle Hakk’a dön. Tabiatın, şehvetlerin ve hevalarınla değil, iki adil şahit olan Allah Teala’nın kitabı ve Resûlünün sünneti ölçüsünce ye. Kitab ve sünnetten sonra iki adil şahide, kalbine ve Allah Teala’nın fiillerine başvur. Kitap, sünnet ve kalbin izin verdiği zaman, dördüncü şahit ara. O da Allah Teala’nın fiilidir. Gece eline ne gelirse alan odun toplayıcısı gibi olma. Bu durumda halka (yatılana) mı, yaratana mı koştuğunu bilemezsin. Bütün bunlar kuruntu, boş temennilerle, zoraki ve yapmacık hareketlerle elde edilmez. Bu kalpte olan vakar ve doğru amelle elde edilir. Sırf Allah (cc) rızası için yapılan amellerle elde edilir. Ey evladım!</p>\n<p class=\"book-paragraph\">Afiyet, afiyeti terk etmekle, zenginlik, zenginliği terk etmekle, Şifa, şifayı terk etmekle olur. Bütün şifalar, Allah</p>", "raw_text": "edemez. Hiçbir suret seni benden engelleyemez, hiçbir ya-\nratık seni benden perdeleyemez. Hiçbir şehvet seni benden\nuzaklaştıramaz.\nAllah’ın Rahmetinden Ümit Kesmek\nEy evladım!\nİşlediğin günahtan dolayı, Allah Teala’nın rahmetinden\nümit kesme. Bilakis dindarlık giysindeki necaseti, tevbe\nsuyu ile yıka ve tövbe et. Tevbende ihlas üzere sebat et.\nTövbeni de marifet kokusuyla tütsüle. Bu menzilde günaha\ndüşmekten sakın. Sen ne tarafa yönelsen, etrafının yırtıcı\nhayvanlar tarafından kuşatıldığını ve eziyetlerin sana yönel-\ndiğini görürsün. Bu takdirde hemen oradan yüz çevir ve\nkalbinle Hakk’a dön. Tabiatın, şehvetlerin ve hevalarınla\ndeğil, iki adil şahit olan Allah Teala’nın kitabı ve Resûlünün\nsünneti ölçüsünce ye. Kitab ve sünnetten sonra iki adil\nşahide, kalbine ve Allah Teala’nın fiillerine başvur. Kitap,\nsünnet ve kalbin izin verdiği zaman, dördüncü şahit ara. O\nda Allah Teala’nın fiilidir. Gece eline ne gelirse alan odun\ntoplayıcısı gibi olma. Bu durumda halka (yatılana) mı, yara-\ntana mı koştuğunu bilemezsin. Bütün bunlar kuruntu, boş\ntemennilerle, zoraki ve yapmacık hareketlerle elde edilmez.\nBu kalpte olan vakar ve doğru amelle elde edilir. Sırf Allah\n(cc) rızası için yapılan amellerle elde edilir.\nEy evladım!\nAfiyet, afiyeti terk etmekle, zenginlik, zenginliği terk\netmekle, Şifa, şifayı terk etmekle olur. Bütün şifalar, Allah", "word_count": 193, "char_count": 1354, "has_topics": true}, {"page": 40, "printed_page": 39, "title": "Tevhid ve Züht", "content_html": "<p class=\"book-paragraph\">Teala’ya tam teslim olmak, sebeplerle bağı koparmak, kalbinden de sahte ilahları atmakla olur. Şifa, sadece dil ile değil, kalple Allah’ı birlemededir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Tevhid ve Züht</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Tevhit ve züht beden ve dilde olmaz. Tevhit kalptedir, züht kalptedir, takvâ kalptedir, ma’rifet kalptedir, Allah’ı bilmek kalptedir, Allah (cc) sevgisi kalptedir, O’na yakınlık kalple ilgilidir. Akıllı ol ve bo ş heveslerin peşine düşme. Yapmacık, zoraki davranışlar yapma. Ne var ki, sen bütün davranışlarında halkın sana teveccüh etmesini istiyorsun. Sen kalbinle halka doğru bir adım attıkça, Hakk’tan uzaklaştığını bilmiyor musun? Sen Hakk’ı istediğini söylüyorsun, oysaki sen halkın peşinde koşmaktasın. Tabir caizse, senin durumun; Mekke’ye doğru gitmek istiyorum deyip de, Horasan’a giden insana benziyor. (Bağdat’dan) Horasan’a doğru attığı her adımda, Mekke’den bir adım uzaklaşmaktadır. Mekke nere, Horasan nere? Sen kalbinin halktan ayrıldığını iddia ediyorsun, oysaki halktan korkuyor ve halktan umuyorsun. Dış görünüşün zahitliğe, iç görünüşün ise nefsani arzulara yönelik. Dış görünüşün Hakk’a, iç görünüşün ise halka yönelik. Oysaki bu makam, laf kalabalığı ile elde edilecek bir şey değildir. Bu makamı elde edecek kişinin düşüncesinde ne halk, ne dünya, ne ahiret, ne de Hakk’ın dışında bir şey olmamalıdır. O tektir, teki kabul eder. O, ortak kabul etmez. Senin işlerini düzenleyen O’dur. Öyleyse sen sana söylenenleri kabul et ve O’na yönel. Mahlukat acizdir, sana ne fayda verebilir ne de zarar verebilir. Ancak Hakk (cc) fayda</p>", "raw_text": "Teala’ya tam teslim olmak, sebeplerle bağı koparmak,\nkalbinden de sahte ilahları atmakla olur. Şifa, sadece dil ile\ndeğil, kalple Allah’ı birlemededir.\nTevhid ve Züht\nTevhit ve züht beden ve dilde olmaz. Tevhit kalptedir,\nzüht kalptedir, takvâ kalptedir, ma’rifet kalptedir, Allah’ı\nbilmek kalptedir, Allah (cc) sevgisi kalptedir, O’na yakınlık\nkalple ilgilidir. Akıllı ol ve bo ş heveslerin peşine düşme.\nYapmacık, zoraki davranışlar yapma. Ne var ki, sen bütün\ndavranışlarında halkın sana teveccüh etmesini istiyorsun. Sen\nkalbinle halka doğru bir adım attıkça, Hakk’tan uzaklaştığını\nbilmiyor it, kalbini Hakk’ın dışındaki her şeyden temizleyen, Hakk’ın kap ısında tevhid k ılıcıyla ve şeriat keskinliği ile duran ve oraya hiçbir mahlûkatın girmesine izin vermeyendir. Onun kalbini, bütün kalpleri çeviren Mevlâ doldurur. Şeriat onun dış görüntüsünü, tevhid ve marifet ise içini süsler.</p>\n<p class=\"book-paragraph\">Ey dediler, dedik sözleri arasında dolaşanlar! Bu sözler, size bir şey kazandırmaz. Sen bir taraftan, bu haramdır, diyorsun, tutup o haramı işliyorsun. Bir taraftan da bu helaldir, diyorsun, o helali yapmıyor ve kullanmıyorsun. Sen bir hevesten diğerine atlıyorsun.</p>\n<p class=\"book-paragraph\">Resulullah (sav) şöyle buyurmuştur:</p>", "raw_text": "ve zararı halkın elleriyle sana ulaştırır. Senin ve mahlûkatın\nüzerinde tasarrufta bulunan Allah’tır. Kalem, Allah Teala’nın\nezeli ilminde senin lehine ve aleyhine olanları yazmıştır.\nMuvahhid ve Salih Kişiler\nMuvahhid ve salih kişiler, Allah’ın diğer kullarına karşı\nhüccetidir. Onlar, gerek iç alemleriyle, gerekse de d ış\nyönleriyle dünyadan soyutlanmışlardır. Onlardan bir kısım\nkişiler de var ki; onlar sadece iç yönüyle soyutlanmışlardır.\nAllah (cc) bunların kalplerinde, dünya ile alakalı bir şey\ngörmez, işte saf ve berrak olan kalpler bunlard ır. Buna\ngüç yetiren kişilere Hakk (cc) tarafından halka hükümdar\nolma nimeti bah şedilir. O artık yi ğit ve kahraman bir\nkişidir. Gerçek yiğit, kalbini Hakk’ın dışındaki her şeyden\ntemizleyen, Hakk’ın kap ısında tevhid k ılıcıyla ve şeriat\nkeskinliği ile duran ve oraya hiçbir mahlûkatın girmesine\nizin vermeyendir. Onun kalbini, bütün kalpleri çeviren\nMevlâ doldurur. Şeriat onun dış görüntüsünü, tevhid ve\nmarifet ise içini süsler.\nEy dediler, dedik sözleri arasında dolaşanlar!\nBu sözler, size bir şey kazandırmaz. Sen bir taraftan, bu\nharamdır, diyorsun, tutup o haramı işliyorsun. Bir taraftan da\nbu helaldir, diyorsun, o helali yapmıyor ve kullanmıyorsun.\nSen bir hevesten diğerine atlıyorsun.\nResulullah (sav) şöyle buyurmuştur:", "word_count": 184, "char_count": 1288, "has_topics": true}, {"page": 42, "printed_page": 41, "title": "Allah (cc) Dostlarına Dil Uzatanlar", "content_html": "<p class=\"book-paragraph\">“Cahile bir kere, âlim kişiye ise yedi defa yazıklar olsun.”16 Cahil bilmediği için, bir kere yazıklar olsun, âlim ise bilip de yapmadığı için yedi defa yazıklar olsun. Bu durumda olan kişilerden ilmin bereketi kalkmış, geriye sadece ilim onun aleyhinde bir delil olarak kalmıştır. Önce öğren, sonra öğrendiklerini uygula, daha sonra halktan uzaklaşarak uzlete çekil ve Allah (cc) sevgisiyle meşgul ol. Sende uzlet ve muhabbet gerçekleşirse, Hakk (cc) seni kendine yaklaştırır ve seni kendinde fâni k ılar. Sonra eğer O dilerse, seni halkın arasına çıkarır ve seni me şhur kılar ve dünyadan nasibini alman için seni geri gönderir. Senin hakkında en iyisini bilen Allah (cc), kader rüzgarına emreder, bu kader rüzgarı senin halvet duvarlarına çarparak yıkar ve senin halini halka teşhir eder. Bu durumda sen kendi iradenle olmadan halk ile Hakk arasında kalırsın. Nefsinin, heva ve hevesinin uğursuzluğunda kalmadan, dünyada nasibin sana tastamam verilir. Senin hakkında, Allah Teala’nın ezeli ilminin kanunları batıl olmaması için, nasibin sana verilir. Nasibin sana verilirken, senin kalbin Hakk (cc) ile beraberdir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Allah (cc) Dostlarına Dil Uzatanlar</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey Hakk’ı ve O’nun dostlarını bilmeyen cahiller! Ey Hakk’a ve O’nun dostlarına dil uzatanlar! Ey İnsanlar! Hakk, Allah</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 16 Bunun aslı bulunmadı. Ancak Camiu’s-Sağir’de: “Bilen ama bildiği</div>\n<p class=\"book-paragraph\">ile amel etmeyene yazıklar olsun.” Şeklinde rivayet vardır. Camiu’s- Sağir, 9685</p>", "raw_text": "“Cahile bir kere, âlim kişiye ise yedi defa ya-\nzıklar olsun.”16\nCahil bilmediği
