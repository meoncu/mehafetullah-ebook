in, atının ve makamının kulusun. Oysa sâdık kalp, halktan Hakk’a yolculuk yapar, yolda gördükleri şeylere sadece selam verir ve geçer.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Alimler Peygamberlerin Varisleridir</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Bildikleri ile amel eden âlimler, selef-i salihinin vekilleridir, onlar aynı zamanda peygamberlerin varisleridir. Halefin takipçileri ise, insanların öncüleri olup, şeriat şehrinde ümranı emreder, harap etmekten sakındırırlar. Kıyamet gününde peygamberlerle, onların varisleri bir araya gelirler ve Allah (cc) tarafından ecirleri, kendilerine tastamam verilir. İlmi ile amel etmeyen âlimi Allah (cc), merkeplere benzeterek şöyle demiştir:</p>\n<p class=\"book-paragraph\">َאرِ ĩ ِéْĤا ِģَá َĩכَ َא İĳُĥ ِĩ ْéَĺ ْħَĤ َّħُà َÙĺ ْرٰ ĳَّÝĤا اĳُĥ ِّĩ ُè َīĺ ۪ñَّĤا ُģَá َĨ َאراًۜę ْøاَ ُģ ِĩ ْéَĺ</p>", "raw_text": "Teala’dır. Batıl ise sizlersiniz. Hakk (cc) kalplerde, sırlarda\nve mânâlardadır. Batıl ise nefislerde, hevalarda, doğalarda,\nadetlerde, dünyada ve Hakk’ın dışındaki şeylerdedir. Bu\nkalp ezeli, ebedi olan Allah Teala’ya yakınlaşıncaya kadar\niflah olmaz.\nEy münafık!\nBoş yere zahmet etme, senin yanındakiler bundan daha\nüstün değildir. Sen ekmeğinin, katığının, tatlının, elbisenin,\natının ve makamının kulusun. Oysa sâdık kalp, halktan\nHakk’a yolculuk yapar, yolda gördükleri şeylere sadece\nselam verir ve geçer.\nAlimler Peygamberlerin Varisleridir\nBildikleri ile amel eden âlimler, selef-i salihinin vekilleridir,\nonlar aynı zamanda peygamberlerin varisleridir. Halefin ta-\nkipçileri ise, insanların öncüleri olup, şeriat şehrinde ümranı\nemreder, harap etmekten sakındırırlar. Kıyamet gününde\npeygamberlerle, onların varisleri bir araya gelirler ve Allah\n(cc) tarafından ecirleri, kendilerine tastamam verilir. İlmi\nile amel etmeyen âlimi Allah (cc), merkeplere benzeterek\nşöyle demiştir:\nَאرِ ĩ ِéْĤا ِģَá َĩכَ َא İĳُĥ ِĩ ْéَĺ ْħَĤ َّħُà َÙĺ ْرٰ ĳَّÝĤا اĳُĥ ِّĩ ُè َīĺ ۪ñَّĤا ُģَá َĨ\nَאراًۜę ْøاَ ُģ ِĩ ْéَĺ", "word_count": 151, "char_count": 1108, "has_topics": true}, {"page": 44, "printed_page": 43, "title": "Mehâfetullâh — Sayfa 44", "content_html": "<p class=\"book-paragraph\">“Tevrat’la yükümlü tutulup ta onunla amel etmeyenlerin durumu, ciltlerce kitapları taşıyan merkebin durumu gibidir.”17 Ayette geçen ‘Esfar’ ilim kitapları demektir. Bir merkep, ilim kitaplarından faydalanabilir mi? Merkebin bu kitapları taşımasından dolayı, eline yorgunluk ve hamallıktan başka bir şey geçmez. İlmi artan kişinin, Rabbine karşı korku ve itaatlarında da artma olması gerekir.</p>\n<p class=\"book-paragraph\">Ey İlim iddiasında bulunan kişi!</p>\n<p class=\"book-paragraph\">Nerede Allah (cc) korkusundan dolayı göz yaşların? Nerede korkun? Nerede sakınman?</p>\n<p class=\"book-paragraph\">Nerede günahlarını itirafın?</p>\n<p class=\"book-paragraph\">Hani nerede Allah Teala’ya itaat ederek karanlıkları aydınlatma çabaların?</p>\n<p class=\"book-paragraph\">Hani nerede nefis terbiyen, Allah Teala’ya ulaşma gayretin ve nefsine düşmanlığın?</p>\n<p class=\"book-paragraph\">Senin bütün gayretin, gömlek, sarık, yemek, içmek, evlenmek, daire, dükkan sahibi olmak ve halk ile oturup kalmak ve onlarla sıkı dostluk kurmaktan ibarettir. Bütün bu düşüncelerden vazgeç. Eğer senin bu saydıklarımızdan birinde kısmetin varsa; kalbin bekleme stresinden, hırs ağırlıkları altında ezilmeden vakti gelince o kısmet sana gelir.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 17 Cuma, 5</div>", "raw_text": "“Tevrat’la yükümlü tutulup ta onunla amel\netmeyenlerin durumu, ciltlerce kitapları taşıyan\nmerkebin durumu gibidir.”17\nAyette geçen ‘Esfar’ ilim kitapları demektir. Bir merkep,\nilim kitaplarından faydalanabilir mi? Merkebin bu kitapları\ntaşımasından dolayı, eline yorgunluk ve hamallıktan başka\nbir şey geçmez. İlmi artan kişinin, Rabbine karşı korku ve\nitaatlarında da artma olması gerekir.\nEy İlim iddiasında bulunan kişi!\nNerede Allah (cc) korkusundan dolayı göz yaşların?\nNerede korkun? Nerede sakınman?\nNerede günahlarını itirafın?\nHani nerede Allah Teala’ya itaat ederek karanlıkları\naydınlatma çabaların?\nHani nerede nefis terbiyen, Allah Teala’ya ulaşma\ngayretin ve nefsine düşmanlığın?\nSenin bütün gayretin, gömlek, sarık, yemek, içmek,\nevlenmek, daire, dükkan sahibi olmak ve halk ile oturup\nkalmak ve onlarla sıkı dostluk kurmaktan ibarettir. Bütün bu\ndüşüncelerden vazgeç. Eğer senin bu saydıklarımızdan birinde\nkısmetin varsa; kalbin bekleme stresinden, hırs ağırlıkları\naltında ezilmeden vakti gelince o kısmet sana gelir.\n17 Cuma, 5", "word_count": 140, "char_count": 1047, "has_topics": false}, {"page": 45, "printed_page": 44, "title": "Mehâfetullâh — Sayfa 45", "content_html": "<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Senin halvetin samimi değil; necis olan bir şey, temiz değildir. Kalbinde ihlas ve tevhid sağlam değil ki; ben sana ne yapayım?</p>\n<p class=\"book-paragraph\">Ey uykuya dalan gâfiller! Gaflet uykusundan uyanın. Ey Allah Teala’dan yüz çevirenler! Allah Teala’dan yüz çevirmeyin.</p>\n<p class=\"book-paragraph\">Ey unutanlar! Unutmayın.</p>\n<p class=\"book-paragraph\">Ey terk edenler! Etmeyin. Ey Allah Teala’yı, Resulünü, gelmiş ve geçmişlerini tanımayan cahiller! Sizler hiçbir işe yaramayan ağaçtan yontulmuş kütük gibisiniz.</p>\n<p class=\"book-paragraph\">َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Ey Rabbimiz! Bize dünya ve ahirette iyilik ver. Bizi cehennem azabından koru!”18 Amin.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 18 Bakara, 201</div>", "raw_text": "Ey evladım!\nSenin halvetin samimi değil; necis olan bir şey, temiz\ndeğildir. Kalbinde ihlas ve tevhid sağlam değil ki; ben sana\nne yapayım?\nEy uykuya dalan gâfiller! Gaflet uykusundan uya-\nnın.\nEy Allah Teala’dan yüz çevirenler! Allah Teala’dan\nyüz çevirmeyin.\nEy unutanlar! Unutmayın.\nEy terk edenler! Etmeyin. Ey Allah Teala’yı, Resulünü,\ngelmiş ve geçmişlerini tanımayan cahiller! Sizler hiçbir işe\nyaramayan ağaçtan yontulmuş kütük gibisiniz.\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Ey Rabbimiz! Bize dünya ve ahirette iyilik ver.\nBizi cehennem azabından koru!”18 Amin.\n18 Bakara, 201", "word_count": 101, "char_count": 652, "has_topics": false}, {"page": 46, "printed_page": 45, "title": "Münafıklıktan Sakınmak", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Münafıklıktan Sakınmak</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey Münafık!</p>\n<p class=\"book-paragraph\">Yeryüzünü Allah (cc) senden temizlesin. Münafıklığın yetmiyormuş gibi bir de, âlimlere, Allah dostlarına ve salih insanlara gıybet ederek onların etlerini yiyorsun. Sen ve senin gibi münafık kardeşlerinizin yakında dillerini, etlerini, haşereler yiyecek ve paramparça koparacak. Yeryüzü sizleri sinesine alarak sıkacak ve bedenlerinizi halden hale çevirerek çürütecek. Allah (cc) ve O’nun salih kullarına karşı hüsnü zan besleyip alçak gönüllü olmayan kişiler için asla kurtuluş yoktur. Allah dostlarına karşı neden alçak gönüllü olmuyorsun? Onlar reis ve emirdirler, oysaki onlara nisbetle sen bir hiçsin. Allah (cc) işlerin hallini ve bağlanmasını onlara teslim etmiştir. Gökyüzü onlar sayesinde yağmur yağdırır, yeryüzü onlar sayesinde nebatatını bitirir. Bütün mahlûkat onların tebaasıdır. Her biri dağ gibidir. Hiçbir şey onları yerinden sökemez, afet ve musibet rüzgarları onları yerinden hareket ettiremez. Onları hiçbir şey, Allah Teala’yı birleme ve O’nun</p>", "raw_text": "Münafıklıktan Sakınmak\nEy Münafık!\nYeryüzünü Allah (cc) senden temizlesin. Münafıklığın\nyetmiyormuş gibi bir de, âlimlere, Allah dostlarına ve salih\ninsanlara gıybet ederek onların etlerini yiyorsun. Sen ve\nsenin gibi münafık kardeşlerinizin yakında dillerini, etlerini,\nhaşereler yiyecek ve paramparça koparacak. Yeryüzü sizleri\nsinesine alarak sıkacak ve bedenlerinizi halden hale çevirerek\nçürütecek. Allah (cc) ve O’nun salih kullarına karşı hüsnü\nzan besleyip alçak gönüllü olmayan kişiler için asla kurtuluş\nyoktur. Allah dostlarına karşı neden alçak gönüllü olmuyor-\nsun? Onlar reis ve emirdirler, oysaki onlara nisbetle sen bir\nhiçsin. Allah (cc) işlerin hallini ve bağlanmasını onlara teslim\netmiştir. Gökyüzü onlar sayesinde yağmur yağdırır, yeryüzü\nonlar sayesinde nebatatını bitirir. Bütün mahlûkat onların\ntebaasıdır. Her biri dağ gibidir. Hiçbir şey onları yerinden\nsökemez, afet ve musibet rüzgarları onları yerinden hareket\nettiremez. Onları hiçbir şey, Allah Teala’yı birleme ve O’nun", "word_count": 134, "char_count": 1001, "has_topics": true}, {"page": 47, "printed_page": 46, "title": "Mehâfetullâh — Sayfa 47", "content_html": "<p class=\"book-paragraph\">rızasını kazanma konumundan ayıramaz. Onlar bu hallerini hem kendileri için, hem de başkaları için isterler. Allah Teala’ya tevbe ediniz ve O’ndan özür dileyiniz. Sizinle O’nun arasında olan ve başkasının bilmediği günahlarınızı O’nun huzurunda ve O’na yalvararak itiraf edin. Sizin elinizde ne var ki? Şayet siz durumunuzu bilseydiniz; bulunduğunuz durumdan daha farklı bir konumda olurdunuz. Sizden öncekilerin edepli olduğu şekilde, siz de Allah Teala’nın huzurunda edepli olun. Sizler sizden öncekilere nisbetle çift cinsiyetli hünsa gibisiniz. Kahramanlığınızı nefisleriniz, hevalarınız ve tabiatınızın emrettiği şeylerde gösteriyorsunuz. Oysaki dinde kahramanlık, Allah Teala’nın haklarını yerine getirmekle olur.</p>\n<p class=\"book-paragraph\">Hikmet erbabı ile ilim sahiplerinin sözlerini hafife almayın. Zira onların sözleri ilaç, cümleleri ise Allah Teala’nın vahyinin meyveleridir. Şeklen aranızda olan bir peygamber yok ki; ona tabi olasınız. Oysaki sizler, gerçekten peygambere tabi olan âlimleri bulup onlara tâbi olsanız, aynen peygambere uymuş gibi olursunuz. Onu gördüğünüz zaman da, peygamberi görmüş gibi olursunuz. Takva sahibi âlimlerle birlikte olun, onların sohbetine devam edin; zira onların sohbetlerinde bereket vardır. İlmiyle amel etmeyen âlimlerin sohbetine katılmayın; zira onların sohbeti sizler için uğursuzluktur. Takva ve ilim bakımından senden daha üstün olanlarla sohbet et, zira onlarla sohbet senin için berekettir. Takvası ve ilmi olmayan, yaşça senden daha büyük biriyle sohbet etme; zira onunla sohbet senin</p>", "raw_text": "rızasını kazanma konumundan ayıramaz. Onlar bu hallerini\nhem kendileri için, hem de başkaları için isterler.\nAllah Teala’ya tevbe ediniz ve O’ndan özür dileyiniz.\nSizinle O’nun arasında olan ve başkasının bilmediği günah-\nlarınızı O’nun huzurunda ve O’na yalvararak itiraf edin.\nSizin elinizde ne var ki? Şayet siz durumunuzu bilseydiniz;\nbulunduğunuz durumdan daha farklı bir konumda olurdu-\nnuz. Sizden öncekilerin edepli olduğu şekilde, siz de Allah\nTeala’nın huzurunda edepli olun. Sizler sizden öncekilere\nnisbetle çift cinsiyetli hünsa gibisiniz. Kahramanlığınızı\nnefisleriniz, hevalarınız ve tabiatınızın emrettiği şeylerde\ngösteriyorsunuz. Oysaki dinde kahramanlık, Allah Teala’nın\nhaklarını yerine getirmekle olur.\nHikmet erbabı ile ilim sahiplerinin sözlerini hafife almayın.\nZira onların sözleri ilaç, cümleleri ise Allah Teala’nın vahyinin\nmeyveleridir. Şeklen aranızda olan bir peygamber yok ki;\nona tabi olasınız. Oysaki sizler, gerçekten peygambere tabi\nolan âlimleri bulup onlara tâbi olsanız, aynen peygambere\nuymuş gibi olursunuz. Onu gördüğünüz zaman da, pey-\ngamberi görmüş gibi olursunuz.\nTakva sahibi âlimlerle birlikte olun, onların sohbetine\ndevam edin; zira onların sohbetlerinde bereket vardır. İlmiyle\namel etmeyen âlimlerin sohbetine katılmayın; zira onların\nsohbeti sizler için uğursuzluktur. Takva ve ilim bakımından\nsenden daha üstün olanlarla sohbet et, zira onlarla sohbet\nsenin için berekettir. Takvası ve ilmi olmayan, yaşça senden\ndaha büyük biriyle sohbet etme; zira onunla sohbet senin", "word_count": 203, "char_count": 1523, "has_topics": false}, {"page": 48, "printed_page": 47, "title": "Mehâfetullâh — Sayfa 48", "content_html": "<p class=\"book-paragraph\">için uğursuzluktur. Allah (cc) için amel et, başkası için değil. Allah (cc) için kötülükleri terket, başkası için değil. Allah Teala’dan başkası için amel etmek küfür, başkası için ameli terketmek riyadır. Bunu böyle bilmeyip de başkası için amel eden kişi heva ve hevesinin peşindedir. Yakında ölüm sana gelir ve bütün hevesini keser.</p>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Kalbinde Allah Teala’dan başkasına olan bağları keserek, Allah Teala’ya bağlan. Resulullah (sav) şöyle buyurmaktadır:</p>\n<p class=\"book-paragraph\">“Rabbinizle aranızdaki bağı birleştirin ki, mutlu olasınız.”19 Salihlere gönüllerinizle bağlılığınızı devam ettirerek, Allah (cc) ile olan bağlarınızı berraklaştırın.</p>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Yanına geldiklerinde, zengin ile fakir arasında farklı muamele yaparsan, asla felah bulmazsın. Sabırlı fakirlere ikram et, onlarla oturup kalmayı bereket kabul et. Resulullah (sav) şöyle buyurmaktadır:</p>\n<p class=\"book-paragraph\">“Sabırlı fakirler kıyamet gününde Rahman’ın celisleridir. (huzurundadırlar.)”20 Bugün kalpleri ile Rahmanın yanında oturanlar, yarın bedenleri ile O’nun huzurunda otururlar. Onlar dünyayı ve dünya ziynetlerini terk ederek, fakirliği zenginliğe tercih</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 19 İbn-i Mâce, 1081</div>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 20 Kenzü’l-Ummâl, 4/222</div>", "raw_text": "için uğursuzluktur. Allah (cc) için amel et, başkası için değil.\nAllah (cc) için kötülükleri terket, başkası için değil. Allah\nTeala’dan başkası için amel etmek küfür, başkası için ameli\nterketmek riyadır. Bunu böyle bilmeyip de başkası için amel\neden kişi heva ve hevesinin peşindedir. Yakında ölüm sana\ngelir ve bütün hevesini keser.\nYazıklar olsun sana! Kalbinde Allah Teala’dan başkasına\nolan bağları keserek, Allah Teala’ya bağlan. Resulullah (sav)\nşöyle buyurmaktadır:\n“Rabbinizle aranızdaki bağı birleştirin ki, mutlu\nolasınız.”19\nSalihlere gönüllerinizle bağlılığınızı devam ettirerek, Allah\n(cc) ile olan bağlarınızı berraklaştırın.\nEy evladım!\nYanına geldiklerinde, zengin ile fakir arasında farklı\nmuamele yaparsan, asla felah bulmazsın. Sabırlı fakirlere\nikram et, onlarla oturup kalmayı bereket kabul et. Resulullah\n(sav) şöyle buyurmaktadır:\n“Sabırlı fakirler kıyamet gününde Rahman’ın\ncelisleridir. (huzurundadırlar.)”20\nBugün kalpleri ile Rahmanın yanında oturanlar, yarın\nbedenleri ile O’nun huzurunda otururlar. Onlar dünyayı ve\ndünya ziynetlerini terk ederek, fakirliği zenginliğe tercih\n19 İbn-i Mâce, 1081\n20 Kenzü’l-Ummâl, 4/222", "word_count": 150, "char_count": 1150, "has_topics": false}, {"page": 49, "printed_page": 48, "title": "Mehâfetullâh — Sayfa 49", "content_html": "<p class=\"book-paragraph\">eden ve fakirlikte sabreden kişilerdir. Bu özellikler kendisinde gerçekleşen kişi, ahiretle nikahlanmıştır. Ahiret de kendisini onlara sunmuştur. Onlar da ahiretle ilgi kurarlar. Onların ahiret ile olan ilgileri gerçekleşince, onlar aradıklarının bu olmadığını görürler ve ahiretten de vazgeçerler. Onlar ahirete de kalplerinin arkasını dönerler. Allah Teala’dan haya ederek ahiretten de kaçarlar. Başkası ile nasıl birlikte olurlar?! Yaratılanla nasıl sükun bulurlar? Onunla nasıl ünsiyet peyda ederler?!</p>\n<p class=\"book-paragraph\">Onlar bütün amelleri, iyilik ve itaatleri ahirete teslim ederler ve doğruluk kanatları ile Mevlâ’nın rızasını kazanmak üzere O’na doğru uçarlar. Onlar kafesi ahirette bırakarak, varlık kafesinden kendilerini var edene doğru uçarlar. Onlar Refîk-i âlâyı, Evvel, Ahir, Zâhir ve Bâtın’ı isterler ve ona yakın olan burca vâsıl olurlar. Allah (c.c) şöyle buyuryor: َאرِĻ ْìَْ źا َīْĻَęَĉ ْā ُĩْĤا َī ِĩَĤ َאĬ َïْĭ ِĐ ْħُıَّĬوَاِ “Doğrusu onlar bizim katımızda seçkin iyi kimselerdendir.”21 Onlar, Allah Teala’nın bu ayette buyurduğu kimselerden olurlar.</p>\n<p class=\"book-paragraph\">Allah (cc) onlar hakkında; kalpleri, himmetleri ve mânâları ile bizimle birlikte, onlar özleri ile dünyada da ahirette de bizimle beraberdirler, buyurmaktadır. Allah dostları hakkında bu haller ve makamlar gerçekleşince, onların dünyaları da</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 21 Sa’d, 47</div>", "raw_text": "eden ve fakirlikte sabreden kişilerdir. Bu özellikler kendisinde\ngerçekleşen kişi, ahiretle nikahlanmıştır. Ahiret de kendisini\nonlara sunmuştur. Onlar da ahiretle ilgi kurarlar. Onların\nahiret ile olan ilgileri gerçekleşince, onlar aradıklarının bu\nolmadığını görürler ve ahiretten de vazgeçerler. Onlar ahi-\nrete de kalplerinin arkasını dönerler. Allah Teala’dan haya\nederek ahiretten de kaçarlar. Başkası ile nasıl birlikte olur-\nlar?! Yaratılanla nasıl sükun bulurlar? Onunla nasıl ünsiyet\npeyda ederler?!\nOnlar bütün amelleri, iyilik ve itaatleri ahirete teslim\nederler ve doğruluk kanatları ile Mevlâ’nın rızasını kazanmak\nüzere O’na doğru uçarlar. Onlar kafesi ahirette bırakarak,\nvarlık kafesinden kendilerini var edene doğru uçarlar. Onlar\nRefîk-i âlâyı, Evvel, Ahir, Zâhir ve Bâtın’ı isterler ve ona\nyakın olan burca vâsıl olurlar. Allah (c.c) şöyle buyuryor:\nَאرِĻ ْìَْ źا َīْĻَęَĉ ْā ُĩْĤا َī ِĩَĤ َאĬ َïْĭ ِĐ ْħُıَّĬوَاِ\n“Doğrusu onlar bizim katımızda seçkin iyi\nkimselerdendir.”21\nOnlar, Allah Teala’nın bu ayette buyurduğu kimselerden\nolurlar.\nAllah (cc) onlar hakkında; kalpleri, himmetleri ve mânâları\nile bizimle birlikte, onlar özleri ile dünyada da ahirette de\nbizimle beraberdirler, buyurmaktadır. Allah dostları hakkında\nbu haller ve makamlar gerçekleşince, onların dünyaları da\n21 Sa’d, 47", "word_count": 179, "char_count": 1312, "has_topics": false}, {"page": 50, "printed_page": 49, "title": "Mehâfetullâh — Sayfa 50", "content_html": "<p class=\"book-paragraph\">ahiretleri de boşa gitmez. Onların kalplerine ve sırlarına nisbetle, dünya ve ahiret onların önünde dürülür. Allah (cc) onları kendi varlığının dışındakilerden fâni kılarak, kendi varlığında onları var kılar. Eğer onların dünyada nasipleri varsa, ezeli ilim ve kazanın değişmemesi için, Allah (cc) onlara dünyadaki nasiplerini alsınlar diye, onların âdemiyet ve beşeriyetlerine ait hislerini geri verir. Allah Teala’nın ilmi, kazası ve kaderi ile edeplerini güzelleştirirler. Kendilerine verilenleri nefis, heva ve iradeleri doğrultusunda değil zahitlik ve terk ayağı ile alırlar. Bütün hallerde zâhirî hükümleri muhafaza ederler. Dünya işlerinde insanlara karşı cimri davranmazlar. Eğer güç yetirebilseler, bütün insanları Allah Teala’ya yaklaştırmak isterler. Onların kalplerinde mahlûkata ve sonradan yaratılmış bütün varlıklara karşı zerre miktarı bir ilgi kalmaz. Dünya seninle birlikte olduğu sürece, ahiretle hiçbir bağlantın olamaz. Ahiret seninle birlikte olduğu sürece de, Mevlâ ile hiçbir bağlantın olamaz.</p>\n<p class=\"book-paragraph\">İlminle amel et! Cahil olma! Yoksa Allah Teala’nın saptırdığı kimselerden olursun. Allah Teala’ya vuslatın bir yolu da, mallarından fakirlere vermendir. Sen sadaka vermenin Zengin ve Kerîm olan Allah (cc) ile bir alış veriş olduğunu bilmiyor mu sun? Zengin ve cömert olan Allah (cc) ile alış veriş yapan zarar eder mi? Sen Allah (cc) için zerre miktarı bir şey infak edersen O sana bir dağ verir. Sen O’nun için bir damla infak edersen, O senin için dünyada da ahirette de denizler dolusu ecir ve sevap verir.</p>", "raw_text": "ahiretleri de boşa gitmez. Onların kalplerine ve sırlarına\nnisbetle, dünya ve ahiret onların önünde dürülür. Allah (cc)\nonları kendi varlığının dışındakilerden fâni kılarak, kendi\nvarlığında onları var kılar. Eğer onların dünyada nasipleri\nvarsa, ezeli ilim ve kazanın değişmemesi için, Allah (cc)\nonlara dünyadaki nasiplerini alsınlar diye, onların âdemiyet\nve beşeriyetlerine ait hislerini geri verir. Allah Teala’nın ilmi,\nkazası ve kaderi ile edeplerini güzelleştirirler. Kendilerine\nverilenleri nefis, heva ve iradeleri doğrultusunda değil zahit-\nlik ve terk ayağı ile alırlar. Bütün hallerde zâhirî hükümleri\nmuhafaza ederler. Dünya işlerinde insanlara karşı cimri\ndavranmazlar. Eğer güç yetirebilseler, bütün insanları Allah\nTeala’ya yaklaştırmak isterler. Onların kalplerinde mahlûkata\nve sonradan yaratılmış bütün varlıklara karşı zerre miktarı\nbir ilgi kalmaz. Dünya seninle birlikte olduğu sürece, ahiretle\nhiçbir bağlantın olamaz. Ahiret seninle birlikte olduğu sürece\nde, Mevlâ ile hiçbir bağlantın olamaz.\nİlminle amel et! Cahil olma! Yoksa Allah Teala’nın sap-\ntırdığı kimselerden olursun. Allah Teala’ya vuslatın bir yolu\nda, mallarından fakirlere vermendir. Sen sadaka vermenin\nZengin ve Kerîm olan Allah (cc) ile bir alış veriş olduğunu\nbilmiyor mu sun? Zengin ve cömert olan Allah (cc) ile alış\nveriş yapan zarar eder mi? Sen Allah (cc) için zerre miktarı\nbir şey infak edersen O sana bir dağ verir. Sen O’nun için\nbir damla infak edersen, O senin için dünyada da ahirette\nde denizler dolusu ecir ve sevap verir.", "word_count": 219, "char_count": 1531, "has_topics": false}, {"page": 51, "printed_page": 50, "title": "Velîlerin Özellikleri", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Velîlerin Özellikleri</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey Cemaat!</strong></div>\n<p class=\"book-paragraph\">Allah (cc) ile alış veriş yaparsanız, ekinleriniz bereketlenir, nehirleriniz taşar, ağaçlarınız yapraklanır, dallar ve meyveler biter. İyiliği emredin, kötülüklerden sakınınız, Allah Teala’nın dinine yardım ediniz. O’nun yolunda gerekirse dostlarınıza düşman olunuz. Hayırda Allah (cc) ile dost olanın halvet ve celvette, genişlikte ve sıkıntı da, darlıkta ve rahatlıkta dostluğu devam eder. İhtiyaçlarınızı kullardan değil Azîz ve Celîl olan Allah’tan isteyin. Mutlaka insanlardan istemeniz gerekiyorsa, kalplerinizle Allah Teala’nın huzuruna girin, şüphesiz ki O, size nerelerden isteyeceğinizi ilham eder. İstekleriniz verilse de, verilmese de bunu insanlardan değil, Allah Teala’dan bilin. Allah’ın velî kulları, rızık dertlerini kalplerinden çıkarmışlardır. Onlar rızıkların ezelde ve belirli zamanlarda takdir edildiğini bilirler. Sultanlarının kapısının önünü vatan edinmi şlerdir. Allah Teala’nın fazlı, yakınlığı ve ilmiyle her şeyden müstağni olurlar. Bu haller kendisinde gerçekleşen veliler, halkın yörüngesi ve Allah Teala’nın huzuruna girmede insanlara sözcü olurlar. İnsanların kalp ellerinden tutarak Hakk’a götürür ve Hakk’ın onlara kabul ve rıza elbiselerini giydirmesini ısrarla isterler.</p>\n<p class=\"book-paragraph\">Allah Teala’nın velî kullarından biri Rahmetullâhi aleyh şöyle dedi: “Kulluğu tam gerçekleşen Allah (cc) dostları, Allah Teala’dan ne dünya ne de ahireti isterler. Onlar Allah Teala’dan kendisini isterler, başkasını değil.”</p>", "raw_text": "Velîlerin Özellikleri\nEy Cemaat!\nAllah (cc) ile alış veriş yaparsanız, ekinleriniz bereket-\nlenir, nehirleriniz taşar, ağaçlarınız yapraklanır, dallar ve\nmeyveler biter. İyiliği emredin, kötülüklerden sakınınız,\nAllah Teala’nın dinine yardım ediniz. O’nun yolunda\ngerekirse dostlarınıza düşman olunuz. Hayırda Allah (cc)\nile dost olanın halvet ve celvette, genişlikte ve sıkıntı da,\ndarlıkta ve rahatlıkta dostluğu devam eder. İhtiyaçlarınızı\nkullardan değil Azîz ve Celîl olan Allah’tan isteyin. Mut-\nlaka insanlardan istemeniz gerekiyorsa, kalplerinizle Allah\nTeala’nın huzuruna girin, şüphesiz ki O, size nerelerden\nisteyeceğinizi ilham eder. İstekleriniz verilse de, verilmese\nde bunu insanlardan değil, Allah Teala’dan bilin. Allah’ın\nvelî kulları, rızık dertlerini kalplerinden çıkarmışlardır. On-\nlar rızıkların ezelde ve belirli zamanlarda takdir edildiğini\nbilirler. Sultanlarının kapısının önünü vatan edinmi şler-\ndir. Allah Teala’nın fazlı, yakınlığı ve ilmiyle her şeyden\nmüstağni olurlar. Bu haller kendisinde gerçekleşen veliler,\nhalkın yörüngesi ve Allah Teala’nın huzuruna girmede\ninsanlara sözcü olurlar. İnsanların kalp ellerinden tutarak\nHakk’a götürür ve Hakk’ın onlara kabul ve rıza elbiselerini\ngiydirmesini ısrarla isterler.\nAllah Teala’nın velî kullarından biri Rahmetullâhi aleyh\nşöyle dedi: “Kulluğu tam gerçekleşen Allah (cc) dostları,\nAllah Teala’dan ne dünya ne de ahireti isterler. Onlar Allah\nTeala’dan kendisini isterler, başkasını değil.”", "word_count": 188, "char_count": 1472, "has_topics": true}, {"page": 52, "printed_page": 51, "title": "Mehâfetullâh — Sayfa 52", "content_html": "<p class=\"book-paragraph\">Ey Allah’ım! Bütün insanları kapına yönelt! Bu benim senden ebedi isteğimdir. Bütün işler senin elindedir. Bu benim sevap kazanacağım genel bir duadır. Allah (cc) kullarında dilediği şeyleri yapar. Kalp sağlam olursa, mahlûkata karşı rahmet ve şefkatle dolar.</p>\n<p class=\"book-paragraph\">Allah Teala’nın velî kullarından biri Rahmetullâhi aleyh şöyle dedi: Hayır işleyen çoktur, fakat günahları terk eden, ancak sâdıklardır. Sıddîk kişi büyük ve küçük bütün günahları terk eder ve şehvetleri terk etmek suretiyle verâsına dikkat eder. Sonra da müşterek mubahı terk ederek, mutlak helalı ister. Sıddîk kişiler gece ve gündüzlerinin çoğunu, Allah Teala’nın rızasını kazanmak için ibadetle geçirirler. Halkın örf ve adetlerini yırtarak, alışkanlıklarını bertaraf ederler. Sıddîk kişi hiç ummadığı yerden rızıklanır, kendisine verilir ve verileni almakla emr olunurlar, aynı zamanda eşya onlara hâlis ve sâfî hale getirilir. Çünkü o dünyalıklardan mahrum edilmiş, ihtiyaçları gönlünde kırılmış ve kırılan bütün bu ihtiyaçlarına sabır göstermiştir. Bütün hallerde istekleri geri çevrildi. Dua ediyordu duasına icabet edilmiyor, istekte bulunuyor istekleri verilmiyordu. Şikayette bulunuyor, şikayet ettiği şeyler daha da artıyor, rahatlık istiyor, rahatlık bulamıyordu. Takvalı oluyor, bir türlü çıkış kapısı bulamıyordu. Amellerinde ihlaslı oluyor, fakat bir türlü Allah Teala’ya yakınlık bulamıyordu. Sanki o Mümin ve Muvahhid olmayan kişi muamelesi görüyor ama bütün olanlara rağmen o, olayları sabırla ve sükunetle karşılıyordu. Çünkü o, sabrın; kalbi için ilaç, berraklığı ve Allah Teala’ya yakınlığı için bir sebep olduğunu, bu imtihanlardan sonra da hayrın geleceğini ve müminin</p>", "raw_text": "Ey Allah’ım! Bütün insanları kapına yönelt! Bu benim\nsenden ebedi isteğimdir. Bütün işler senin elindedir. Bu benim\nsevap kazanacağım genel bir duadır. Allah (cc) kullarında\ndilediği şeyleri yapar. Kalp sağlam olursa, mahlûkata karşı\nrahmet ve şefkatle dolar.\nAllah Teala’nın velî kullarından biri Rahmetullâhi aleyh\nşöyle dedi: Hayır işleyen çoktur, fakat günahları terk eden,\nancak sâdıklardır. Sıddîk kişi büyük ve küçük bütün günahları\nterk eder ve şehvetleri terk etmek suretiyle verâsına dikkat\neder. Sonra da müşterek mubahı terk ederek, mutlak helalı\nister. Sıddîk kişiler gece ve gündüzlerinin çoğunu, Allah\nTeala’nın rızasını kazanmak için ibadetle geçirirler. Halkın örf\nve adetlerini yırtarak, alışkanlıklarını bertaraf ederler. Sıddîk\nkişi hiç ummadığı yerden rızıklanır, kendisine verilir ve verileni\nalmakla emr olunurlar, aynı zamanda eşya onlara hâlis ve\nsâfî hale getirilir. Çünkü o dünyalıklardan mahrum edilmiş,\nihtiyaçları gönlünde kırılmış ve kırılan bütün bu ihtiyaçlarına\nsabır göstermiştir. Bütün hallerde istekleri geri çevrildi. Dua\nediyordu duasına icabet edilmiyor, istekte bulunuyor istekleri\nverilmiyordu. Şikayette bulunuyor, şikayet ettiği şeyler daha\nda artıyor, rahatlık istiyor, rahatlık bulamıyordu. Takvalı\noluyor, bir türlü çıkış kapısı bulamıyordu. Amellerinde ihlaslı\noluyor, fakat bir türlü Allah Teala’ya yakınlık bulamıyordu.\nSanki o Mümin ve Muvahhid olmayan kişi muamelesi\ngörüyor ama bütün olanlara rağmen o, olayları sabırla ve\nsükunetle karşılıyordu. Çünkü o, sabrın; kalbi için ilaç, ber-\nraklığı ve Allah Teala’ya yakınlığı için bir sebep olduğunu,\nbu imtihanlardan sonra da hayrın geleceğini ve müminin", "word_count": 225, "char_count": 1654, "has_topics": false}, {"page": 53, "printed_page": 52, "title": "Mehâfetullâh — Sayfa 53", "content_html": "<p class=\"book-paragraph\">münafıktan, muvahhidin müşrikten, samiminin riyakârdan, kahramanın korkaktan, duranın hareket edenden, sabredenin sabırsızdan, haklının haksızdan, doğrunun yalancıdan, sevenin kin besleyenden, dinin emirlerine uyanın uymayandan ayrılacağını biliyordu.</p>\n<p class=\"book-paragraph\">Allah Teala’nın veli kullarından birinin şu sözlerine kulak ver:</p>\n<p class=\"book-paragraph\">Dünyada, yarası tedavi edilen, ilaçlarının acısına sabreden ve belaların yok olmasını ümit eden kişi gibi ol. Bütün belaların ve hastalıkların kaynağı; senin mahlûkatı ortak kılman ve zararda ve faydada, vermede ve engellemede onların pay sahibi olduğunu görmendir.</p>\n<p class=\"book-paragraph\">Bütün dertlerden kurtulman ve belaların yok olması, kalbinden mahlûkatı çıkarman, kaza ve kader anında kararlı olman, insanlara başkan olma sevdasından ve onlara büyüklük taslamaktan vazgeçerek, kalbini her türlü şeylerden soyutlayıp, sırrını saflaştırman ve bütün gayretini Rabbin için tahsis etmenle olur. Bu durumlar sende gerçekleşirse; işte o zaman kalbin yükselir ve nebilerin, resûllerin, şehitlerin, salihlerin ve mukarreb meleklerin saflarına katılırsın. Bu durum sende devam ettiği sürece büyüklük, azamet ve yükseklik kazanır, ilerlersin, velâyet derecesine yükselirsin ve sana verilmesi emredilen şeyler sana verilir, velâyetten sana verilenler verilir, senin nasibin olarak verilen şeyler verilir. Mahrum kişi, bu sözleri duymaktan, O’na iman etmek ve bu vasıflara sahip zatlara hürmet etmekten nasipsiz olan kişidir.</p>", "raw_text": "münafıktan, muvahhidin müşrikten, samiminin riyakârdan,\nkahramanın korkaktan, duranın hareket edenden, sabredenin\nsabırsızdan, haklının haksızdan, doğrunun yalancıdan, seve-\nnin kin besleyenden, dinin emirlerine uyanın uymayandan\nayrılacağını biliyordu.\nAllah Teala’nın veli kullarından birinin şu sözlerine\nkulak ver:\nDünyada, yarası tedavi edilen, ilaçlarının acısına sabreden\nve belaların yok olmasını ümit eden kişi gibi ol.\nBütün belaların ve hastalıkların kaynağı; senin mahlûkatı\nortak kılman ve zararda ve faydada, vermede ve engellemede\nonların pay sahibi olduğunu görmendir.\nBütün dertlerden kurtulman ve belaların yok olması,\nkalbinden mahlûkatı çıkarman, kaza ve kader anında kararlı\nolman, insanlara başkan olma sevdasından ve onlara bü-\nyüklük taslamaktan vazgeçerek, kalbini her türlü şeylerden\nsoyutlayıp, sırrını saflaştırman ve bütün gayretini Rabbin\niçin tahsis etmenle olur. Bu durumlar sende gerçekleşirse;\nişte o zaman kalbin yükselir ve nebilerin, resûllerin, şehit-\nlerin, salihlerin ve mukarreb meleklerin saflarına katılırsın.\nBu durum sende devam ettiği sürece büyüklük, azamet ve\nyükseklik kazanır, ilerlersin, velâyet derecesine yükselirsin ve\nsana verilmesi emredilen şeyler sana verilir, velâyetten sana\nverilenler verilir, senin nasibin olarak verilen şeyler verilir.\nMahrum kişi, bu sözleri duymaktan, O’na iman etmek ve\nbu vasıflara sahip zatlara hürmet etmekten nasipsiz olan\nkişidir.", "word_count": 183, "char_count": 1419, "has_topics": false}, {"page": 54, "printed_page": 53, "title": "Mehâfetullâh — Sayfa 54", "content_html": "<p class=\"book-paragraph\">Ey geçim derdiyle meşgul olan kişiler!</p>\n<p class=\"book-paragraph\">Geçim zenginliği, bütün kârlar ve ahiret kazancı benim yanımdadır. Ben, bazen münâdi, bazen simsar, bazen bir başka şey olurum. Her şeye hakkını veririm. Ahiretle ilgili bir şey elime geçerse, onu yalnız başıma yemem. Çünkü değerli kimse, yalnız başına yemez. Allah Teala’nın cömertliğine muttalî olan kişide, cimrilikten eser göremezsin. Marifet ehline göre; Allah Teala’nın dışındaki her şey değersizdir. Cimrilik, nefisten kaynaklanır. Arifin nefsi ise; diğer insanların nefislerine göre ölü mesabesindedir. Çünkü o Allah Teala’nın vaadi ile huzur ve sükuna ermiş, Allah Teala’nın tehditlerinden dolayı da korku içerisindedir. Ey Allah’ım! Dostlarını rızıklandırdığın şeylerle, bizleri de rızıklandır.</p>\n<p class=\"book-paragraph\">َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Ey Rabbimiz! Dünyada da ahirette de bize iyilik ver ve bizi cehennem azabından koru!”22</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 22 Bakara, 201</div>", "raw_text": "Ey geçim derdiyle meşgul olan kişiler!\nGeçim zenginliği, bütün kârlar ve ahiret kazancı benim\nyanımdadır. Ben, bazen münâdi, bazen simsar, bazen bir\nbaşka şey olurum. Her şeye hakkını veririm. Ahiretle ilgili bir\nşey elime geçerse, onu yalnız başıma yemem. Çünkü değerli\nkimse, yalnız başına yemez. Allah Teala’nın cömertliğine\nmuttalî olan kişide, cimrilikten eser göremezsin. Marifet\nehline göre; Allah Teala’nın dışındaki her şey değersizdir.\nCimrilik, nefisten kaynaklanır. Arifin nefsi ise; diğer insan-\nların nefislerine göre ölü mesabesindedir. Çünkü o Allah\nTeala’nın vaadi ile huzur ve sükuna ermiş, Allah Teala’nın\ntehditlerinden dolayı da korku içerisindedir.\nEy Allah’ım! Dostlarını rızıklandırdığın şeylerle, bizleri\nde rızıklandır.\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Ey Rabbimiz! Dünyada da ahirette de bize\niyilik ver ve bizi cehennem azabından koru!”22\n22 Bakara, 201", "word_count": 139, "char_count": 952, "has_topics": false}, {"page": 55, "printed_page": 54, "title": "Bölüm Ayırıcı", "content_html": "<div class=\"section-divider-leaf\"><span class=\"leaf-ornament\">✦ ✦ ✦</span><p>Bölüm Ayırıcı Yaprak — Sayfa 55</p></div>", "raw_text": "", "word_count": 0, "char_count": 0, "has_topics": false}, {"page": 56, "printed_page": 55, "title": "Mümin Kardeşini Kendi Nefsine Tercih Etmek", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Mümin Kardeşini Kendi Nefsine Tercih Etmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Mümin Kardeşini Kendi Nefsine Tercih Etmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Mümin azık, kâfir ise faydalanma peşindedir. Mümin azık peşindedir; çünkü müminin yaşadığı hayat ona az bir dünyalık şeyle kanaat etmeyi, kazancının çoğunu ahiret hayatı için harcamayı öğretir. Mümin kişi dünya hayatında bir yolcunun yanında taşıyabildiği azık kadar mal biriktirir. Onun bütün malı ahiret hayatı içindir. O bütün kalbiyle ve himmetiyle ahirete yönelmiştir. O kalbiyle dünyadan kesilmiş, dünyaya ve dünya ehline değil bütün taatlerini ahirete göndermektedir. Eğer onun yanında güzel ve temiz yiyeceği varsa, onu fakirlere vermeyi kendi nefsine tercih eder. Zira o, ahirette kendisine o nimetten daha hayırlısının verileceği şuurundadır. Ârif ve âlim bir müminin gayretinin asıl gayesi; Allah Teala’ya yakınlık kapısına vâsıl olmaktır. Ahirete varmadan önce, dünyada iken kalbinin yaratıcısına vâsıl olmasıdır. Allah Teala’ya yakın olmak kalp adımlarının ve sır yürüyüşlerinin gayesidir. Ben senin kıyamda, rükuda,</p>", "raw_text": "Mümin Kardeşini\nKendi Nefsine Tercih Etmek\nMümin azık, kâfir ise faydalanma peşindedir. Mümin\nazık peşindedir; çünkü müminin yaşadığı hayat ona az bir\ndünyalık şeyle kanaat etmeyi, kazancının çoğunu ahiret\nhayatı için harcamayı öğretir. Mümin kişi dünya hayatında\nbir yolcunun yanında taşıyabildiği azık kadar mal biriktirir.\nOnun bütün malı ahiret hayatı içindir. O bütün kalbiyle\nve himmetiyle ahirete yönelmiştir. O kalbiyle dünyadan\nkesilmiş, dünyaya ve dünya ehline değil bütün taatlerini\nahirete göndermektedir. Eğer onun yanında güzel ve temiz\nyiyeceği varsa, onu fakirlere vermeyi kendi nefsine tercih\neder. Zira o, ahirette kendisine o nimetten daha hayırlısının\nverileceği şuurundadır. Ârif ve âlim bir müminin gayretinin\nasıl gayesi; Allah Teala’ya yakınlık kapısına vâsıl olmaktır.\nAhirete varmadan önce, dünyada iken kalbinin yaratıcısına\nvâsıl olmasıdır. Allah Teala’ya yakın olmak kalp adımlarının\nve sır yürüyüşlerinin gayesidir. Ben senin kıyamda, rükuda,", "word_count": 133, "char_count": 972, "has_topics": true}, {"page": 57, "printed_page": 56, "title": "Günahlarında Israrcı Olanların Akibetleri Acıklı Olur", "content_html": "<p class=\"book-paragraph\">secdede, uykusuz kalarak, yorgunluk çektiğini; fakat bütün bunlara rağmen kalbinin yerinde durduğunu, varlık evinden çıkamadığını ve al ışkanlıklarından vazgeçemediğini görüyorum.</p>\n<p class=\"book-paragraph\">Azîz ve Celîl olan Allah’ı istemede dürüst ol. Bu konuda doğru ve samimi olman, senin bir çok yorgunluklardan uzak olmanı sağlar. Varlık yumurtanı, doğruluk gaganla kır. Halkı görme ve onlara ba ğlanma. Duvarlarını ihlas ve tevhid kazmalarıyla yık. Zahitlik elinle, eşyayı isteyen kafesini kır. Rabbinin yakınlık denizinin sahillerine konuncaya kadar uç. İşte o zaman ezel gemicisi inâyet gemisiyle gelerek, seni Rabbinin huzuruna alır götürür. Bu dünya bir deniz, imanın ise bu denizdeki gemi gibidir. Bundan dolayı Hz. Lokman (as) oğluna şöyle nasihat etmiştir: Ey Yavrucuğum! Dünya bir deniz, iman gemi, gemici itaatler, sahil ise ahirettir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Günahlarında Israrcı Olanların Akibetleri Acıklı Olur</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Günahlarında Israrcı Olanların Akibetleri Acıklı Olur</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey günahlarında ısrarcı olanlar!..</p>\n<p class=\"book-paragraph\">Yakın bir zamanda size körlük, sağırlık, hastalık ve fakirlik gelecek. Halkın kalpleri, sizlere karşı katılaştı. Mallarınız zarar etmek, el konulmak ve çalınmak sebebiyle gidecek. Öyle ise sizler de akıllı olun ve Rabbinize tevbe ediniz. Mallarınızla Allah Teala’ya şirk koşmayınız, mallarınıza güvenmeyiniz, mallarınıza takılıp kalmayınız. Mallarınızı gönüllerinizden çıkarınız. Mallarınız evinizde ve cebinizde olsun, onları</p>", "raw_text": "secdede, uykusuz kalarak, yorgunluk çektiğini; fakat bütün\nbunlara rağmen kalbinin yerinde durduğunu, varlık evin-\nden çıkamadığını ve al ışkanlıklarından vazgeçemediğini\ngörüyorum.\nAzîz ve Celîl olan Allah’ı istemede dürüst ol. Bu konuda\ndoğru ve samimi olman, senin bir çok yorgunluklardan\nuzak olmanı sağlar. Varlık yumurtanı, doğruluk gaganla\nkır. Halkı görme ve onlara ba ğlanma. Duvarlarını ihlas\nve tevhid kazmalarıyla yık. Zahitlik elinle, eşyayı isteyen\nkafesini kır. Rabbinin yakınlık denizinin sahillerine konun-\ncaya kadar uç. İşte o zaman ezel gemicisi inâyet gemisiyle\ngelerek, seni Rabbinin huzuruna alır götürür. Bu dünya\nbir deniz, imanın ise bu denizdeki gemi gibidir. Bundan\ndolayı Hz. Lokman (as) oğluna şöyle nasihat etmiştir: Ey\nYavrucuğum! Dünya bir deniz, iman gemi, gemici itaatler,\nsahil ise ahirettir.\nGünahlarında Israrcı Olanların\nAkibetleri Acıklı Olur\nEy günahlarında ısrarcı olanlar!..\nYakın bir zamanda size körlük, sağırlık, hastalık ve fakirlik\ngelecek. Halkın kalpleri, sizlere karşı katılaştı. Mallarınız zarar\netmek, el konulmak ve çalınmak sebebiyle gidecek. Öyle ise\nsizler de akıllı olun ve Rabbinize tevbe ediniz. Mallarınızla\nAllah Teala’ya şirk koşmayınız, mallarınıza güvenmeyiniz,\nmallarınıza takılıp kalmayınız. Mallarınızı gönüllerinizden\nçıkarınız. Mallarınız evinizde ve cebinizde olsun, onları", "word_count": 180, "char_count": 1344, "has_topics": true}, {"page": 58, "printed_page": 57, "title": "Mehâfetullâh — Sayfa 58", "content_html": "<p class=\"book-paragraph\">hizmetçilerinizin ve vekillerinizin eline bırakın. Daima ölümü gözetin! Hırsınızı azaltın! Emellerinizi kısın! Beyazid el-Bistâmî rahmetullâhi aleyh şöyle buyurdu: Ârif olan kişi, Allah Teala’dan ne dünya ister ne de ahiret; o ancak Mevlâ’sını ister.</p>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Kalbinle Allah Teala’ya dön! Allah Teala’ya tevbe eden kişi O’na dönmüştür. Zira Cenâb-ı Hakk şöyle buyuruyor: ْħِّכُÖ رَ ĵٰĤاِ اĳُٓ×Ļ۪Ĭوَاَ “Rabbiniz’e dönün”23 Bu ayetin manası; Rabbinize dönün ve her şeyinizle O’na teslim olun, nefislerinizi O’na teslim edin. O’nun kaza ve kaderinin, emir ve yasaklarının, işleri idare etmek üzere çekip çevirmesinin önüne nefsinizi atınız. Kalplerinizi dilsiz, elsiz, ayaksız, gözsüz, nasıl ve niçinsiz, çekişmeden ve karşı koymadan, bilakis her şeyde O’na uyum ve tasdik içerisinde O’nun önüne bırakınız. Ve ‘Bütün işler doğru, kader hak, ezeldeki takdirat haktır’ deyiniz. İşte böyle olduğunuz zaman, şüphesiz kalpleriniz O’na yönelmiş ve O’nu müşahede etmiş olur. Kalpleriniz bu halde iken, hiçbir şeye ünsiyet etmez, bilakis arşın altından yeryüzüne kadar, her şeyden ürperti duyarak bütün mahlûkattan kaçar. Artık Mevlâ’nın sevgisiyle</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 23 Zümer, 54</div>", "raw_text": "hizmetçilerinizin ve vekillerinizin eline bırakın. Daima ölümü\ngözetin! Hırsınızı azaltın! Emellerinizi kısın!\nBeyazid el-Bistâmî rahmetullâhi aleyh şöyle buyurdu:\nÂrif olan kişi, Allah Teala’dan ne dünya ister ne de ahiret;\no ancak Mevlâ’sını ister.\nEy evladım!\nKalbinle Allah Teala’ya dön! Allah Teala’ya tevbe eden\nkişi O’na dönmüştür. Zira Cenâb-ı Hakk şöyle buyuruyor:\nْħِّכُÖ رَ ĵٰĤاِ اĳُٓ×Ļ۪Ĭوَاَ\n“Rabbiniz’e dönün”23\nBu ayetin manası; Rabbinize dönün ve her şeyinizle\nO’na teslim olun, nefislerinizi O’na teslim edin. O’nun kaza\nve kaderinin, emir ve yasaklarının, işleri idare etmek üzere\nçekip çevirmesinin önüne nefsinizi atınız. Kalplerinizi dilsiz,\nelsiz, ayaksız, gözsüz, nasıl ve niçinsiz, çekişmeden ve karşı\nkoymadan, bilakis her şeyde O’na uyum ve tasdik içerisinde\nO’nun önüne bırakınız. Ve ‘Bütün işler doğru, kader hak,\nezeldeki takdirat haktır’ deyiniz. İşte böyle olduğunuz zaman,\nşüphesiz kalpleriniz O’na yönelmiş ve O’nu müşahede etmiş\nolur. Kalpleriniz bu halde iken, hiçbir şeye ünsiyet etmez,\nbilakis arşın altından yeryüzüne kadar, her şeyden ürperti\nduyarak bütün mahlûkattan kaçar. Artık Mevlâ’nın sevgisiyle\n23 Zümer, 54", "word_count": 160, "char_count": 1153, "has_topics": false}, {"page": 59, "printed_page": 58, "title": "Meşâyıha Saygı Göstermek", "content_html": "<p class=\"book-paragraph\">bütün mahlûkattan uzaklaşır. Adeta diğer yaratılanlarla olan bağını koparır ve bu hal üzere kalır.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Meşâyıha Saygı Göstermek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Şeyhlere; onlarla birlikte olan ve onların Allah (cc) ile olan bazı hallerine muttalî olanlar ancak güzel edep ile saygı gösterirler. Allah dostları, övme ve yermeyi, yaz ve kış, gece ve gündüz gibi saymışlardır. Onlar, her ikisini de Allah Teala’dan görürler. Çünkü o ikisinide Allah Teala’dan başka kimsenin getirmeye gücü yetmez. Artık onlar için bu durum gerçekleşince, onlar kendilerini övenlere itibar etmez, kendilerini yerenlere de savaş açmazlar ve kimseyle de meşgul olmazlar. Onların kalplerinden halka karşı sevgi ve kınama çıkmıştır. Onlar halkı ne severler ne de kınarlar, bilakis halka merhamet ederler.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Dünyalık İçin İlim Öğrenmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Doğru olmayan ilim sana fayda verir mi? Allah (cc) ilmin yüzünden senin ayağını kaydırmış. Sen insanlar için öğreniyor, onlar için namaz kılıyor ve onlar için oruç tutuyorsun. Böylece halk seni kabul ediyor, mallarını sana veriyor, evlerinde ve sohbetlerinde seni methediyorlar. Farzet ki; sen bütün bunları elde ettin, bütün bunlar sende gerçekleşti, peki ölüm, azap, darlık ve ahiret hayatının dehşetli olaylarıyla karşılaştığın zaman, seninle onlar arasına perdeler konacak, onlar sana gelen zararlardan hiç birine engel olamayacaklar. Onlardan kazandığın malların</p>", "raw_text": "bütün mahlûkattan uzaklaşır. Adeta diğer yaratılanlarla olan\nbağını koparır ve bu hal üzere kalır.\nMeşâyıha Saygı Göstermek\nŞeyhlere; onlarla birlikte olan ve onların Allah (cc) ile\nolan bazı hallerine muttalî olanlar ancak güzel edep ile\nsaygı gösterirler. Allah dostları, övme ve yermeyi, yaz ve\nkış, gece ve gündüz gibi saymışlardır. Onlar, her ikisini de\nAllah Teala’dan görürler. Çünkü o ikisinide Allah Teala’dan\nbaşka kimsenin getirmeye gücü yetmez. Artık onlar için\nbu durum gerçekleşince, onlar kendilerini övenlere itibar\netmez, kendilerini yerenlere de savaş açmazlar ve kimseyle\nde meşgul olmazlar. Onların kalplerinden halka karşı sevgi\nve kınama çıkmıştır. Onlar halkı ne severler ne de kınarlar,\nbilakis halka merhamet ederler.\nDünyalık İçin İlim Öğrenmek\nDoğru olmayan ilim sana fayda verir mi? Allah (cc)\nilmin yüzünden senin ayağını kaydırmış. Sen insanlar\niçin öğreniyor, onlar için namaz kılıyor ve onlar için oruç\ntutuyorsun. Böylece halk seni kabul ediyor, mallarını sana\nveriyor, evlerinde ve sohbetlerinde seni methediyorlar.\nFarzet ki; sen bütün bunları elde ettin, bütün bunlar sende\ngerçekleşti, peki ölüm, azap, darlık ve ahiret hayatının\ndehşetli olaylarıyla karşılaştığın zaman, seninle onlar ara-\nsına perdeler konacak, onlar sana gelen zararlardan hiç\nbirine engel olamayacaklar. Onlardan kazandığın malların", "word_count": 190, "char_count": 1340, "has_topics": true}, {"page": 60, "printed_page": 59, "title": "İslam Kelime-i Şehadet Üzerine Bina Edilmiştir", "content_html": "<p class=\"book-paragraph\">sefasını başkaları sürerken, sen ise onların cezasını çekiyor ve hesabını veriyor olacaksın.</p>\n<p class=\"book-paragraph\">Ey dünyalık tedbirlerini alan kişi! Ey Mahrum kişi! Dünyada perişan bir işçi olduğun gibi, yarın cehennem azabıyla da perişan olacaksın.</p>\n<p class=\"book-paragraph\">İbadet bir sanattır, ibadetin sanatkarları da velîlerdir. Abdallar; ihlas sahibi ve daima Allah (cc) ile beraber ve O’na yakın olan kişilerdir. İlimleri ile amel eden âlimler, yeryüzünde Allah Teala’nın halifesi ve resûllerinin vekilleridirler. Ey dünya heveslileri! Ey laklaka ile meşgul olanlar! Ey zahirleri ile anlayıp, bâtınları ile cahil olanlar!</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">İslam Kelime-i Şehadet Üzerine Bina Edilmiştir</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Bu halinle sen hiçbir şey değilsin, Müslümanlığın sağlam değildir. İslam; kelime-i şehâdet üzere bina edilen bir dindir. “Lâ ilâhe illallah” sözünü diyorsun, bir taraftan da yalan söylüyorsun. Kalbinde bir sürü ilah var. Senin hükümdardan ve mahallendeki yöneticinden korkman, senin ilahındır. Kazancına, kârına, etrafına, gücüne, duymana, görmene ve yakalamana güvenmen senin ilahındır. Zararı, faydayı, vermeyi, engellemeyi insanlardan görmen senin ilahındır. İnsanların çoğu, kalpleriyle Hakk’a dayandıklarını söylüyorlar; oysaki onlar gerçekte kalpleriyle bu şeylere dayanıyorlar. Onlar alışkanlıkları gereği, kalpleriyle değil, dilleriyle Hakk’a dayandıklarını söylüyorlar. Oysaki kendilerine bu gerçeği söyleyen kişiyi de, hemen aralarından uzaklaştırıyorlar ve</p>", "raw_text": "sefasını başkaları sürerken, sen ise onların cezasını çekiyor\nve hesabını veriyor olacaksın.\nEy dünyalık tedbirlerini alan kişi! Ey Mahrum kişi! Dün-\nyada perişan bir işçi olduğun gibi, yarın cehennem azabıyla\nda perişan olacaksın.\nİbadet bir sanattır, ibadetin sanatkarları da velîlerdir.\nAbdallar; ihlas sahibi ve daima Allah (cc) ile beraber ve O’na\nyakın olan kişilerdir. İlimleri ile amel eden âlimler, yeryüzünde\nAllah Teala’nın halifesi ve resûllerinin vekilleridirler.\nEy dünya heveslileri! Ey laklaka ile meşgul olanlar! Ey\nzahirleri ile anlayıp, bâtınları ile cahil olanlar!\nİslam Kelime-i Şehadet Üzerine Bina Edilmiştir\nEy evladım!\nBu halinle sen hiçbir şey değilsin, Müslümanlığın sağlam\ndeğildir. İslam; kelime-i şehâdet üzere bina edilen bir dindir.\n“Lâ ilâhe illallah” sözünü diyorsun, bir taraftan da yalan\nsöylüyorsun. Kalbinde bir sürü ilah var. Senin hükümdardan\nve mahallendeki yöneticinden korkman, senin ilahındır.\nKazancına, kârına, etrafına, gücüne, duymana, görmene\nve yakalamana güvenmen senin ilahındır. Zararı, faydayı,\nvermeyi, engellemeyi insanlardan görmen senin ilahındır.\nİnsanların çoğu, kalpleriyle Hakk’a dayandıklarını söylüyorlar;\noysaki onlar gerçekte kalpleriyle bu şeylere dayanıyorlar.\nOnlar alışkanlıkları gereği, kalpleriyle değil, dilleriyle Hakk’a\ndayandıklarını söylüyorlar. Oysaki kendilerine bu gerçeği\nsöyleyen kişiyi de, hemen aralarından uzaklaştırıyorlar ve", "word_count": 182, "char_count": 1411, "has_topics": true}, {"page": 61, "printed_page": 60, "title": "Mehâfetullâh — Sayfa 61", "content_html": "<p class=\"book-paragraph\">şöyle diyorlar; bu gibi söyler bize nasıl söylenir!. Biz Müslüman değil miyiz? Fakat onlar, yarın kıyamet gününde bütün rezilliklerini ve rüsvalıklarını göreceklerdir. Yazıklar olsun sana! “Lâ ilâhe” ‘hiçbir ilah yoktur’ diyor ve küllî bir nefiy yapıyor, bütün mabudları reddediyorsun, “illallah” ‘ancak Allah (cc) vardır’ diyerekten de başkaları için değil sadece Allah Teala’yı külli bir ispata gidiyorsun. Her ne zaman ki, kalbin Hakk’ın dışında bir şeye güvenirse, o zaman bu ispatında sen yalan söylemiş olursun. O güvendiğin şey, senin ilahın olmuş olur, senin zâhir görüntünün hiçbir itibarı yoktur. Asıl inanan, birleyen, ihlaslı, takvâ ve verâ sahibi olan, zâhit olan, kesin inanan, ârif ve amil olan kalptir. Kalp kumandandır. Kalbin dışındakiler kalbe nazaran ordu ve tebaa mesabesindedir.</p>\n<p class=\"book-paragraph\">“Lâ ilâhe illallah” ‘Allah Teala’dan başka ilah yoktur’ sözünü önce kalbinle sonra da dilinle söyle, başkasına değil sadece O’na dayan ve güven. Zahirini Hakk’ın hükümleriyle meşgul ederken, bâtınını da Hakk’la meşgul et. Dış görünüş üzere olan hayrı ve şerri bırak, iç dünyanı hayrı ve şerri yaratan Allah (cc) ile meşgul et. Allah’ı tanıyan insan O’nun önünde boyun eğer, O’nun önünde dili tutulur, O’na ve Salih kullarına karşı alçakgönüllü olur. Gayreti, tasası ve ağlaması katbekat olur. Allah Teala’ya karşı korkusu, ürpertisi ve utanması artar. Geçmiş zamanlarda yapmış olduğu hatalardan dolayı, pişmanlığı artar. Elde ettiği marifet, ilim ve yakınlığın elinden gideceği korkusuyla, şiddetli bir endişe içerisindedir. Çünkü Allah (cc) şöyle buyuruyor:</p>", "raw_text": "şöyle diyorlar; bu gibi söyler bize nasıl söylenir!. Biz Müslü-\nman değil miyiz? Fakat onlar, yarın kıyamet gününde bütün\nrezilliklerini ve rüsvalıklarını göreceklerdir.\nYazıklar olsun sana! “Lâ ilâhe” ‘hiçbir ilah yoktur’\ndiyor ve küllî bir nefiy yapıyor, bütün mabudları reddedi-\nyorsun, “illallah” ‘ancak Allah (cc) vardır’ diyerekten\nde başkaları için değil sadece Allah Teala’yı külli bir ispata\ngidiyorsun. Her ne zaman ki, kalbin Hakk’ın dışında bir\nşeye güvenirse, o zaman bu ispatında sen yalan söylemiş\nolursun. O güvendiğin şey, senin ilahın olmuş olur, senin\nzâhir görüntünün hiçbir itibarı yoktur. Asıl inanan, birleyen,\nihlaslı, takvâ ve verâ sahibi olan, zâhit olan, kesin inanan, ârif\nve amil olan kalptir. Kalp kumandandır. Kalbin dışındakiler\nkalbe nazaran ordu ve tebaa mesabesindedir.\n“Lâ ilâhe illallah” ‘Allah Teala’dan başka ilah\nyoktur’ sözünü önce kalbinle sonra da dilinle söyle, baş-\nkasına değil sadece O’na dayan ve güven. Zahirini Hakk’ın\nhükümleriyle meşgul ederken, bâtınını da Hakk’la meşgul et.\nDış görünüş üzere olan hayrı ve şerri bırak, iç dünyanı hayrı\nve şerri yaratan Allah (cc) ile meşgul et. Allah’ı tanıyan insan\nO’nun önünde boyun eğer, O’nun önünde dili tutulur, O’na\nve Salih kullarına karşı alçakgönüllü olur. Gayreti, tasası ve\nağlaması katbekat olur. Allah Teala’ya karşı korkusu, ürper-\ntisi ve utanması artar. Geçmiş zamanlarda yapmış olduğu\nhatalardan dolayı, pişmanlığı artar. Elde ettiği marifet, ilim\nve yakınlığın elinden gideceği korkusuyla, şiddetli bir endişe\niçerisindedir. Çünkü Allah (cc) şöyle buyuruyor:", "word_count": 228, "char_count": 1567, "has_topics": false}, {"page": 62, "printed_page": 61, "title": "Mümin Günahlarına Ağlar", "content_html": "<p class=\"book-paragraph\">ُïĺ ۪óُĺ َא ĩِĤ َّאلٌđَĘ َّכَÖ رَ اِنَّ “Rabbin, istediğini hakkıyla yapandır.”24 نَĳُĥْـَٔ ùُĺ ْħُİ وَ ُģَđ ْęَĺ َّא ĩَĐ ُģْـَٔ ùُĺ َź “Allah, yaptığından sorumlu tutulamaz; onlar ise sorguya çekileceklerdir.”25</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Mümin Günahlarına Ağlar</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Mümin iki görüş arasında gider gelir. Geçmişte yaptığı hataları, günahları, cehaletleri, boş çırpınışlarını düşündükçe, haya ve edebinden dolayı gözünden yaşlar akmaya başlar ve sorguya çekileceğim diye, tir tir titremeye başlar. Amelleri kabul mü edilecek, yoksa red mi edilecek? Kendisine verilen nimetler elinden çekilip alınacak mı? Yoksa bulunduğu hal üzere serbest mi bırakılacak? Kıyamet gününde müminler arasında mı, yoksa kâfirler arasında mı olacağım, diye geleceği hakkında endişeli bir bekleyiş içerisindedir. Bundan dolayı, Resulullah (sav) şöyle buyurmuştur:</p>\n<p class=\"book-paragraph\">“Ben sizin içinizde Allah Teala’yı en çok tanıyanınız ve ondan en çok korkanınızım.”26 Ariflerin içersinde bu mertebeye ulaşanlar, pek az ve nadirdir. Ancak, ezelde kendilerine bu nitelikler okunanlar, 24 Hûd, 107</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 25 Enbiyâ, 23</div>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 26 Müslim, 1108; Buhari, 4776</div>", "raw_text": "ُïĺ ۪óُĺ َא ĩِĤ َّאلٌđَĘ َّכَÖ رَ اِنَّ\n“Rabbin, istediğini hakkıyla yapandır.”24\nنَĳُĥْـَٔ ùُĺ ْħُİ وَ ُģَđ ْęَĺ َّא ĩَĐ ُģْـَٔ ùُĺ َź\n“Allah, yaptığından sorumlu tutulamaz; onlar\nise sorguya çekileceklerdir.”25\nMümin Günahlarına Ağlar\nMümin iki görüş arasında gider gelir. Geçmişte yaptığı\nhataları, günahları, cehaletleri, boş çırpınışlarını düşündükçe,\nhaya ve edebinden dolayı gözünden yaşlar akmaya başlar ve\nsorguya çekileceğim diye, tir tir titremeye başlar. Amelleri\nkabul mü edilecek, yoksa red mi edilecek? Kendisine verilen\nnimetler elinden çekilip alınacak mı? Yoksa bulunduğu hal\nüzere serbest mi bırakılacak? Kıyamet gününde müminler\narasında mı, yoksa kâfirler arasında mı olacağım, diye ge-\nleceği hakkında endişeli bir bekleyiş içerisindedir. Bundan\ndolayı, Resulullah (sav) şöyle buyurmuştur:\n“Ben sizin içinizde Allah Teala’yı en çok tanı-\nyanınız ve ondan en çok korkanınızım.”26\nAriflerin içersinde bu mertebeye ulaşanlar, pek az ve\nnadirdir. Ancak, ezelde kendilerine bu nitelikler okunanlar,\n24 Hûd, 107\n25 Enbiyâ, 23\n26 Müslim, 1108; Buhari, 4776", "word_count": 150, "char_count": 1071, "has_topics": true}, {"page": 63, "printed_page": 62, "title": "Mehâfetullâh — Sayfa 63", "content_html": "<p class=\"book-paragraph\">verilenler müstesnadır. Bu kişiler, nihayetinde döneceği, varacağı yeri bilirler. Bu niteliklerde olan ârif kişinin sırrı, levh-i mahfuzda kendisine ait olan şeyleri okur, sonra da kalbi ona muttalî olur. Ârifin sırrı, kalbe muttalî olduğu şeyleri gizlemesini, nefsin bu sırra muttalî olmamasını emreder. Bu işin başlangıcı, sağlam Müslüman olmak, Allah Teala’nın emirlerine sarılmak, yasaklarından da kaçınmak ve afetlere, belalara karşı sabretmekle olur. Bu işin sonu da, Allah Teala’nın dışındaki her şeyi terk edip, züht sahibi olmak, yanında altın ile toprak, övme ile yerme, verme ile engel olma, cennet ile cehennem, nimetle külfet, zenginle fakir, halkın varlığı ile yokluğunun eşit olmasıyla olur. Arifin zatında bu nitelikler gerçekleşince, artık o kişinin arkasında Allah (cc) vardır. Sonra bu ârif olan kişiye, mahlûkata karşı Allah Teala’dan emirlik, velâyet gelir. Allah Teala’nın heybeti ve nuru kendisinde tecelli ettiğinden, ârif olan bu zatı gören herkes, ondan faydalanır.</p>\n<p class=\"book-paragraph\">َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Ey Rabbimiz! Dünyada da ahirette de bize iyilik ver ve bizi cehennem azabından koru!”27</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 27 Bakara, 201</div>", "raw_text": "verilenler müstesnadır. Bu kişiler, nihayetinde döneceği,\nvaracağı yeri bilirler. Bu niteliklerde olan ârif kişinin sırrı,\nlevh-i mahfuzda kendisine ait olan şeyleri okur, sonra da\nkalbi ona muttalî olur. Ârifin sırrı, kalbe muttalî olduğu\nşeyleri gizlemesini, nefsin bu sırra muttalî olmamasını em-\nreder. Bu işin başlangıcı, sağlam Müslüman olmak, Allah\nTeala’nın emirlerine sarılmak, yasaklarından da kaçınmak\nve afetlere, belalara karşı sabretmekle olur. Bu işin sonu\nda, Allah Teala’nın dışındaki her şeyi terk edip, züht sahibi\nolmak, yanında altın ile toprak, övme ile yerme, verme ile\nengel olma, cennet ile cehennem, nimetle külfet, zenginle\nfakir, halkın varlığı ile yokluğunun eşit olmasıyla olur. Arifin\nzatında bu nitelikler gerçekleşince, artık o kişinin arkasında\nAllah (cc) vardır. Sonra bu ârif olan kişiye, mahlûkata karşı\nAllah Teala’dan emirlik, velâyet gelir. Allah Teala’nın heybeti\nve nuru kendisinde tecelli ettiğinden, ârif olan bu zatı gören\nherkes, ondan faydalanır.\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Ey Rabbimiz! Dünyada da ahirette de bize\niyilik ver ve bizi cehennem azabından koru!”27\n27 Bakara, 201", "word_count": 178, "char_count": 1200, "has_topics": false}, {"page": 64, "printed_page": 63, "title": "Kur’ân-ı Kerîm İle Amel Etmek", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kur’ân-ı Kerîm İle Amel Etmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kur’ân-ı Kerîm İle Amel Etmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Hasan-ı Basrî -rahmetûllâhi aleyh- diyor ki:</p>\n<p class=\"book-paragraph\">“Dünyayı hakir görünüz; çünkü dünya ancak kendine değer verilmediği zaman güzel olur.”</p>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Kur’an’la amel seni O’nun menzilinde, sünnetle amel de seni nebîmiz Hz. Muhammed (sav)’ in huzurunda durdurur. Hz. Muhammed (sav) kalbi ve himmetiyle velîlerin çevresindedir. Zira Hz. Peygamber (sav) velileri güzelleştirip, buhurlaştırır. Velilerin sırlarını saflaştıran, süsleyen ve yakınlık kapısının açılmasını sağlayan odur. Kalpler, sırlar ve onların Rabbi olan Allah (cc) arasında o bir elçidir. Kalplerin ona doğru attığı her adımda sevinçleri artar. Bu hallerle rızıklanan her bir kişinin, şükrünün ve itaatının artması gerekir. Bunların dışındaki sevinç ise hevesten ibarettir.</p>", "raw_text": "Kur’ân-ı Kerîm İle\nAmel Etmek\nHasan-ı Basrî -rahmetûllâhi aleyh- diyor ki:\n“Dünyayı hakir görünüz; çünkü dünya ancak kendine\ndeğer verilmediği zaman güzel olur.”\nEy evladım!\nKur’an’la amel seni O’nun menzilinde, sünnetle amel\nde seni nebîmiz Hz. Muhammed (sav)’ in huzurunda dur-\ndurur. Hz. Muhammed (sav) kalbi ve himmetiyle velîlerin\nçevresindedir. Zira Hz. Peygamber (sav) velileri güzelleştirip,\nbuhurlaştırır. Velilerin sırlarını saflaştıran, süsleyen ve yakınlık\nkapısının açılmasını sağlayan odur. Kalpler, sırlar ve onların\nRabbi olan Allah (cc) arasında o bir elçidir. Kalplerin ona\ndoğru attığı her adımda sevinçleri artar. Bu hallerle rızıkla-\nnan her bir kişinin, şükrünün ve itaatının artması gerekir.\nBunların dışındaki sevinç ise hevesten ibarettir.", "word_count": 105, "char_count": 764, "has_topics": true}, {"page": 65, "printed_page": 64, "title": "Kaderle Çekişenin Akibeti Helaktır", "content_html": "<p class=\"book-paragraph\">Cahil kişi, dünyada sevinç içerisindedir, âlim kimse ise dünyada daima gamlıdır. Cahil kişi kadere karşı gelir ve çekişir. Alim kişi ise, kadere boyun eğerek rıza gösterir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kaderle Çekişenin Akibeti Helaktır</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey miskin! Kadere karşı gelme, kaderle çekişme ki; yoksa helak olursun. İşin başı, Allah Teala’nın fiillerine rıza göstermen, kalbini halktan soyutlayarak, bütün yaratılanların Rabbi olan Hakk (cc) ile buluşturmandır. Hakk’a, O’nun peygamberlerine ve Salih kullarına bağlılığını devam ettirdiğin sürece, kalbinle sırrınla ve manan ile O’na kavuşursun. Eğer salih zatlara hizmet etmeye gücün yetiyorsa yap. Zira hem dünyada, hem de ahirette senin için bu en hayırlıdır. Bütün dünyaya sahip olsan, fakat o salih kulların kalbi gibi bir kalbin yoksa; sen gerçekte zerre miktarı bir şeye sahip değilsin demektir. Kalbini Allah (cc) için düzelten ve aynı zamanda dünya ve ahirette onunla beraber olan kimse, avam ile havas arasında Allah Teala’nın hükmü ile hükmeder.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Dünya İşlerinde Hırslı Ahiret İşlerinde Tembelsin</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Senin gücünü biliyorum. Allah Teala’nın dostlarına göre sen nesin? Senin bütün gayretin ve çaban yemek, içmek, giymek, evlenmek, dünyalık biriktirmek ve dünyaya karşı hırslı olmaktır. Sen dünya işlerinde çok gayretlisin, ahiret işlerinde ise oldukça tembelsin. Sen böyle yapmakla etleniyorsun ve kabir haşereleri ve böcek-</p>", "raw_text": "Cahil kişi, dünyada sevinç içerisindedir, âlim kimse ise\ndünyada daima gamlıdır. Cahil kişi kadere karşı gelir ve\nçekişir. Alim kişi ise, kadere boyun eğerek rıza gösterir.\nKaderle Çekişenin Akibeti Helaktır\nEy miskin! Kadere karşı gelme, kaderle çekişme ki;\nyoksa helak olursun. İşin başı, Allah Teala’nın fiillerine\nrıza göstermen, kalbini halktan soyutlayarak, bütün yara-\ntılanların Rabbi olan Hakk (cc) ile buluşturmandır. Hakk’a,\nO’nun peygamberlerine ve Salih kullarına bağlılığını devam\nettirdiğin sürece, kalbinle sırrınla ve manan ile O’na kavu-\nşursun. Eğer salih zatlara hizmet etmeye gücün yetiyorsa\nyap. Zira hem dünyada, hem de ahirette senin için bu en\nhayırlıdır. Bütün dünyaya sahip olsan, fakat o salih kulların\nkalbi gibi bir kalbin yoksa; sen gerçekte zerre miktarı bir\nşeye sahip değilsin demektir. Kalbini Allah (cc) için düzelten\nve aynı zamanda dünya ve ahirette onunla beraber olan\nkimse, avam ile havas arasında Allah Teala’nın hükmü\nile hükmeder.\nDünya İşlerinde Hırslı Ahiret İşlerinde Tembelsin\nYazıklar olsun sana! Senin gücünü biliyorum. Allah\nTeala’nın dostlarına göre sen nesin? Senin bütün gayretin\nve çaban yemek, içmek, giymek, evlenmek, dünyalık birik-\ntirmek ve dünyaya karşı hırslı olmaktır. Sen dünya işlerinde\nçok gayretlisin, ahiret işlerinde ise oldukça tembelsin. Sen\nböyle yapmakla etleniyorsun ve kabir haşereleri ve böcek-", "word_count": 197, "char_count": 1370, "has_topics": true}, {"page": 66, "printed_page": 65, "title": "Mehâfetullâh — Sayfa 66", "content_html": "<p class=\"book-paragraph\">lerine kendini yem yapmaya hazırlıyorsun. Resulullah (sav) şöyle buyuruyor:</p>\n<p class=\"book-paragraph\">“Allah Teala’nın sabah akşam; Ey Ademoğlu!</p>\n<p class=\"book-paragraph\">Ölüm için doğun, harap olması için yapın, düşmanlar için biriktirin, diye seslenen meleği vardır.”28 Mümin bütün tasarruflarında iyi niyetlidir, sadece dünya için çalışmaz; dünyada ahireti için mescitler, köprüler, okullar, dergahlar bina eder. Müslümanların yollarını düzeltir, dullara, fakirlere ve bunların dışında yardım edilmesi gereken herkese yardım yapar. Bütün bunları tabiatı, hevası ve nefsi için yapmaz, ahirette karşılığını almak için yapar. İnsanoğlu doğru olduğu zaman, her halükarda Hakk (cc) ile beraber olur. O varlığıyla da, yokluğuyla da Hakk (cc) ile beraber olur. O, nebîlere ve resûllere bağlanır. Onların getirdiklerini sözlü ve ameli olarak kabul eder ve onların getirdiklerine yakînen iman eder. Hem dünyada, hem de ahirette resûllerle birlikte olur.</p>\n<p class=\"book-paragraph\">Allah Teala’yı zikreden kişi, ebedi olarak diridir. O bir hayattan diğer bir hayata geçer. Bir anın dışında, onun için ebedi olarak ölüm yoktur. Kulun kalbine zikir yerleştiği zaman, diliyle zikretmese de, o devamlı zikir halindedir. Allah Teala’yı zikre devam eden kulun, her an O’na muvafakatı, O’nun rızasına ve kaderine boyun eğmesi de devam eder. Zira yaz mevsimi geldiğinde O’nu inkar etsek, O sıcağı ile bizi yalanlar. Kışın geldiğini de kabul etmezsek, kış soğuğu ile bize gerçeği isbat ettirir. Eğer biz Allah Teala’ya boyun</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 28 Isfehani, El-Mekasidu’l-Uzma, 517; Suyuti, Camiu’s-Sağir, 8053</div>", "raw_text": "lerine kendini yem yapmaya hazırlıyorsun. Resulullah (sav)\nşöyle buyuruyor:\n“Allah Teala’nın sabah akşam; Ey Ademoğlu!\nÖlüm için doğun, harap olması için yapın, düşman-\nlar için biriktirin, diye seslenen meleği vardır.”28\nMümin bütün tasarruflarında iyi niyetlidir, sadece dünya\niçin çalışmaz; dünyada ahireti için mescitler, köprüler, okul-\nlar, dergahlar bina eder. Müslümanların yollarını düzeltir,\ndullara, fakirlere ve bunların dışında yardım edilmesi ge-\nreken herkese yardım yapar. Bütün bunları tabiatı, hevası\nve nefsi için yapmaz, ahirette karşılığını almak için yapar.\nİnsanoğlu doğru har_count": 1304, "has_topics": true}, {"page": 68, "printed_page": 67, "title": "Mehâfetullâh — Sayfa 68", "content_html": "<p class=\"book-paragraph\">Köpekleri de mağaranın girişinde ön ayaklarını uzatmış yatmakta idi. Eğer onların durumlarına muttalî olsa idin, dönüp onlardan kaçardın ve gördüklerin yüzünden için korku ile dolardı.”29 Allah dostları insanların en akıllılarıdır. Her an bütün işlerinde Rablerinden mağfiret, kurtuluş umarlar. Onların bütün gayret ve çalışmaları bunun içindir.</p>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Cehennemliklerin yaptıklarını yapıyorsun, bir taraftan da cenneti kazanmayı umuyorsun. Hiç olmayacak yerde, tamahkarlık yapıyorsun. Ödünç olarak sana verilen şeyleri senin zannetme. Geçici olan şeylere aldanma. Bunlar yakında senin elinden alınır ha!. Allah (cc) yaşadığın sürece O’na itaat edesin diye, hayatı sana ödünç olarak vermiştir. Oysa ki sen onu kendi mülkün zannettin ve istediğin şeyleri o dünyada yaptın.</p>\n<p class=\"book-paragraph\">Sağlık da aynen hayat gibi sana verilmiş bir emanettir. Zenginlik de bir emanettir. Emniyet, makam mevki, senin yanındaki bütün nimetler sana verilmiş bir emanettir. Sakın ha! Bu emanetleri zâyi etme, zira bir gün bu emanetler senden istenecek ve bütün bu nimetlerden hesaba çekileceksin. Elinizdeki bütün nimetler, Allah’tandır. O halde siz de bu nimetlerin karşılığı olan itaatı yapabilmek için, Allah Teala’dan yardım dileyin. Sizlerin arzuladığı şeyleri, Allah (cc) dostları birer engel kabul ederler. Onlar, dünya ve ahirette Allah (cc) ile bulunmanın dışında bir şey arzulamazlar.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 29 Kehf, 18</div>", "raw_text": "Köpekleri de mağaranın girişinde ön ayaklarını\nuzatmış yatmakta idi. Eğer onların durumlarına\nmuttalî olsa idin, dönüp onlardan kaçardın ve\ngördüklerin yüzünden için korku ile dolardı.”29\nAllah dostları insanların en akıllılarıdır. Her an bütün\nişlerinde Rablerinden mağfiret, kurtuluş umarlar. Onla iv>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Rızık Konusunda Aldırış Etmeyin</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Rızık Konusunda Endişelenmemek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Rızkını dert etme. Senin rızık peşinde koşmandan onu istemenden daha çok, o seni ister. Bugünün rızkını bulduğun zaman, yarınki rızkı dert edinme. Dün geçtiği gibi, yarın da ne olacağını bilemiyorsun. Yarına kavuşacak mısın, kavuşamayacak mısın? Sen ânınla meşgul ol. Sen Allah Teala’yı gerçek manada tanımış olsaydın; rızkı dert edinmeyi bırakır kendini tamamen O’na verirdin. Allah Teala’nın azameti, büyüklüğü senin ondan bir şey istemeni engellerdi. Allah Teala’yı gerçekten tanıyan insanın, dili tutulur. Arif olan kişi, Allah’ın huzurunda devamlı dilsiz olarak kalır. Arif öyle bir dereceye ulaşır ki; Allah (cc) onu insanların maslahatlarını yüklenmekle görevlendirir. Arif kişi, insanların maslahatlarıyla görevlendirilince, dilindeki tutukluk, pelteklik kaldırılır. Musa (as) çobanlık yaparken, dilinde pelteklik ve kekemelik</p>", "raw_text": "Rızık Konusunda\nAldırış Etmeyin\nRızık Konusunda Endişelenmemek\nRızkını dert etme. Senin rızık peşinde koşmandan onu\nistemenden daha çok, o seni ister. Bugünün rızkını bulduğun\nzaman, yarınki rızkı dert edinme. Dün geçtiği gibi, yarın da\nne olacağını bilemiyorsun. Yarına kavuşacak mısın, kavuşa-\nmayacak mısın? Sen ânınla meşgul ol. Sen Allah Teala’yı\ngerçek manada tanımış olsaydın; rızkı dert edinmeyi bırakır\nkendini tamamen O’na verirdin. Allah Teala’nın azameti,\nbüyüklüğü senin ondan bir şey istemeni engellerdi. Allah\nTeala’yı gerçekten tanıyan insanın, dili tutulur. Arif olan kişi,\nAllah’ın huzurunda devamlı dilsiz olarak kalır. Arif öyle bir\ndereceye ulaşır ki; Allah (cc) onu insanların maslahatlarını\nyüklenmekle görevlendirir. Arif kişi, insanların maslahatla-\nrıyla görevlendirilince, dilindeki tutukluk, pelteklik kaldırılır.\nMusa (as) çobanlık yaparken, dilinde pelteklik ve kekemelik", "word_count": 119, "char_count": 901, "has_topics": true}, {"page": 71, "printed_page": 70, "title": "Mehâfetullâh — Sayfa 71", "content_html": "<p class=\"book-paragraph\">vardı. Ne zaman ki Allah (cc), onu peygamber olarak görevlendirmek istedi; işte o zaman onun dilindeki peltekliği kaldırmak için ona şu sözleri ilham etti.</p>\n<p class=\"book-paragraph\">ْģُĥ ْèوَا   ۪يۙ ó ْĨاَ Ĺ۪ٓĤ ْó ِّùَĺ وَ  ْر۪يۙ ï َĀ Ĺ۪Ĥ َحْ ó ْüا رَبِّ  َאلَĜ اًóĺ وَز۪  Ĺ۪Ĥ ْģَđ ْäوَا   ۖĹ۪Ĥ ْĳَĜ اĳُıَĝ ْęَĺ  ۙĹ۪Ĭَא ùِĤ ْī ِĨ َةً ï ْĝُĐ ۚĹ ۪ìاَ ُونَ ó ٰİ  ۙĹ۪ĥ ْİاَ ْī ِĨ “Musa (şöyle) dedi: Rabbim!. Yüreğime genişlik ver. İşimi bana kolaylaştır. Dilimdeki (şu) bağı çöz ki sözümü anlasınlar. Bana ailemden bir de vezir (yardımcı) ver, kardeşim Harun’u. Onun sayesinde arkamı kuvvetlendir.”30 Hz. Musa sanki şöyle demek istiyordu: Ya Rabbi! Çobanlık yaparken, dilimin düzgün konuşmasına ihtiyaç duymuyordum. Oysa ki şimdi insanlarla ilgilenmem, onlara sohbet etmem gerekli oldu. Dilimdeki peltekliği giderirsen, meramımı onlara rahatça anlatabilirim. Bu yakarış üzerine, Musa (as)’nın dilindeki tutukluk kaldırıldı. Anlatıldığına göre, Hz. Musa (as) küçükken doksan kadar kelimeyi başkasının anlayabileceği kadar fasih bir dille anlatırdı. Hz. Musa Firavun ve Asiye’nin huzurunda zamansız olarak konuşmaya başlayınca, Allah (cc) onun ağzına bir ateş koru aldırmış, bu sebeple dili peltek olmuştu.</p>\n<p class=\"book-paragraph\">30 Tâhâ, 25-30</p>", "raw_text": "vardı. Ne zaman ki Allah (cc), onu peygamber olarak gö-\nrevlendirmek istedi; işte o zaman onun dilindeki peltekliği\nkaldırmak için ona şu sözleri ilham etti.\nْģُĥ ْèوَا   ۪يۙ ó ْĨاَ Ĺ۪ٓĤ ْó ِّùَĺ وَ  ْر۪يۙ ï َĀ Ĺ۪Ĥ َحْ ó ْüا رَبِّ  َאلَĜ\nاًóĺ وَز۪  Ĺ۪Ĥ ْģَđ ْäوَا   ۖĹ۪Ĥ ْĳَĜ اĳُıَĝ ْęَĺ  ۙĹ۪Ĭَא ùِĤ ْī ِĨ َةً ï ْĝُĐ\nۚĹ ۪ìاَ ُونَ ó ٰİ  ۙĹ۪ĥ ْİاَ ْī
