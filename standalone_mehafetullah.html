ların arasına hakikate bürünmüş bir halde gönderir. Sen peygamberin ve peygamberi gönderenin rızası sebebiyle, nefsinde ve başkaları hakkında Allah Teala’nın emrine tutunmuş olursun. Sonra sen, Allah Teala’nın dışındaki her şeyden soyutlanmış bir şekilde, Allah Teala’nın senin hakkında vereceği her türlü hükme muvafık bir halde, O’nun emirlerini beklemeye koyulursun. Bu durumda olan kişi, Allah Teala’nın huzurunda kalp ve sır ayakları üzerinde durarak Hz. Musa (as)’ın dediği gibi lisanı hal ile şöyle der:</p>\n<p class=\"book-paragraph\">ĵ ٰĄ ْóَÝِĤ رَبِّ  ْכَĻَĤاِ ُÛْĥ ِåَĐ وَ ۪ي óَàاَ ĵٰٓĥَĐ َٓءِ źاُو ْħُİ َאلَĜ</p>", "raw_text": "Allah (cc)’ı Resûlünü ve Dostlarını Tanımak\nEy evladım!\nSenin Allah Teala’yı, resulünü, Allah dostlarını ve\nonların vekillerini yeterince tanımadığını görüyorum. Sen\nmânevîyattan yoksun, kuşsuz bir kafes gibisin. Sen boş,\nharap, yıkık bir ev gibisin. Sen yapraklar ı dökülmüş ve\nkurumuş bir ağaca benziyorsun.\nKulun kalbi, İslam sayesinde imar olur. İslam’ın haki-\nkatını gerçek manada araştırmak ve ona teslim olmakla\nkalp imar olur. Sen kendini, bütününle Allah’a teslim\nedersen Allah (cc) nefsini ve d ışındakileri senin emrine\nverir. Kalbinle, nefsinden ve insanlardan uzaklaşırsan,\nAllah Teala’nın huzurunda, kendinden ve insanlardan\nsoyutlanmış bir vaziyette olursun. Allah (cc) dilerse seni\ngiydirir ve seni insanların arasına hakikate bürünmüş bir\nhalde gönderir. Sen peygamberin ve peygamberi gön-\nderenin rızası sebebiyle, nefsinde ve başkaları hakkında\nAllah Teala’nın emrine tutunmuş olursun. Sonra sen, Allah\nTeala’nın dışındaki her şeyden soyutlanmış bir şekilde,\nAllah Teala’nın senin hakkında vereceği her türlü hükme\nmuvafık bir halde, O’nun emirlerini beklemeye koyulursun.\nBu durumda olan kişi, Allah Teala’nın huzurunda kalp ve\nsır ayakları üzerinde durarak Hz. Musa (as)’ın dediği gibi\nlisanı hal ile şöyle der:\nĵ ٰĄ ْóَÝِĤ رَبِّ  ْכَĻَĤاِ ُÛْĥ ِåَĐ وَ ۪ي óَàاَ ĵٰٓĥَĐ َٓءِ źاُو ْħُİ َאلَĜ", "word_count": 186, "char_count": 1310, "has_topics": true}, {"page": 73, "printed_page": 72, "title": "Cenneti Umuyor Cehennemden Korkuyorsun Fakat Onların Gereklerini Yapmıyorsun", "content_html": "<p class=\"book-paragraph\">“Musa (şöyle) dedi: İşte, onlar da benim peşimdeler. Ben, memnun olasın diye, sana acele ile geldim Rabbim.”31 Dünyamdan, ahiretimden ve bütün insanlardan uzaklaştım. Sebepleri bıraktım, sahte Rableri terk ettim. Daha önce onlarla birlikte bulunmamdan dolayı, beni bağışlaman ve benden razı olman için acilen sana geldim.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Cenneti Umuyor Cehennemden Korkuyorsun Fakat Onların Gereklerini Yapmıyorsun</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Cenneti Umuyor Cehennemden Korkuyorsun Fakat Onların Gereklerini Yapmıyorsun</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey cahil kişi! Sana ne oluyor?! Nefsinin, dünyanın, heva ve hevesinin kölesi olmuşsun. Sen insanların kulu olmuşsun, onlarla birlikte müşrik olmuşsun. Zarar ve fayda verenin, onlar olduğunu görüyorsun. Sen cennetin yanında, oraya girmeyi umuyorsun, cehennemin yanında da cehenneme girmekten korkuyorsun. Peki siz insanlar? Kalpleri ve gözleri çeviren, bir şeye ‘ol’ dediğinde hemen gerçekleştiren, Allah (cc) hakkındaki bu düşünceleriniz niye!?</p>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">İbadetlerine aldanma, ibadetlerine güvenme. İbadetlerinle büyükleniyorsun. İbadetlerinin, Allah (cc) tarafından kabul edilmesini iste. Seni, ibadetlerden başka şeye nakletmesinden kork ve sakın. Hangi şey, senin itaatinin masiyet olmasını, saflığının bulanık olmasını güven içersinde tutar? Allah Teala’yı gerçek manasıyla tanıyan kimse; hiçbir şeyle 31 Tâhâ, 84</p>", "raw_text": "“Musa (şöyle) dedi: İşte, onlar da benim pe-\nşimdeler. Ben, memnun olasın diye, sana acele\nile geldim Rabbim.”31\nDünyamdan, ahiretimden ve bütün insanlardan uzak-\nlaştım. Sebepleri bıraktım, sahte Rableri terk ettim. Daha\nönce onlarla birlikte bulunmamdan dolayı, beni bağışlaman\nve benden razı olman için acilen sana geldim.\nCenneti Umuyor Cehennemden Korkuyorsun\nFakat Onların Gereklerini Yapmıyorsun\nEy cahil kişi! Sana ne oluyor?! Nefsinin, dünyanın, heva\nve hevesinin kölesi olmuşsun. Sen insanların kulu olmuşsun,\nonlarla birlikte müşrik olmuşsun. Zarar ve fayda verenin,\nonlar olduğunu görüyorsun. Sen cennetin yanında, oraya\ngirmeyi umuyorsun, cehennemin yanında da cehenneme\ngirmekten korkuyorsun. Peki siz insanlar? Kalpleri ve gözleri\nçeviren, bir şeye ‘ol’ dediğinde hemen gerçekleştiren, Allah\n(cc) hakkındaki bu düşünceleriniz niye!?\nEy evladım!\nİbadetlerine aldanma, ibadetlerine güvenme. İbadetlerinle\nbüyükleniyorsun. İbadetlerinin, Allah (cc) tarafından kabul\nedilmesini iste. Seni, ibadetlerden başka şeye nakletme-\nsinden kork ve sakın. Hangi şey, senin itaatinin masiyet\nolmasını, saflığının bulanık olmasını güven içersinde tutar?\nAllah Teala’yı gerçek manasıyla tanıyan kimse; hiçbir şeyle\n31 Tâhâ, 84", "word_count": 161, "char_count": 1224, "has_topics": true}, {"page": 74, "printed_page": 73, "title": "Kalple İlgili Amelleri Yapmak ve Samimi Olmak", "content_html": "<p class=\"book-paragraph\">birlikte olmaz, başkalarına da aldanmaz. Dünyadan çıkana kadar, ne dinin selameti, ne de Allah (cc) ile arasındaki muameleleri korumada güven içersinde olmaz.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kalple İlgili Amelleri Yapmak ve Samimi Olmak</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Kalple ilgili amellere sarılın, onlarda ihlaslı olun. Kamil ihlas, kendini Allah Teala’nın dışındaki şeylerden, tamamen soyutlamaktır. Marifetullah asıldır. Ben gerek insanlar arasında, gerekse yalnız başınıza kaldığınız zaman sizin sözlerinizle fiilleriniz arasında uygunsuzluk görüyorum. Sebâtınız yok, yaşamadığınız şeyleri söylüyorsunuz. İhlassız ve tevhidsiz ameller yapıyorsunuz. Elimdeki mihenk taşını kirletmen ve senden razı olanı aldatman sana ne fayda sağlar?. Oysa hem Hakk’ın seni kabul etmesini hem de senden razı olmasını istiyorsun. Altının adisi ve iyisi ateşte ortaya çıkar. Sonra da bu beyazdır, bu siyahtır, diye ifade edilir. İşte kıyamet gününde de, insanın nifak içersinde yaptığı bütün ameller ortaya çıkarılır ve kendisine gösterilerek; “işte bu münafıkça yaptığın amellerin” denilir. Allah Teala’dan başkası için yapılan bütün ameller batıldır. Amel ediniz, seviniz ve arkadaş olunuz. ُóĻ ۪āَ×ْĤا ُďĻ ۪ĩ َّùĤا َĳُİ وَ ْءٌۚ Ĺ َü ۪įِĥْá ِĩכَ َ÷ْĻَĤ “O’nun benzeri hiçbir şey yoktur. O, işitendir, görendir.”32 diye nitelenen Allah Teala’dan isteyiniz.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 32 Şura, 11</div>", "raw_text": "birlikte olmaz, başkalarına da aldanmaz. Dünyadan çıkana\nkadar, ne dinin selameti, ne de Allah (cc) ile arasındaki\nmuameleleri korumada güven içersinde olmaz.\nKalple İlgili Amelleri Yapmak ve Samimi Olmak\nEy cemaat!\nKalple ilgili amellere sarılın, onlarda ihlaslı olun. Kamil\nihlas, kendini Allah Teala’nın dışındaki şeylerden, tamamen\nsoyutlamaktır. Marifetullah asıldır. Ben gerek insanlar arasında,\ngerekse yalnız başınıza kaldığınız zaman sizin sözlerinizle\nfiilleriniz arasında uygunsuzluk görüyorum. Sebâtınız yok,\nyaşamadığınız şeyleri söylüyorsunuz. İhlassız ve tevhidsiz\nameller yapıyorsunuz. Elimdeki mihenk taşını kirletmen ve\nsenden razı olanı aldatman sana ne fayda sağlar?. Oysa hem\nHakk’ın seni kabul etmesini hem de senden razı olmasını\nistiyorsun. Altının adisi ve iyisi ateşte ortaya çıkar. Sonra\nda bu beyazdır, bu siyahtır, diye ifade edilir. İşte kıyamet\ngününde de, insanın nifak içersinde yaptığı bütün ameller\nortaya çıkarılır ve kendisine gösterilerek; “işte bu münafıkça\nyaptığın amellerin” denilir. Allah Teala’dan başkası için yapılan\nbütün ameller batıldır. Amel ediniz, seviniz ve arkadaş olunuz.\nُóĻ ۪āَ×ْĤا ُďĻ ۪ĩ َّùĤا َĳُİ وَ ْءٌۚ Ĺ َü ۪įِĥْá ِĩכَ َ÷ْĻَĤ\n“O’nun benzeri hiçbir şey yoktur. O, işitendir,\ngörendir.”32 diye nitelenen Allah Teala’dan isteyiniz.\n32 Şura, 11", "word_count": 179, "char_count": 1303, "has_topics": true}, {"page": 75, "printed_page": 74, "title": "Mehâfetullâh — Sayfa 75", "content_html": "<p class=\"book-paragraph\">Önce nefyedin, sonra isbat ediniz. Allah Teala’ya layık olmayan şeyleri, O’ndan nefyedin. Sonra O’na layık olan sıfatları O’na izafe edin. Bu sıfatlar da Allah Teala’nın kendisi için layık gördüğü ve Resülünün O’na layık gördüğü sıfatlardır. Bunu yaptığınız zaman, Allah (cc) hakkındaki ‘teşbih’ ve ‘ta’til’ kalplerinizden silinir. Allah (cc) ile O’nun resulü ile ve O’nun salih kulları ile iclâl, ta’zim ve saygı dahilinde beraber olun. Eğer kurtuluşu istiyorsanız, benim huzurumda ancak edeb ile hazır bulunun. Yoksa huzuruma gelmeyin. Hep fuzuli işlerle uğraşıyorsunuz. Yanımda, huzurumda olduğunuz zamanlarda, bu fuzuli işleri terk edin. Bazen topluluk içerisinde, akılların ve anlayışların ötesinde, (his sahibi) muhterem ve edep sahibi kimseler bulunur.</p>\n<p class=\"book-paragraph\">Aşçı pişirdiğini, fırıncı yaptığı ekmeği, sanatkar sanatını, davet sahibi çağırdıklarını ve orada hazır olanları bilir. Dünyanız, kalplerinizi köreltmiş, kalp gözünüzle bir şey göremiyorsunuz. Dünyadan sakının. Dünya bazen size, kendi imkanlarını sunuyor. Sizleri yavaş yavaş tuzağa düşürmek ve sonra da sizleri boğazlamak istiyor. Dünya sizlere şarabını içiriyor, afyonunu yutturuyor, sonra da ellerinizi ve ayaklarınızı keserek, gözlerinizi oymak istiyor. Afyonun tesiri geçip ayıldığınızda, size neler yaptığını görürsünüz. İşte dünyayı sevmenin, onun arkasından koşmanın, ona karşı hırslı olmanın ve onu toplamanın neticesi budur. İşte bunlar dünya işleridir. Bunlardan sakınınız.</p>", "raw_text": "Önce nefyedin, sonra isbat ediniz. Allah Teala’ya layık\nolmayan şeyleri, O’ndan nefyedin. Sonra O’na layık olan\nsıfatları O’na izafe edin. Bu sıfatlar da Allah Teala’nın ken-\ndisi için layık gördüğü ve Resülünün O’na layık gördüğü\nsıfatlardır. Bunu yaptığınız zaman, Allah (cc) hakkındaki\n‘teşbih’ ve ‘ta’til’ kalplerinizden silinir. Allah (cc) ile\nO’nun resulü ile ve O’nun salih kulları ile iclâl, ta’zim ve\nsaygı dahilinde beraber olun. Eğer kurtuluşu istiyorsanız,\nbenim huzurumda ancak edeb ile hazır bulunun. Yoksa\nhuzuruma gelmeyin. Hep fuzuli işlerle uğraşıyorsunuz.\nYanımda, huzurumda olduğunuz zamanlarda, bu fuzuli\nişleri terk edin. Bazen topluluk içerisinde, akılların ve an-\nlayışların ötesinde, (his sahibi) muhterem ve edep sahibi\nkimseler bulunur.\nAşçı pişirdiğini, fırıncı yaptığı ekmeği, sanatkar sana-\ntını, davet sahibi çağırdıklarını ve orada hazır olanları bilir.\nDünyanız, kalplerinizi köreltmiş, kalp gözünüzle bir şey\ngöremiyorsunuz. Dünyadan sakının. Dünya bazen size,\nkendi imkanlarını sunuyor. Sizleri yavaş yavaş tuzağa düşür-\nmek ve sonra da sizleri boğazlamak istiyor. Dünya sizlere\nşarabını içiriyor, afyonunu yutturuyor, sonra da ellerinizi\nve ayaklarınızı keserek, gözlerinizi oymak istiyor. Afyonun\ntesiri geçip ayıldığınızda, size neler yaptığını görürsünüz.\nİşte dünyayı sevmenin, onun arkasından koşmanın, ona\nkarşı hırslı olmanın ve onu toplamanın neticesi budur. İşte\nbunlar dünya işleridir. Bunlardan sakınınız.", "word_count": 195, "char_count": 1452, "has_topics": false}, {"page": 76, "printed_page": 75, "title": "Kişi Sevdiği İle Beraberdir", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kişi Sevdiği İle Beraberdir</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Dünyayı sevdiğin sürece, senin için kurtuluş imkanı yoktur. erk ettikleri şeyleri,\nHakk’ın kapısının önünde hazır halde bulur.\nAllah (cc) rızası için onları terk etmesine karşılık olarak,\nonların oraya kendinden önce vardığını görür. Onlar, o dünya\nmallarından uzak dursalar bile, Allah (cc) veli kullarına tüm\nkısmetlerini verir. Kalbin nasipleri gizlidir. Nefsin nasipleri\nise açıktır. Kalbin nasipleri, nefsin nasiplerini menettikten\nsonra ancak gelir. Nefis nasiplerinden kaçınırsa, kalbin haz\nkapıları açılır. Hatta kalp, Allah Teala’dan olan nasiplerinde,\nzirveye ulaştığında bundan sonra nefis için rahmet gelir ve\nbu kula ‘nefsini öldürme’ diye seslenilir. İşte o zaman da\nnefis, mutmain olarak hazlarına kavuşmuş olur.\nDünyayı arzulayanlarla bir arada olmaktan sakın. Zahit\nolanlarla bir arada olmayı arzu et. Cins cinsine yönelir.\nBirbirlerini dolaşırlar. Sevenlere sevgi gösteren, sevdiğini\nonların arasında bulur. Allah Teala’yı sevenler, Allah (cc)\nsevgisinde bir araya gelirler. Şüphesiz ki Allah (cc) da onları", "word_count": 215, "char_count": 1501, "has_topics": true}, {"page": 77, "printed_page": 76, "title": "Mehâfetullâh — Sayfa 77", "content_html": "<p class=\"book-paragraph\">sever, destekler ve onları birbirlerine bağlar. Allah (cc) için birbirini sevenler, Allah’a davette birbirleriyle yardımlaşırlar. İnsanları imana, tevhide ve amellerde ihlasa çağırırlar. Halkın elinden tutarak, insanları Hakk’ın yoluna korlar. Hizmet edene, hizmet edilir. İyilik yapana, iyilik yapılır. Verene, verilir. Cehennem ateşi için çalışırsan, yarın karşında cehennem ateşini bulursun.</p>\n<p class=\"book-paragraph\">“Nasıl davranırsan, sana da öyle davranılır.</p>\n<p class=\"book-paragraph\">Nasılsanız, öyle idare edilirsiniz.”33 Ameller göstergenizdir. Cehennem ehlinin amelini yapıyorsun, sonra da Allah Teala’dan cennetlerini umuyorsun! Cennet ehlinin amellerini yapmadan, cenneti nasıl temenni edersin! Gönül ehli dünyada organlarıyla değil, kalpleri ile amel ederler. Kalp ile uygun olmayan amel nasıl yapılır! Riyakâr kişi organlarıyla amel eder. İhlaslı kişi kalp ve organlarıyla birlikte amel eder. Mümin diridir. Münafık ise ölüdür. Mümin, sadece Allah (cc) için amel eder. Münafık ise, insanlar için amel eder. Amellerinde insanların övgüsüne ve onların vereceği mallara göre amel eder. Müminin ameli açık ve gizli, hem halvet halinde, hem de insanların arasında iken, genişlikte ve darlıkta olur. Münafığın ameli ise, sadece insanlar arasında iken olur. Genişlik anında amel eder; darlıkta ise ameli terk eder. Onun sohbeti, Allah (cc) rızası için olmaz. Münafık, Allah Teala’ya resullerine ve kitaplarına iman etmez. Ne haşri ne dirilişi ne de hesap gününü anar. Onun Müslümanlığı,</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 33 Ke şfu’l-Hafâ, No: 427</div>", "raw_text": "sever, destekler ve onları birbirlerine bağlar. Allah (cc) için\nbirbirini sevenler, Allah’a davette birbirleriyle yardımlaşırlar.\nİnsanları imana, tevhide ve amellerde ihlasa çağırırlar. Halkın\nelinden tutarak, insanları Hakk’ın yoluna korlar. Hizmet\nedene, hizmet edilir. İyilik yapana, iyilik yapılır. Verene, verilir.\nCehennem ateşi için çalışırsan, yarın karşında cehennem\nateşini bulursun.\n“Nasıl davranırsan, sana da öyle davranılır.\nNasılsanız, öyle idare edilirsiniz.”33\nAmeller göstergenizdir. Cehennem ehlinin amelini yapı-\nyorsun, sonra da Allah Teala’dan cennetlerini umuyorsun!\nCennet ehlinin amellerini yapmadan, cenneti nasıl temenni\nedersin! Gönül ehli dünyada organlarıyla değil, kalpleri ile\namel ederler. Kalp ile uygun olmayan amel nasıl yapılır!\nRiyakâr kişi organlarıyla amel eder. İhlaslı kişi kalp ve or-\nganlarıyla birlikte amel eder.\nMümin diridir. Münafık ise ölüdür. Mümin, sadece\nAllah (cc) için amel eder. Münafık ise, insanlar için amel\neder. Amellerinde insanların övgüsüne ve onların vereceği\nmallara göre amel eder. Müminin ameli açık ve gizli, hem\nhalvet halinde, hem de insanların arasında iken, genişlikte ve\ndarlıkta olur. Münafığın ameli ise, sadece insanlar arasında\niken olur. Genişlik anında amel eder; darlıkta ise ameli terk\neder. Onun sohbeti, Allah (cc) rızası için olmaz. Münafık,\nAllah Teala’ya resullerine ve kitaplarına iman etmez. Ne haşri\nne dirilişi ne de hesap gününü anar. Onun Müslümanlığı,\n33 Ke şfu’l-Hafâ, No: 427", "word_count": 202, "char_count": 1472, "has_topics": false}, {"page": 78, "printed_page": 77, "title": "Amellerin Karşılığı Yalnız Allah’tan Beklenir", "content_html": "<p class=\"book-paragraph\">dünyada kendini ve malını kurtarmak içindir. Hakk’ın azabı olan ahiret azabından kurtulmak için değildir. Halkın karşısında oruç tutar, namaz kılar ve ilim okur. İnsanlardan uzak olduğunda, kendi işine ve küfrüne düşer.</p>\n<p class=\"book-paragraph\">Allahım! Bu duruma düşmekten sana sığınırım. Dünyada ve yarın ahirette ihlası senden isterim. Amin!</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Amellerin Karşılığı Yalnız Allah’tan Beklenir</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Amellerinde ihlasa sarıl. Gözünü amellerinden kaldır. Amellerin için, ne insanlardan ne de Allah Teala’dan bir karşılık bekleme. Sadece Allah (cc) rızası için çalış. Allah’ın nimetleri için çalışma. O’nun rızasını isteyenlerden ol. Sana verene kadar, O’nun rızasını iste. O r ızasını sana verdiği zaman, dünyada ve ahirette cenneti kazanmış olursun. Dünyadaki cennet; Allah Teala’ya yakın olmak, ahirette ki cennet ise O’na bakmandır. O’nun vaatlerinin karşılığı bir tür alış veriş ve karşılık vermedir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Düşmanını İyi Tanı</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Şeytan senin de baban, atan Adem (as)’ın da düşmanıdır. Seninle onun arasında eski bir düşmanlık varken onunla nasıl oturabilir, söylediklerini nasıl kabul edebilirsin? Ondan hiçbir zaman emin olma! Zira o senin ananın da babanın da katilidir. Fırsat bulduğu zaman onlara günah işlettirerek öldürdüğü gibi seni de öldürür. Takvayı, Allah’ı</p>", "raw_text": "dünyada kendini ve malını kurtarmak içindir. Hakk’ın azabı\nolan ahiret azabından kurtulmak için değildir. Halkın karşı-\nsında oruç tutar, namaz kılar ve ilim okur. İnsanlardan uzak\nolduğunda, kendi işine ve küfrüne düşer.\nAllahım! Bu duruma düşmekten sana sığınırım. Dünyada\nve yarın ahirette ihlası senden isterim. Amin!\nAmellerin Karşılığı Yalnız Allah’tan Beklenir\nEy evladım!\nAmellerinde ihlasa sarıl. Gözünü amellerinden kaldır.\nAmellerin için, ne insanlardan ne de Allah Teala’dan bir\nkarşılık bekleme. Sadece Allah (cc) rızası için çalış. Allah’ın\nnimetleri için çalışma. O’nun rızasını isteyenlerden ol. Sana\nverene kadar, O’nun rızasını iste. O r ızasını sana verdiği\nzaman, dünyada ve ahirette cenneti kazanmış olursun.\nDünyadaki cennet; Allah Teala’ya yakın olmak, ahirette ki\ncennet ise O’na bakmandır. O’nun vaatlerinin karşılığı bir\ntür alış veriş ve karşılık vermedir.\nDüşmanını İyi Tanı\nEy evladım!\nŞeytan senin de baban, atan Adem (as)’ın da düşma-\nnıdır. Seninle onun arasında eski bir düşmanlık varken\nonunla nasıl oturabilir, söylediklerini nasıl kabul edebilirsin?\nOndan hiçbir zaman emin olma! Zira o senin ananın da\nbabanın da katilidir. Fırsat bulduğu zaman onlara günah\nişlettirerek öldürdüğü gibi seni de öldürür. Takvayı, Allah’ı", "word_count": 179, "char_count": 1256, "has_topics": true}, {"page": 79, "printed_page": 78, "title": "Nasuh Tevbe Yapmak", "content_html": "<p class=\"book-paragraph\">daima birlemeyi, O’nu murakabeyi yalnızken kalbinde O’nun korkusunu taşımayı, sıdkı kendine silah edin! Bunlar senin askerlerin mesabesindedir. Bu silah ve askerler, şeytan ve bâtılı hezimete uğratırlar, çiğner geçerler. Onların ordusunu kırar geçirirler. Hakk seninle birlikteyken, nasıl olup da hezimete uğratmayasın ki?</p>\n<p class=\"book-paragraph\">Ey genç!</p>\n<p class=\"book-paragraph\">Dünya ve ahiretin arasını yakınlaştır. Onları bir yere koy! Kalbinde sadece Mevlâyı Müteâle yer ayır. Dünya ve ahiret endişesi olmaksızın kalbini O’na aç. Allah Teala’dan başka her şeyi kalbinden soyutlamadan O’na yönelme! Yaratandan ayrılıp, mahlûkata bağlanma! Bütün bu sebepleri ve bünyedeki Rableri soy çıkar. Bütün bunları başarabildiğin zaman, dünyayı nefsine, ahireti kalbine, mevlayı da özüne koymuş olursun.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Nasuh Tevbe Yapmak</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Nefsinle, heva ve hevesinle baş başa kalma! Dünya ile de, ahiret ile de beraber olma! Hakk Azze ve Celle’den başkasına da tabi olma! Eğer böyle olursan, fâni olmayan ebedi hazineyi bulmuş olursun. Günahlarına tevbe et. Allah Teala’ya koş. Tevbe ettiğin zaman; içinle de dışınla da bütün samimiyetinle tevbe et. Tevbe, kalbin Hakk’a dönüşüdür. Günah elbisesini samimi ve ihlaslı tevbe ile üzerinden çıkar. Gerçek bir şekilde Allah Teala’ya karşı hayalı ol. Dinin zâhirî ibadetleri ile bedenini temizledikten sonra, kalbini çalıştır.</p>", "raw_text": "daima birlemeyi, O’nu murakabeyi yalnızken kalbinde O’nun\nkorkusunu taşımayı, sıdkı kendine silah edin! Bunlar senin\naskerlerin mesabesindedir. Bu silah ve askerler, şeytan ve\nbâtılı hezimete uğratırlar, çiğner geçerler. Onların ordusunu\nkırar geçirirler. Hakk seninle birlikteyken, nasıl olup da\nhezimete uğratmayasın ki?\nEy genç!\nDünya ve ahiretin arasını yakınlaştır. Onları bir yere\nkoy! Kalbinde sadece Mevlâyı Müteâle yer ayır. Dünya ve\nahiret endişesi olmaksızın kalbini O’na aç. Allah Teala’dan\nbaşka her şeyi kalbinden soyutlamadan O’na yönelme! Ya-\nratandan ayrılıp, mahlûkata bağlanma! Bütün bu sebepleri\nve bünyedeki Rableri soy çıkar. Bütün bunları başarabildiğin\nzaman, dünyayı nefsine, ahireti kalbine, mevlayı da özüne\nkoymuş olursun.\nNasuh Tevbe Yapmak\nEy evladım!\nNefsinle, heva ve hevesinle baş başa kalma! Dünya ile\nde, ahiret ile de beraber olma! Hakk Azze ve Celle’den\nbaşkasına da tabi olma! Eğer böyle olursan, fâni olmayan\nebedi hazineyi bulmuş olursun. Günahlarına tevbe et. Allah\nTeala’ya koş. Tevbe ettiğin zaman; içinle de dışınla da bütün\nsamimiyetinle tevbe et. Tevbe, kalbin Hakk’a dönüşüdür.\nGünah elbisesini samimi ve ihlaslı tevbe ile üzerinden çıkar.\nGerçek bir şekilde Allah Teala’ya karşı hayalı ol. Dinin zâhirî\nibadetleri ile bedenini temizledikten sonra, kalbini çalıştır.", "word_count": 185, "char_count": 1313, "has_topics": true}, {"page": 80, "printed_page": 79, "title": "Dertlere Karşı Sabırlı Olmak", "content_html": "<p class=\"book-paragraph\">Bedene mahsus bir takım ibadetler olduğu gibi, kalbe mahsus da bir takım ibadetler vardır. Kalp sebeplerden ve mahlûkata bağlanıp güvenmekten sıyrıldığı an tevekkül deryasına dalmış, marifetullaha ve onun bilgisine ermiş olur. Artık sebepleri bırakır onları yaratanı arar. Bu deryaya daldığı zaman, orada şöyle der:</p>\n<p class=\"book-paragraph\">ِۙ īĺ ۪ï ْıَĺ َĳُıَĘ Ĺ ۪ĭَĝَĥ َì ۪ي ñَّĤاَ “O, (Allah) ki beni yaratan ve hidayete erdirendir.”34 Allah (cc) böyle bir kimseyi, deryada bir sahilden diğer bir sahile, bir yerden diğer bir yere iletir. Öyle ki; istikamet sınırında durdurur. Her ne zaman Rabbini ansa, O’na geniş ve dümdüz bir cadde açılır. Çukur ve eksiklikler giderilir. Hakk’ı arayanın kalbi, mesafeleri katbekat eder ve her şeyi geride bırakır. Yolun bir kısmında kaybolmaktan korktuğu zaman, imanı ortaya çıkar ona cesaret verir. Yalnızlık ve korkunun getirdiği sıkıntı, yok olur gider. Onun yerine Allah Teala’ya ünsiyet nuru, ferahlık ve yakınlık meydana gelir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Dertlere Karşı Sabırlı Olmak</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Sana bir dert geldiği zaman, onu sabır eliyle karşıla. Sana şifa olacak ilaç gelinceye kadar sakin ol! Şifa geldiği zaman da, onu şükürle karşıla. Bu hal üzere olduğun zaman, olması</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 34 Şuara, 78</div>", "raw_text": "Bedene mahsus bir takım ibadetler olduğu gibi, kalbe\nmahsus da bir takım ibadetler vardır. Kalp sebeplerden\nve mahlûkata bağlanıp güvenmekten sıyrıldığı an tevekkül\nderyasına dalmış, marifetullaha ve onun bilgisine ermiş\nolur. Artık sebepleri bırakır onları yaratanı arar. Bu deryaya\ndaldığı zaman, orada şöyle der:\nِۙ īĺ ۪ï ْıَĺ َĳُıَĘ Ĺ ۪ĭَĝَĥ َì ۪ي ñَّĤاَ\n“O, (Allah) ki beni yaratan ve hidayete erdi-\nrendir.”34\nAllah (cc) böyle bir kimseyi, deryada bir sahilden diğer\nbir sahile, bir yerden diğer bir yere iletir. Öyle ki; istikamet\nsınırında durdurur. Her ne zaman Rabbini ansa, O’na geniş ve\ndümdüz bir cadde açılır. Çukur ve eksiklikler giderilir. Hakk’ı\narayanın kalbi, mesafeleri katbekat eder ve her şeyi geride\nbırakır. Yolun bir kısmında kaybolmaktan korktuğu zaman,\nimanı ortaya çıkar ona cesaret verir. Yalnızlık ve korkunun\ngetirdiği sıkıntı, yok olur gider. Onun yerine Allah Teala’ya\nünsiyet nuru, ferahlık ve yakınlık meydana gelir.\nDertlere Karşı Sabırlı Olmak\nEy evladım!\nSana bir dert geldiği zaman, onu sabır eliyle karşıla. Sana\nşifa olacak ilaç gelinceye kadar sakin ol! Şifa geldiği zaman\nda, onu şükürle karşıla. Bu hal üzere olduğun zaman, olması\n34 Şuara, 78", "word_count": 182, "char_count": 1187, "has_topics": true}, {"page": 81, "printed_page": 80, "title": "Rağbetin Allah Teala’ya Olsun", "content_html": "<p class=\"book-paragraph\">gereken hal üzere olursun. Cehennem korkusu, müminlerin ciğerlerini parçalar, yüzlerini sarartır, kalplerini mahzun eder. Bu onların kalbine iyice yerleşince, Allah Teala’dan müminlerin kalbine rahmet ve lütuf suyu dökülür. Artık ona, ahiret kapıları açılır. Cehenneme karşı, kendilerini güvende hissederler. Sükunete erip, ferahladıkları zaman, Allah (cc) onlara celâl kapılarını açar, kalpleri ve özleri parçalanır. Korkuları öncekilerden daha şiddetli şekilde çoğalır. Cemal kapılarının onlara açılması tamam olduğu zaman, sükunete itminana ererler, uyanırlar ve dereceleri yükselir. Bu dereceler bir şeyden sonra diğer şeyin gelmesi şeklindedir.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Rağbetin Allah Teala’ya Olsun</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Amacın, hayattaki isteğin ve gayretin, yemek yemek, giymek, evlenmek, konut edinmek, mal, mülk ve servet toplamak olmasın! Zira bütün bunlar fıtratın gereği, yaratılışın rağbet ettiği şeylerdir. Kalbin ve gönlünün arzusu, Allah Teala’ya rağbet olmalıdır. O Hâlik-ı Zül-Celâl’dir. Öncelikle himmetin ve gayretin, Rabbini ve O’nun hazinelerini elde etmek olmalıdır. Dünyanın karşılığı ahirettir. Mahlukatın fâni olmasının karşılığı, ebedi olan Hâlik-ı Zül- Celâl’dir. Her ne zaman bu dünyadan bir şeyi terk eder, bırakırsan, Allah (cc) onun yerine ahirette hayrı yaratır. Ömründen sadece bir gün kaldığını farzet ve ona göre ahirete hazırlan ve ölüm meleğinin geleceğini düşünerek, ona göre tedbirini al.</p>", "raw_text": "gereken hal üzere olursun. Cehennem korkusu, müminle-\nrin ciğerlerini parçalar, yüzlerini sarartır, kalplerini mahzun\neder. Bu onların kalbine iyice yerleşince, Allah Teala’dan\nmüminlerin kalbine rahmet ve lütuf suyu dökülür. Artık ona,\nahiret kapıları açılır. Cehenneme karşı, kendilerini güvende\nhissederler. Sükunete erip, ferahladıkları zaman, Allah (cc)\nonlara celâl kapılarını açar, kalpleri ve özleri parçalanır.\nKorkuları öncekilerden daha şiddetli şekilde çoğalır. Cemal\nkapılarının onlara açılması tamam olduğu zaman, sükunete\nitminana ererler, uyanırlar ve dereceleri yükselir. Bu dereceler\nbir şeyden sonra diğer şeyin gelmesi şeklindedir.\nRağbetin Allah Teala’ya Olsun\nEy evladım!\nAmacın, hayattaki isteğin ve gayretin, yemek yemek,\ngiymek, evlenmek, konut edinmek, mal, mülk ve servet\ntoplamak olmasın! Zira bütün bunlar fıtratın gereği, yara-\ntılışın rağbet ettiği şeylerdir. Kalbin ve gönlünün arzusu,\nAllah Teala’ya rağbet olmalıdır. O Hâlik-ı Zül-Celâl’dir.\nÖncelikle himmetin ve gayretin, Rabbini ve O’nun hazi-\nnelerini elde etmek olmalıdır. Dünyanın karşılığı ahirettir.\nMahlukatın fâni olmasının karşılığı, ebedi olan Hâlik-ı Zül-\nCelâl’dir. Her ne zaman bu dünyadan bir şeyi terk eder,\nbırakırsan, Allah (cc) onun yerine ahirette hayrı yaratır.\nÖmründen sadece bir gün kaldığını farzet ve ona göre\nahirete hazırlan ve ölüm meleğinin geleceğini düşünerek,\nona göre tedbirini al.", "word_count": 187, "char_count": 1400, "has_topics": true}, {"page": 82, "printed_page": 81, "title": "Mehâfetullâh — Sayfa 82", "content_html": "<p class=\"book-paragraph\">Dünya kuvvet kazanma ve olgunlaşma yeridir. Ahiret ise, ebedi kalınacak yerdir. Allah Teala’dan bir gayret geldiği zaman, bu gayret onlarla dünya ve ahiretin arasına girer. Böylece bu oluşum, ahiretin yerine geçer. Artık onlar ne dünyaya, ne de ahirete ihtiyaç duymazlar.</p>\n<p class=\"book-paragraph\">Ey yalancı!</p>\n<p class=\"book-paragraph\">Sen, Allah Teala’yı sadece nimetler içinde iken seviyorsun, bela ve musibetler geldiği zaman da sanki Allah (cc) senin dostun değilmiş gibi O’ndan kaçıyorsun. Kulluk; yalnız imtihan anında ortaya çıkar. Eğer Allah Teala’dan sana bir bela ve musibet geldiğinde, sen o hale sabredebiliyor ve sebat edebiliyorsan işte o zaman gerçekten sen Allah Teala’yı seviyorsun demektir. Eğer bela ve musibet anında, sende bir değişiklik oluyor, evvelki durumun bozuluyorsa, işte o zaman Allah Teala’ya karşı sevginin olmadığı anlaşılır ve kulluk göstergen kaybolur gider.</p>\n<p class=\"book-paragraph\">Bir defasında sahebelerden birisi Hz. Peygamber (sav)’ e geldi ve şöyle dedi:</p>\n<p class=\"book-paragraph\">-“Ey Allah’ın Resulü! Ben seni çok seviyorum.” Hz. Peygamber (sav) buna cevaben şöyle buyurdu: “O zaman sıkıntı içinde bir elbise hazırla!”</p>\n<p class=\"book-paragraph\">Bir başka zaman yine sahabelerden birisi Allah Reslüne gelerek şöyle dedi:</p>\n<p class=\"book-paragraph\">“Ben Allah Teala’yı çok seviyorum.”</p>", "raw_text": "Dünya kuvvet kazanma ve olgunlaşma yeridir. Ahiret\nise, ebedi kalınacak yerdir. Allah Teala’dan bir gayret geldiği\nzaman, bu gayret onlarla dünya ve ahiretin arasına girer.\nBöylece bu oluşum, ahiretin yerine geçer. Artık onlar ne\ndünyaya, ne de ahirete ihtiyaç duymazlar.\nEy yalancı!\nSen, Allah Teala’yı sadece nimetler içinde iken seviyor-\nsun, bela ve musibetler geldiği zaman da sanki Allah (cc)\nsenin dostun değilmiş gibi O’ndan kaçıyorsun. Kulluk; yalnız\nimtihan anında ortaya çıkar. Eğer Allah Teala’dan sana\nbir bela ve musibet geldiğinde, sen o hale sabredebiliyor\nve sebat edebiliyorsan işte o zaman gerçekten sen Allah\nTeala’yı seviyorsun demektir. Eğer bela ve musibet anında,\nsende bir değişiklik oluyor, evvelki durumun bozuluyorsa,\nişte o zaman Allah Teala’ya karşı sevginin olmadığı anlaşılır\nve kulluk göstergen kaybolur gider.\nBir defasında sahebelerden birisi Hz. Peygamber (sav)’\ne geldi ve şöyle dedi:\n-“Ey Allah’ın Resulü! Ben seni çok seviyorum.”\nHz. Peygamber (sav) buna cevaben şöyle buyurdu:\n“O zaman sıkıntı içinde bir elbise hazırla!”\nBir başka zaman yine sahabelerden birisi Allah Reslüne\ngelerek şöyle dedi:\n“Ben Allah Teala’yı çok seviyorum.”", "word_count": 172, "char_count": 1172, "has_topics": false}, {"page": 83, "printed_page": 82, "title": "Mehâfetullâh — Sayfa 83", "content_html": "<p class=\"book-paragraph\">Resulullah (sav) şöyle buyurdu:</p>\n<p class=\"book-paragraph\">“Öyleyse belalar içinde bir elbise edin.”</p>\n<p class=\"book-paragraph\">Allah (cc) ve Resulünün sevgisine erişmek; sıkıntı ve belalara sabırla mümkündür. Bunun için bela ve musibetler Allah Teala’nın veli kullarına musallat edilmiştir. Bu durumda olan kimseler sevgi iddiasında bulunabilirler. Bela ve sıkıntılara sebat göstermek bu sevgiye giden yoldur ve bu sevginin alametidir.</p>\n<p class=\"book-paragraph\">َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Ey Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi cehennem azabından koru!.”35</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 35 Bakara, 201</div>", "raw_text": "Resulullah (sav) şöyle buyurdu:\n“Öyleyse belalar içinde bir elbise edin.”\nAllah (cc) ve Resulünün sevgisine erişmek; sıkıntı ve\nbelalara sabırla mümkündür. Bunun için bela ve musibet-\nler Allah Teala’nın veli kullarına musallat edilmiştir. Bu\ndurumda olan kimseler sevgi iddiasında bulunabilirler. Bela\nve sıkıntılara sebat göstermek bu sevgiye giden yoldur ve\nbu sevginin alametidir.\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Ey Rabbimiz! Bize dünyada da iyilik ver,\nahirette de iyilik ver ve bizi cehennem azabından\nkoru!.”35\n35 Bakara, 201", "word_count": 93, "char_count": 604, "has_topics": false}, {"page": 84, "printed_page": 83, "title": "Nefis, Hevâ ve Şeytanla Cihad", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Nefis, Hevâ ve Şeytanla Cihad</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">İki Cihad</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Allah (cc) sana iki cihadı haber verdi.</p>\n<p class=\"book-paragraph\">1-Bâtını cihad.</p>\n<p class=\"book-paragraph\">2-Zâhiri cihad.</p>\n<p class=\"book-paragraph\">Bâtınî cihad: Nefis, hevâ, insanın kendi doğası ve şeytan ile yapılan cihattır. Başka bir ifadeyle; insanın isyanlardan, ayak sürçmelerinden tevbe etmesi ve tevbesinde de sebat ederek haram olan şehvetleri terk etmesidir.</p>\n<p class=\"book-paragraph\">Zâhirî cihad: Allah (cc) ve Resûlüne karşı olan inatkar kâfirlere yönelik yapılan cihattır. Kafirlerin kılıçlarına, mızraklarına ve oklarına karşı göğüs gererek bu yolda öldürmek ve öldürülmektir.</p>\n<p class=\"book-paragraph\">Bâtınî cihad zâhirî cihaddan daha zordur. Çünkü Bâtınî cihad sürekli olan bir durumdur. Zâhiri cihaddan nasıl zor olmasın ki?! Zira o, nefsin alıştığı şeylerden kesilip haramları</p>", "raw_text": "Nefis, Hevâ ve Şeytanla Cihad\nİki Cihad\nAllah (cc) sana iki cihadı haber verdi.\n1-Bâtını cihad.\n2-Zâhiri cihad.\nBâtınî cihad: Nefis, hevâ, insanın kendi doğası ve şeytan\nile yapılan cihattır. Başka bir ifadeyle; insanın isyanlardan,\nayak sürçmelerinden tevbe etmesi ve tevbesinde de sebat\nederek haram olan şehvetleri terk etmesidir.\nZâhirî cihad: Allah (cc) ve Resûlüne karşı olan inatkar\nkâfirlere yönelik yapılan cihattır. Kafirlerin kılıçlarına, mız-\nraklarına ve oklarına karşı göğüs gererek bu yolda öldürmek\nve öldürülmektir.\nBâtınî cihad zâhirî cihaddan daha zordur. Çünkü Bâtınî\ncihad sürekli olan bir durumdur. Zâhiri cihaddan nasıl zor\nolmasın ki?! Zira o, nefsin alıştığı şeylerden kesilip haramları", "word_count": 102, "char_count": 711, "has_topics": true}, {"page": 85, "printed_page": 84, "title": "Kur’an’la Amel Ediniz", "content_html": "<p class=\"book-paragraph\">terkederek, Şeriatın emirlerini yapması ve yasaklarından kaçınması ile olur. Her kim, gerek bâtınî, gerekse zâhirî cihadda Allah Teala’nın emirlerine tutunursa, hem dünya da hem de ahirette mükafat elde eder. Şehidin vücudundaki yaralar, şehide insanın eline batan iğne kadar acı verirler. Günahlarından tevbe eden mücahid için ölüm; susuz insanın soğuk suyu bulup ona kanması gibi bir haldir.</p>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Sizi bir şey ile mükellef tutarsak o şeylerden daha hayırlısını size veririz. Bundan maksat; Allah (cc) ve Resûlünün düşmanı olan münafık kişilerin aksine, kişinin her an kalbi cihetiyle kendine mahsus emir ve nehiyleri vardır. Bu kişiler Hakk’ı bilmemeleri ve Hakk’a karşı düşmanlık beslemelerinden dolayı cehenneme gireceklerdir. Çünkü onlar dünyada iken Hakk’a muhalif, nefislerine, heva ve heveslerine uyan, kendi tabiatları doğrultusunda hareket eden, alışkanlıklarını sürdüren ve şeytanlara uyan ahirete karşı dünya hayatını tercih eden kişilerdir. Onlar nasıl cehenneme girmesinler ki! Kur’an-ı işittikleri halde ona iman etmediler, onun emirlerini tutup yasaklarından kaçınmadılar.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Kur’an’la Amel Ediniz</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Bu Kur’an’a iman edin, onunla amel edin, amellerinizde de samimi olun! Riyakârlık ve münafıklık yapmayın. Yaptıklarınızın karşılığında da övgüyü ve karşılığı insanlardan beklemeyin. Fert fert insanlar bu Kur’an’a iman ediyorlar ve</p>", "raw_text": "terkederek, Şeriatın emirlerini yapması ve yasaklarından\nkaçınması ile olur. Her kim, gerek bâtınî, gerekse zâhirî\ncihadda Allah Teala’nın emirlerine tutunursa, hem dünya\nda hem de ahirette mükafat elde eder. Şehidin vücudundaki\nyaralar, şehide insanın eline batan iğne kadar acı verirler.\nGünahlarından tevbe eden mücahid için ölüm; susuz insanın\nsoğuk suyu bulup ona kanması gibi bir haldir.\nEy cemaat!\nSizi bir şey ile mükellef tutarsak o şeylerden daha ha-\nyırlısını size veririz. Bundan maksat; Allah (cc) ve Resûlünün\ndüşmanı olan münafık kişilerin aksine, kişinin her an kalbi\ncihetiyle kendine mahsus emir ve nehiyleri vardır. Bu kişiler\nHakk’ı bilmemeleri ve Hakk’a karşı düşmanlık beslemelerin-\nden dolayı cehenneme gireceklerdir. Çünkü onlar dünyada\niken Hakk’a muhalif, nefislerine, heva ve heveslerine uyan,\nkendi tabiatları doğrultusunda hareket eden, alışkanlıklarını\nsürdüren ve şeytanlara uyan ahirete karşı dünya hayatını\ntercih eden kişilerdir. Onlar nasıl cehenneme girmesinler ki!\nKur’an-ı işittikleri halde ona iman etmediler, onun emirlerini\ntutup yasaklarından kaçınmadılar.\nKur’an’la Amel Ediniz\nEy cemaat!\nBu Kur’an’a iman edin, onunla amel edin, amelleri-\nnizde de samimi olun! Riyakârlık ve münafıklık yapmayın.\nYaptıklarınızın karşılığında da övgüyü ve karşılığı insanlardan\nbeklemeyin. Fert fert insanlar bu Kur’an’a iman ediyorlar ve", "word_count": 187, "char_count": 1364, "has_topics": true}, {"page": 86, "printed_page": 85, "title": "Doğru Olmak", "content_html": "<p class=\"book-paragraph\">sırf Allah (cc) rızası için onunla amel ediyorlar. Bu sebeple samimi insanların sayısı azaldı. Münafıkların sayısı ise çoğaldı. Sizler Allah Teala’ya itaatta ne kadar da tembelsiniz! Allah Teala’nın ve sizin düşmanınız kovulmuş şeytana itaatta ne kadar da gayretlisiniz!</p>\n<p class=\"book-paragraph\">Cemaat, Allah Teala’nın tekliflerinden uzak olmamayı temenni eder. Onlar Allah Teala’nın tekliflerinden olan sabır, kaza ve kaderlerinde dünya ve ahiret yönüyle çok hayır olduğunu bildiler. Onlar sabırda, şükürde, yakınlıkta, uzaklıkta, yorgunlukta, rahatlıkta, zenginlikte, fakirlikte, bazen sağlıkta, bazen de hastalıkta, Allah Teala’nın çekip çevirmesinde O’na karşı uyum içerisindedirler. Onların bütün gayeleri; kalplerinin Hakk ile beraber olmasını sağlamaktır. Bu onlar için en önemli meseledir. Onlar hem kendilerini, hem de halkın Hakk’la birlikte selamet içerisinde olmasını arzularlar. Onlar halkın yararına olacak şeyleri devamlı olarak Hakk’tan isterler.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Doğru Olmak</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Doğru ol, iyiyi kötüden ayırt edebilme melekesi kazanırsın! Hüküm vermede adaleti gözetirsen, ilimde de meleke kazanırsın. İçin sağlam olursa, dışında düzgün olur. Bütün kurtuluş Allah Teala’ya itaattedir. Bu da emrettiklerinin hepsinde O’na uymak, yasaklarından da kaçınmak ve bütün hükümlerinde de sabır göstermekle olur. Her kim ki Allah Teala’ya icabet ederse, Allah (cc) da ona icabet eder.</p>", "raw_text": "sırf Allah (cc) rızası için onunla amel ediyorlar. Bu sebeple\nsamimi insanların sayısı azaldı. Münafıkların sayısı ise çoğaldı.\nSizler Allah Teala’ya itaatta ne kadar da tembelsiniz! Allah\nTeala’nın ve sizin düşmanınız kovulmuş şeytana itaatta ne\nkadar da gayretlisiniz!\nCemaat, Allah Teala’nın tekliflerinden uzak olmamayı\ntemenni eder. Onlar Allah Teala’nın tekliflerinden olan\nsabır, kaza ve kaderlerinde dünya ve ahiret yönüyle çok\nhayır olduğunu bildiler. Onlar sabırda, şükürde, yakınlıkta,\nuzaklıkta, yorgunlukta, rahatlıkta, zenginlikte, fakirlikte,\nbazen sağlıkta, bazen de hastalıkta, Allah Teala’nın çekip\nçevirmesinde O’na karşı uyum içerisindedirler. Onların bütün\ngayeleri; kalplerinin Hakk ile beraber olmasını sağlamaktır.\nBu onlar için en önemli meseledir. Onlar hem kendilerini,\nhem de halkın Hakk’la birlikte selamet içerisinde olmasını\narzularlar. Onlar halkın yararına olacak şeyleri devamlı olarak\nHakk’tan isterler.\nDoğru Olmak\nEy evladım!\nDoğru ol, iyiyi kötüden ayırt edebilme melekesi kazanır-\nsın! Hüküm vermede adaleti gözetirsen, ilimde de meleke\nkazanırsın. İçin sağlam olursa, dışında düzgün olur. Bütün\nkurtuluş Allah Teala’ya itaattedir. Bu da emrettiklerinin\nhepsinde O’na uymak, yasaklarından da kaçınmak ve\nbütün hükümlerinde de sabır göstermekle olur. Her kim ki\nAllah Teala’ya icabet ederse, Allah (cc) da ona icabet eder.", "word_count": 182, "char_count": 1360, "has_topics": true}, {"page": 87, "printed_page": 86, "title": "Mehâfetullâh — Sayfa 87", "content_html": "<p class=\"book-paragraph\">Her kim Allah Teala’ya itaat ederse, Allah (c.c)’da bütün mahlûkatı ona itaat ettirir.</p>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Benim sözlerimi kabul edin. Çünkü ben size nasihat eden bir kişiyim. İçinde bulunduğum bütün hallerde ben kendimden ve sizden uzağım. Ben ondan uzağım. Allah Teala’nın benim ve sizin hakkınızda yaptıklarından dolayı genişlik duyuyorum. Beni töhmet altında bırakmayınız. Ben kendim için istediğimiz şeyleri sizler içinde istiyorum. Resulullah (sav) şöyle buyuruyor:</p>\n<p class=\"book-paragraph\">“Mümin kendisi için istediğini, mümin kardeşi için de istemedikçe imanını kemale erdiremez.”36 Bu bizim önderimiz, reisimiz, büyüğümüz, komutanımız, elçimiz, şefaatçımız, Adem (as)’ın zamanından kıyamete kadar olan nebîlerin, resûllerin ve sıddîklerin önderinin sözüdür. O, kendisi için sevdiğini, mümin kardeşi için de sevmedikçe imanın kemalinin olmayacağını söyledi. Eğer sen yiyeceklerin en lezizlerini, giyeceklerin en güzelini, evlerin en hoş olanını, makamların en güzelini, malların çokluğunu kendin için, bunun tam aksini de mümin kardeşin için seversen, o zaman kamil iman iddias ında bulunman yalan olur.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 36 Buhari, 13; Müslim,45; Tirmizi, 2515; İbni Mace, 66</div>", "raw_text": "Her kim Allah Teala’ya itaat ederse, Allah (c.c)’da bütün\nmahlûkatı ona itaat ettirir.\nEy cemaat!\nBenim sözlerimi kabul edin. Çünkü ben size nasihat\neden bir kişiyim. İçinde bulunduğum bütün hallerde ben\nkendimden ve sizden uzağım. Ben ondan uzağım. Allah\nTeala’nın benim ve sizin hakkınızda yaptıklarından dolayı\ngenişlik duyuyorum. Beni töhmet altında bırakmayınız.\nBen kendim için istediğimiz şeyleri sizler içinde istiyorum.\nResulullah (sav) şöyle buyuruyor:\n“Mümin kendisi için istediğini, mümin\nkardeşi için de istemedikçe imanını kemale\nerdiremez.”36\nBu bizim önderimiz, reisimiz, büyüğümüz, komutanımız,\nelçimiz, şefaatçımız, Adem (as)’ın zamanından kıyamete\nkadar olan nebîlerin, resûllerin ve sıddîklerin önderinin\nsözüdür. O, kendisi için sevdiğini, mümin kardeşi için de\nsevmedikçe imanın kemalinin olmayacağını söyledi. Eğer\nsen yiyeceklerin en lezizlerini, giyeceklerin en güzelini,\nevlerin en hoş olanını, makamların en güzelini, malla-\nrın çokluğunu kendin için, bunun tam aksini de mümin\nkardeşin için seversen, o zaman kamil iman iddias ında\nbulunman yalan olur.\n36 Buhari, 13; Müslim,45; Tirmizi, 2515; İbni Mace, 66", "word_count": 155, "char_count": 1135, "has_topics": false}, {"page": 88, "printed_page": 87, "title": "Mehâfetullâh — Sayfa 88", "content_html": "<p class=\"book-paragraph\">Ey tedbirsiz kişi!</p>\n<p class=\"book-paragraph\">Fakir bir komşun, fakir yakınların, zekatını vermekle yükümlü olduğun bir mal, kâr üstüne kârın, ihtiyacından fazla malın varken, onlara bir şey vermemen onların fakirlik içerisinde kıvranmalarına rıza göstermen demektir. Fakat nefis, hevâ ve şeytan senin arkanda olduğu sürece, senin hayır yapman şüphesiz ki kolay değildir. Bunların yanında bir de aşırı hırs, emellerin, dünya sevgisi, takvâ ve iman azlığı olduğu sürece senin hayır işlemen mümkün değildir. Sen kendin, malın ve insanlar sebebiyle şirke düşüyorsun. Sende hiçbir hayır kalmamıştır. Dünya arzusu çoğalan, hırsı artan, ölümü ve Allah’a kavuşmayı unutan, haram ve helal ayırmaksızın önüne geleni yiyen kişi Allah Teala’nın yüce kitabında anlattığı şu kâfir kimselere benzerler: َّźاِ َٓאĭِכُĥ ْıُĺ َא Ĩ وَ َאĻ ْéَĬ وَ تُĳ ُĩَĬ َאĻْĬ ُّïĤا َאĭُÜَאĻ َè َّźاِ َĹ ِİ َא Ĩ اĳُĤَאĜ وَ نَĳُّĭُčَĺ َّźاِ ْħُİ اِنْ ٍۚ ħْĥ ِĐ ْī ِĨ ِכَĤ ٰñِÖ ْħُıَĤ َא Ĩ وَ ُۚ ó ْİ َّïĤا “Dediler ki; hayat ancak bu dünyada yaşadığımızdır. Ölürüz ve yaşarız. Bizi ancak zaman helâk eder. Bu hususta onların hiçbir bilgisi de yoktur. Onlar sadece zanna göre hüküm veriyorlar.”37 Sanki sende onlardan biri gibisin. Fakat sen, İslam’la süslendin ve getirdiğin kelime-i şehâdet ile canını güvence altına aldın. Namaz ve oruç tutma konusunda müslümanlara 37 Câsiye, 24</p>", "raw_text": "Ey tedbirsiz kişi!\nFakir bir komşun, fakir yakınların, zekatını vermekle\nyükümlü olduğun bir mal, kâr üstüne kârın, ihtiyacından\nfazla malın varken, onlara bir şey vermemen onların fakirlik\niçerisinde kıvranmalarına rıza göstermen demektir. Fakat\nnefis, hevâ ve şeytan senin arkanda olduğu sürece, senin\nhayır yapman şüphesiz ki kolay değildir. Bunların yanında\nbir de aşırı hırs, emellerin, dünya sevgisi, takvâ ve iman\nazlığı olduğu sürece senin hayır işlemen mümkün değildir.\nSen kendin, malın ve insanlar sebebiyle şirke düşüyorsun.\nSende hiçbir hayır kalmamıştır. Dünya arzusu çoğalan, hırsı\nartan, ölümü ve Allah’a kavuşmayı unutan, haram ve helal\nayırmaksızın önüne geleni yiyen kişi Allah Teala’nın yüce\nkitabında anlattığı şu kâfir kimselere benzerler:\nَّźاِ َٓאĭِכُĥ ْıُĺ َא Ĩ وَ َאĻ ْéَĬ وَ تُĳ ُĩَĬ َאĻْĬ ُّïĤا َאĭُÜَאĻ َè َّźاِ َĹ ِİ َא Ĩ اĳُĤَאĜ وَ\nنَĳُّĭُčَĺ َّźاِ ْħُİ اِنْ ٍۚ ħْĥ ِĐ ْī ِĨ ِכَĤ ٰñِÖ ْħُıَĤ َא Ĩ وَ ُۚ ó ْİ َّïĤا\n“Dediler ki; hayat ancak bu dünyada yaşa-\ndığımızdır. Ölürüz ve yaşarız. Bizi ancak zaman\nhelâk eder. Bu hususta onların hiçbir bilgisi\nde yoktur. Onlar sadece zanna göre hüküm\nveriyorlar.”37\nSanki sende onlardan biri gibisin. Fakat sen, İslam’la\nsüslendin ve getirdiğin kelime-i şehâdet ile canını güvence\naltına aldın. Namaz ve oruç tutma konusunda müslümanlara\n37 Câsiye, 24", "word_count": 204, "char_count": 1322, "has_topics": false}, {"page": 89, "printed_page": 88, "title": "Sadece Bedenimiz Oruç Tutmamalı", "content_html": "<p class=\"book-paragraph\">ibadet diye değil adet olsun diye uymaktasın. Kalbin fısku fücür ile dolu. Oysaki sen insanlara takvâlı olduğunu gösteriyorsun. Bu durum sana bir fayda sağlamaz.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Sadece Bedenimiz Oruç Tutmamalı</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Gündüz aç ve susuz kalıp akşamleyin haram lokma ile oruç açmak size ne fayda sağlar? Gündüzleri oruç tutuyor, geceleri de isyan ediyorsunuz.</p>\n<p class=\"book-paragraph\">Ey haram yiyiciler!</p>\n<p class=\"book-paragraph\">Gündüz su içmekten nefislerinizi alıkoyuyorsunuz fakat akşamları müslümanların kanlarıyla iftar açıyorsunuz. Sizin içinizde öyle kimseler var ki onlar gündüzlerini oruçla gecelerini fısku fücur ile geçirmektedir. Hz. Muhammed (sav) şöye buyurmuştur:</p>\n<p class=\"book-paragraph\">“Ümmetim, ramazan ayına saygı gösterdiği sürece yardımsız bırakılmaz”</p>\n<p class=\"book-paragraph\">Ramazan ayına saygı; bu ayda takvâlı olup, şeriatın sınırlarını koruyarak Allah (cc) için oruç tutmakla olur.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Yoksullara Yedirmek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Oruç tut. İftar edeceğin zaman da yemeğini fakirlerle paylaş. Yemeğini yalnız başına yeme. Yemeğini yalnız yiyenin</p>", "raw_text": "ibadet diye değil adet olsun diye uymaktasın. Kalbin fısku\nfücür ile dolu. Oysaki sen insanlara takvâlı olduğunu gös-\nteriyorsun. Bu durum sana bir fayda sağlamaz.\nSadece Bedenimiz Oruç Tutmamalı\nEy cemaat!\nGündüz aç ve susuz kalıp akşamleyin haram lokma ile\noruç açmak size ne fayda sağlar? Gündüzleri oruç tutuyor,\ngeceleri de isyan ediyorsunuz.\nEy haram yiyiciler!\nGündüz su içmekten nefislerinizi alıkoyuyorsunuz fakat\nakşamları müslümanların kanlarıyla iftar açıyorsunuz. Sizin\niçinizde öyle kimseler var ki onlar gündüzlerini oruçla ge-\ncelerini fısku fücur ile geçirmektedir.\nHz. Muhammed (sav) şöye buyurmuştur:\n“Ümmetim, ramazan ayına saygı gösterdiği\nsürece yardımsız bırakılmaz”\nRamazan ayına saygı; bu ayda takvâlı olup, şeriatın\nsınırlarını koruyarak Allah (cc) için oruç tutmakla olur.\nYoksullara Yedirmek\nEy evladım!\nOruç tut. İftar edeceğin zaman da yemeğini fakirlerle\npaylaş. Yemeğini yalnız başına yeme. Yemeğini yalnız yiyenin", "word_count": 131, "char_count": 946, "has_topics": true}, {"page": 90, "printed_page": 89, "title": "Ya İslam’ın Gereklerini Yerine Getir veya Ben Müslümanın Deme", "content_html": "<p class=\"book-paragraph\">ve başkasına yedirmeyen kimsenin fakirleşmesinden ve dilenmeye muhtaç olacak hale düşmesinden korkulur.</p>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Komşularınız açlıktan kırılırken, sizler çatlarcasına yiyorsunuz. Sonra da mümin olduğunuzu söylüyorsunuz. Elinizde size ve ailenize yetecek miktar yiyecek varken, kapınıza gelen muhtaç kimseyi de eli boş çevirirseniz. Böyle davranmanın neticesini pek yakında sen de onun durumuna düştüğünde anlarsın, vermeye gücün yettiği halde, onu nasıl geri çevirmişsen, sen de aynı durumla karşılaştığın zaman bunun acısını anlarsın.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Ya İslam’ın Gereklerini Yerine Getir veya Ben Müslümanın Deme</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Ya İslam’ın Gereklerini Yerine Getir veya Ben Müslümanın Deme</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Acilen yerinden kalkarak, huzuruna gelen böyle bir kişinin elinden tutarak ona yardım etseydin ya! Tevazu göstererek yerinden kalkmak ve malından vermek suretiyle böylece iki güzel hasleti bir arada toplamış olursun. Peygamberimiz Hz. Muhammed (sav), isteyene kendi eliyle veriyor, devesini kendi eliyle yemliyor, koyununu kendisi sağıyor ve gömleğini kendisi dikiyordu.</p>\n<p class=\"book-paragraph\">Sizler söz ve davranışlarınızda ona muhalefet ederken onun izinden gittiğinizi nasıl iddia edebilirsiniz? Sizler, imzasız dilekçe sunuyorsunuz. Darb-ı mesel olmuş bir söz vardır: “Ya saf Yahudi ol, ya da Tevrat’ı çok sevdiğinden bahsetme!”</p>", "raw_text": "ve başkasına yedirmeyen kimsenin fakirleşmesinden ve\ndilenmeye muhtaç olacak hale düşmesinden korkulur.\nEy cemaat!\nKomşularınız açlıktan kırılırken, sizler çatlarcasına\nyiyorsunuz. Sonra da mümin olduğunuzu söylüyorsunuz.\nElinizde size ve ailenize yetecek miktar yiyecek varken, ka-\npınıza gelen muhtaç kimseyi de eli boş çevirirseniz. Böyle\ndavranmanın neticesini pek yakında sen de onun durumuna\ndüştüğünde anlarsın, vermeye gücün yettiği halde, onu nasıl\ngeri çevirmişsen, sen de aynı durumla karşılaştığın zaman\nbunun acısını anlarsın.\nYa İslam’ın Gereklerini Yerine Getir\nveya Ben Müslümanın Deme\nYazıklar olsun sana! Acilen yerinden kalkarak, huzuruna\ngelen böyle bir kişinin elinden tutarak ona yardım etseydin\nya! Tevazu göstererek yerinden kalkmak ve malından vermek\nsuretiyle böylece iki güzel hasleti bir arada toplamış olursun.\nPeygamberimiz Hz. Muhammed (sav), isteyene kendi eliyle\nveriyor, devesini kendi eliyle yemliyor, koyununu kendisi\nsağıyor ve gömleğini kendisi dikiyordu.\nSizler söz ve davranışlarınızda ona muhalefet ederken\nonun izinden gittiğinizi nasıl iddia edebilirsiniz? Sizler, imzasız\ndilekçe sunuyorsunuz. Darb-ı mesel olmuş bir söz vardır: “Ya\nsaf Yahudi ol, ya da Tevrat’ı çok sevdiğinden bahsetme!”", "word_count": 164, "char_count": 1233, "has_topics": true}, {"page": 91, "printed_page": 90, "title": "Mehâfetullâh — Sayfa 91", "content_html": "<p class=\"book-paragraph\">İşte sana diyeceğim söz, “Ya İslam’ın şartlarını yerine getir ya da ben Müslüman’ım deme.”</p>\n<p class=\"book-paragraph\">İslam’ın şartlarını yerine getirin, İslam’ın hakikatına bağlanınız. İslam’ın hakikati Allah Teala’nın huzurunda teslim olmaktır. Bugün halka yardımda bulun ki yarın da, Allah (cc) sana rahmetiyle yardımda bulunsun. Yeryüzündekilere merhamet etki, gökyüzündekiler de sana merhamet etsin. Nefsinin isteklerine uyduğun sürece, bu makama ulaşamazsın. Nefse, isteklerini verdiğin sürece de nefsin bağlarından kurtulamazsın. Nefsin hakkını ver, fakat isteklerini engelle. Nefse haklarını vermek onun bekasını; isteklerini vermek ise onun helâkını sağlar. Nefsin hakkı, yemesi, içmesi, giymesi ve barınacağı meskenidir. Nefsin istekleri ise, lezzetler ve şehvetlerdir. Nefsin hakkını Şeriat eliyle al. Nefsin her bir isteklerini kadere ve Allah Teala’nın ezeli ilmindeki takdirine bırak. Nefse haram olanları değil, helal şeyleri yedir. Şeriat kapısına otur ve ona hizmete devam et ki nefis kurtuluşa erebilsin. Allah Teala’nın şu sözlerini işitmedin mi? اĳُĝَّÜوَا  اۚĳُıَÝْĬَאĘ ُįْĭَĐ ْħכُĻ ٰıَĬ َא Ĩ وَ ُوهُñ ُíَĘ لُĳ ُø َّóĤا ُħכُĻٰÜاٰ َٓאĨ وَ َאبِۢ ĝ ِđْĤا ُïĺ ۪ï َü َّٰ ųا اِنَّ َّٰۜ ųا “Peygamber size ne verdiyse onu alın, size ne yasakladıysa ondan da sakının. Allah’tan korkun. Çünkü Allah’ın azabı çetindir.”38</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 38 Ha şr, 7</div>", "raw_text": "İşte sana diyeceğim söz, “Ya İslam’ın şartlarını yerine\ngetir ya da ben Müslüman’ım deme.”\nİslam’ın şartlarını yerine getirin, İslam’ın hakikatına bağ-\nlanınız. İslam’ın hakikati Allah Teala’nın huzurunda teslim\nolmaktır. Bugün halka yardımda bulun ki yarın da, Allah\n(cc) sana rahmetiyle yardımda bulunsun. Yeryüzündekilere\nmerhamet etki, gökyüzündekiler de sana merhamet etsin.\nNefsinin isteklerine uyduğun sürece, bu makama ulaşa-\nmazsın. Nefse, isteklerini verdiğin sürece de nefsin bağlarından\nkurtulamazsın. Nefsin hakkını ver, fakat isteklerini engelle.\nNefse haklarını vermek onun bekasını; isteklerini vermek ise\nonun helâkını sağlar. Nefsin hakkı, yemesi, içmesi, giymesi\nve barınacağı meskenidir. Nefsin istekleri ise, lezzetler ve\nşehvetlerdir. Nefsin hakkını Şeriat eliyle al. Nefsin her bir\nisteklerini kadere ve Allah Teala’nın ezeli ilmindeki takdirine\nbırak. Nefse haram olanları değil, helal şeyleri y e": "Mehâfetullâh — Sayfa 93", "content_html": "<p class=\"book-paragraph\">alayım derken Rabbi ile kendi arasını açarak Rabbinin öfkesini celp etmiştir. Oysa ki o, yakında öleceğini ve Allah Teala’nın huzurunda hazır olacağını ve bütün yaptıklarının tek tek hesabını vereceğini kesin bir şekilde bilseydi, işlerinin bir çoğunda hiçbir kusur yapmamaya çalışırdı. Lokman Hekim rahmetûllâhi aleyh oğluna şöyle nasihat etti:</p>\n<p class=\"book-paragraph\">“Ey yavrucuğum! Hastalığını bilmeden hastalandığın gibi işte aynen öleceğini bilemeden de ölürsün.” Ben sizleri uyarıyor ve bir takım şeylerden sakındırıyorum. Oysa ki sizler ne uyarılarıma ne de sakındırmama kulak asıyorsunuz.</p>\n<p class=\"book-paragraph\">Ey hayırları işlemekten kaybolup dünya ile meşgul olan kişiler! Pek yakında dünya üzerinize binecek ve boğazınızı sıkacak. Dünyalıklarınız elinizden alınıp biriktirdikleriniz ve lezzet duyduklarınız size hiçbir fayda vermeyecek. Aksine bunların hepsi size birer vebal, yük olacak.</p>\n<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Sıkıntılara katlanman ve şerri kesmen gerekir. Kelimelerin kardeşleri vardır. Birisi sana bir kelam ettiğinde sende o kişiye cevap verirsen, o kelimelerin kardeşleri birbiri ardına gelir ve o kişi ile senin aranı kötülükle açarlar. İnsanlardan çok az bir kısmı hakkın kapısına davette ehil kişilerdir. Eğer insanlar tarafından kabul edilmezlerse onların aleyhlerine birer hüccet olurlar. Onlar müminler için bir nimet, Allah Teala’nın dininin düşmanı olan münafıklar için ise birer azaptırlar.</p>", "raw_text": "alayım derken Rabbi ile kendi arasını açarak Rabbinin öf-\nkesini celp etmiştir. Oysa ki o, yakında öleceğini ve Allah\nTeala’nın huzurunda hazır olacağını ve bütün yaptıklarının\ntek tek hesabını vereceğini kesin bir şekilde bilseydi, işlerinin\nbir çoğunda hiçbir kusur yapmamaya çalışırdı.\nLokman Hekim rahmetûllâhi aleyh oğluna şöyle\nnasihat etti:\n“Ey yavrucuğum! Hastalığını bilmeden hastalandığın\ngibi  kaynaklarını kesin ve arzularında onları serbest bırakmayın.</p>\n<p class=\"book-paragraph\">Allah’ım! nefislerimize karşı bize yardım et! َّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ “Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi Cehennem ateşinden koru” 40 39 Şûrâ, 11</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 40 Bakara, 201</div>", "raw_text": "Allah’ım! Bizleri tevhitle temizle. Bizleri mahlûkattan\nve mâsivâdan geçmekle tütsüle.\nEy Muvahhitler! Ey Müşrikler! Mahlukattan hiç kimsenin\nelinde bir şey yoktur, hepsi acizdirler. Padişahlar, hükümdarlar,\nsultanlar, zenginler, fakirler hepsi Allah Teala’nın kader esirleridir.\nOnların kalpleri onun elindedir, onları dilediği şekilde çevirir.\nAllah (cc) şöyle buyuruyor:\nُóĻ ۪āَ×ْĤا ُďĻ ۪ĩ َّùĤا َĳُİ وَ ْءٌۚ Ĺ َü ۪įِĥْá ِĩכَ َ÷ْĻَĤ\n“O’nun benzeri hiçbir şey yoktur. O işitendir,\ngörendir.”39\nNefislerinizi semizleştirmeyin. Çünkü semizleşen nefis-\nleriniz, sahibini parçalayan azgın köpek gibi, gün gelir sizi\nde parçalar. Nefislerinizin yularlarını salıvermeyin, bıçaklarını\nbilemeyin. Çünkü onlar sizi helak vadilerine atarlar ve sizleri\ntuzağa düşürürler. Onların beslenme kaynaklarını kesin ve\narzularında onları serbest bırakmayın.\nAllah’ım! nefislerimize karşı bize yardım et!\nَّאرِĭĤا َابَñَĐ َאĭِĜ وَ ًÙَĭ َù َè َةِ ó ِìْٰ źا ĹِĘ وَ ًÙَĭ َù َè َאĻْĬ ُّïĤا ĹِĘ َאĭِÜاٰ َٓאĭَّÖرَ\n“Rabbimiz! Bize dünyada da iyilik ver, ahi-\nrette de iyilik ver ve bizi Cehennem ateşinden\nkoru” 40\n39 Şûrâ, 11\n40 Bakara, 201", "word_count": 156, "char_count": 1116, "has_topics": false}, {"page": 95, "printed_page": 94, "title": "Bölüm Ayırıcı", "content_html": "<div class=\"section-divider-leaf\"><span class=\"leaf-ornament\">✦ ✦ ✦</span><p>Bölüm Ayırıcı Yaprak — Sayfa 95</p></div>", "raw_text": "", "word_count": 0, "char_count": 0, "has_topics": false}, {"page": 96, "printed_page": 95, "title": "Amelsiz Söz", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Amelsiz Söz</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Nifaktan Sakınmalı Amellerde İhlaslı Olmalı</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Ey bu şehrin sakinleri! Aranızda nifak çoğaldı, ihlas azaldı, amelsiz sözler arttı. Amelsiz söz hiçbir şeyi düzeltmez, aksine o aleyhinizde bir belgedir. Amelsiz söz kapısız ve kolonsuz eve benzer, amelsiz söz harcanmayan hazineye benzer. Amelsiz söz delilsiz bir iddia, ruhsuz bir şekil, elleri ve ayakları olmayan bir heykel gibidir. Amellerinizin çoğu ruhsuz bir ceset gibidir. Ruh, ihlas, tevhid, Allah Teala’nın kitabı ve Resûlünün sünneti üzere sebat etmektir. Gaflet göstermeyin, davranışlarınızın aksini yapın isabet edersiniz. Allah Teala’nın emirlerini yapıp yasaklarından kaçınarak kaderine rıza gösterin. Halkın çok azı, kalplerini ünsiyet, müşahede ve yakınlık afyonuyla uyuşturlar ve bunun akabinde de kaderin acılarını ve belalarını hissetmezler. Bela günleri gelip geçer de bunun farkına bile varmazlar.</p>", "raw_text": "Amelsiz Söz\nNifaktan Sakınmalı Amellerde İhlaslı Olmalı\nEy bu şehrin sakinleri! Aranızda nifak çoğaldı, ihlas\nazaldı, amelsiz sözler arttı. Amelsiz söz hiçbir şeyi düzeltmez,\naksine o aleyhinizde bir belgedir. Amelsiz söz kapısız ve\nkolonsuz eve benzer, amelsiz söz harcanmayan hazineye\nbenzer. Amelsiz söz delilsiz bir iddia, ruhsuz bir şekil, elleri\nve ayakları olmayan bir heykel gibidir. Amellerinizin çoğu\nruhsuz bir ceset gibidir. Ruh, ihlas, tevhid, Allah Teala’nın\nkitabı ve Resûlünün sünneti üzere sebat etmektir.\nGaflet göstermeyin, davranışlarınızın aksini yapın isabet\nedersiniz. Allah Teala’nın emirlerini yapıp yasaklarından\nkaçınarak kaderine rıza gösterin. Halkın çok azı, kalplerini\nünsiyet, müşahede ve yakınlık afyonuyla uyuşturlar ve bu-\nnun akabinde de kaderin acılarını ve belalarını hissetmezler.\nBela günleri gelip geçer de bunun farkına bile varmazlar.", "word_count": 119, "char_count": 877, "has_topics": true}, {"page": 97, "printed_page": 96, "title": "Sevginin Şartı", "content_html": "<p class=\"book-paragraph\">Allah Teala’ya hamdeder ve şükrederler. Nasıl hamd ve şükretmesinler?! Onların varlığı yok ki Allah Teala’ya itiraz etsinler.</p>\n<p class=\"book-paragraph\">Sizlerin üzerlerine belaların indiği gibi Allah (cc) dostlarının üzerlerine de belalar iner. Onlardan bazısı belalara sabreder, bazısı da afetlerden ve afetlere sabır göstermekten uzak olur. Musibetlerden zarar görmek, imanın zayıf olduğu çocukluk dönemine, musibetlere sabır göstermek gençlik çağına, musibetlere uyum sağlamak ergenlik çağına, musibet anında kadere rıza göstermek ise ilmi ile Rabbine bakmaya yaklaştığı anda gerçekleşir. Gâiplik ve fânilik kalbin varlığı anında gerçekleşir. Sır ise hakkın katındadır. Sır; müşâhede ve muhâdese halidir. Bu halde kişinin bâtını da varlığı da yok olur. Halka nisbetle mahvolur, hakka nisbetle mevcut/var olur. Bu makama eren kişinin varlığı mahvolur ve erir. Sonra eğer Allah (cc) dilerse onu tekrar diriltir. Kıyamet gününde halkın cesetlerindeki parça parça olmuş kemikleri, etleri ve kılları bir araya toplayarak, sonra da orada İsrafil (as)’a ruhlara üflemesini emrederek onları yeniden hayata döndürdüğü gibi; bu kimseleri de vasıtasız olarak hayata döndürür.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Sevginin Şartı</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Sevginin şartı; iradenin sevdiğin ile birlikte olmamasıdır. Sevdiğinle beraberken iradenin olmamasıdır. Dünya, ahiret ve insanlarla meşgul olmamandır. Muhabbetullah insanların</p>", "raw_text": "Allah Teala’ya hamdeder ve şükrederler. Nasıl hamd ve\nşükretmesinler?! Onların varlığı yok ki Allah Teala’ya itiraz\netsinler.\nSizlerin üzerlerine belaların indiği gibi Allah (cc) dost-\nlarının üzerlerine de belalar iner. Onlardan bazısı belalara\nsabreder, bazısı da afetlerden ve afetlere sabır göstermek-\nten uzak olur. Musibetlerden zarar görmek, imanın zayıf\nolduğu çocukluk dönemine, musibetlere sabır göstermek\ngençlik çağına, musibetlere uyum sağlamak ergenlik çağına,\nmusibet anında kadere rıza göstermek ise ilmi ile Rabbine\nbakmaya yaklaştığı anda gerçekleşir. Gâiplik ve fânilik\nkalbin varlığı anında gerçekleşir. Sır ise hakkın katındadır.\nSır; müşâhede ve muhâdese halidir. Bu halde kişinin bâtını\nda varlığı da yok olur. Halka nisbetle mahvolur, hakka\nnisbetle mevcut/var olur. Bu makama eren kişinin varlığı\nmahvolur ve erir. Sonra eğer Allah (cc) dilerse onu tekrar\ndiriltir. Kıyamet gününde halkın cesetlerindeki parça parça\nolmuş kemikleri, etleri ve kılları bir araya toplayarak, sonra\nda orada İsrafil (as)’a ruhlara üflemesini emrederek onları\nyeniden hayata döndürdüğü gibi; bu kimseleri de vasıtasız\nolarak hayata döndürür.\nSevginin Şartı\nSevginin şartı; iradenin sevdiğin ile birlikte olmamasıdır.\nSevdiğinle beraberken iradenin olmamasıdır. Dünya, ahiret\nve insanlarla meşgul olmamandır. Muhabbetullah insanların", "word_count": 178, "char_count": 1336, "has_topics": true}, {"page": 98, "printed_page": 97, "title": "Mehâfetullâh — Sayfa 98", "content_html": "<p class=\"book-paragraph\">iddia ettiği gibi kolay bir i ş değildir. Nice muhabbetullah iddiasında bulunan insanlar vardır ki; bu sevgiden kat be kat uzaktadırlar. Nice kimseler de vardır ki; onlar muhabbetullah iddiasında bulunmazlar fakat bunu bizzat yaşarlar. Hiçbir müslümanı hor görmeyin. Zira Allah Teala’nın sırları onlara saçılmıştır. Tevazu sahibi olun. Allah Teala’nın kullarına karşı kibirli olmayın. Gaflet uykusundan uyanın. Sizler büyük bir gaflet içerisindesiniz. Sizler sanki hesaba çekilmiş, sırat köprüsünü geçmiş ve cennetteki yerlerinizi görmüş gibisiniz. Nedir bu büyük aldanış? Sizlerden her biri Allah Teala’ya karşı büyük isyanlarda bulunmuştur. O kişi, ne isyanlarını düşünüyor, ne de onlardan tevbe ediyor. O, günahların unutulduğunu zannediyor. Oysa onlar amel defterlerinizde tarihleri ve zamanları ile yazılıdır. Az veya çok olsun bütün yaptıklarınızdan hesaba çekileceksiniz.</p>\n<p class=\"book-paragraph\">Ey gâfiller! Gaflet uykusundan uyanınız.</p>\n<p class=\"book-paragraph\">Ey uykucular! Uyanınız ve Allah Teala’nın rahmetine sığınınız. Günahları ve hataları çoğalan ve bunda da ısrarcı olup tevbe edip pişman olmayan kişiler, küfrü istiyor konumunda Allah Teala’nın huzuruna geleceklerdir. Ey Yaratıcıyı değil de halkı isteyen!</p>\n<p class=\"book-paragraph\">Ey ahiretsiz dünyayı isteyen sen!</p>", "raw_text": "iddia ettiği gibi kolay bir i ş değildir. Nice muhabbetullah\niddiasında bulunan insanlar vardır ki; bu sevgiden kat be kat\nuzaktadırlar. Nice kimseler de vardır ki; onlar muhabbetullah\niddiasında bulunmazlar fakat bunu bizzat yaşarlar.\nHiçbir müslümanı hor görmeyin. Zira Allah Teala’nın\nsırları onlara saçılmıştır. Tevazu sahibi olun. Allah Teala’nın\nkullarına karşı kibirli olmayın. Gaflet uykusundan uyanın.\nSizler büyük bir gaflet içerisindesiniz. Sizler sanki hesaba\nçekilmiş, sırat köprüsünü geçmiş ve cennetteki yerle-\nrinizi görmüş gibisiniz.\nNedir bu büyük aldanış? Sizlerden her biri Allah Teala’ya\nkarşı büyük isyanlarda bulunmuştur. O kişi, ne isyanlarını\ndüşünüyor, ne de onlardan tevbe ediyor. O, günahların\nunutulduğunu zannediyor. Oysa onlar amel defterlerinizde\ntarihleri ve zamanları ile yazılıdır. Az veya çok olsun bütün\nyaptıklarınızdan hesaba çekileceksiniz.\nEy gâfiller! Gaflet uykusundan uyanınız.\nEy uykucular! Uyanınız ve Allah Teala’nın rahmetine\nsığınınız. Günahları ve hataları çoğalan ve bunda da ısrarcı\nolup tevbe edip pişman olmayan kişiler, küfrü istiyor ko-\nnumunda Allah Teala’nın huzuruna geleceklerdir.\nEy Yaratıcıyı değil de halkı isteyen!\nEy ahiretsiz dünyayı isteyen sen!", "word_count": 164, "char_count": 1212, "has_topics": false}, {"page": 99, "printed_page": 98, "title": "Zarar ve Faydayı İnsanlardan Bilmemeli", "content_html": "<p class=\"book-paragraph\">Sen fakirlikten başka bir şeyden korkmaz, zenginlikten başka bir şey de ummazsın.</p>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Allah Teala’nın ezelî ilminde rızık taksim edilmiştir. Rızık ne artar ne de eksilir, ne öne geçer ne de geri kalır.</p>\n<p class=\"book-paragraph\">Sen rızık konusunda Allah Teala’nın garantörlüğünden şüphe etmektesin. Sana ezelde taksim edilmeyen şeyleri alma konusunda da oldukça hırslısın. Senin rızka olan bu hırsın, âlimlerin sohbetlerinde bulunmana ve hayrı müşahede etmene engel oluyor. Kazancının eksileceğinden ve müşterilerinin azalacağından korkuyorsun.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Zarar ve Faydayı İnsanlardan Bilmemeli</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Anne karnında iken seni kim doyurdu? Oysa şimdi kendine, halka, dinar ve dirhemlerine, alış verişlerine ve şehrinin hükümdarına güveniyorsun. Güvendiğin, korktuğun ve umduğun, zarar ve faydayı kendilerinden gördüğün her şey senin ilâhındır. Bunların senin gerçek ilahın olan Allah Teala’nın huzurunda meydana geldiğini idrak edemedin. Çok yakın bir zamanda gerçeği göreceksin.</p>\n<p class=\"book-paragraph\">Allah (cc) senin kulağını, gözünü, elini, malını ve kendisinden başka bütün güvendiğin şeyleri alır ve seninle insanlar arasındaki bağı keser. Onların kalplerini sana karşı katılaştırarak, sana olan desteklerini keserek ve seni</p>", "raw_text": "Sen fakirlikten başka bir şeyden korkmaz, zenginlikten\nbaşka bir şey de ummazsın.\nYazıklar olsun sana! Allah Teala’nın ezelî ilminde rızık\ntaksim edilmiştir. Rızık ne artar ne de eksilir, ne öne geçer\nne de geri kalır.\nSen rızık konusunda Allah Teala’nın garantörlüğünden\nşüphe etmektesin. Sana ezelde taksim edilmeyen şeyleri\nalma konusunda da oldukça hırslısın. Senin rızka olan bu\nhırsın, âlimlerin sohbetlerinde bulunmana ve hayrı müşa-\nhede etmene engel oluyor. Kazancının eksileceğinden ve\nmüşterilerinin azalacağından korkuyorsun.\nZarar ve Faydayı İnsanlardan Bilmemeli\nYazıklar olsun sana! Anne karnında iken seni kim do-\nyurdu? Oysa şimdi kendine, halka, dinar ve dirhemlerine,\nalış verişlerine ve şehrinin hükümdarına güveniyorsun.\nGüvendiğin, korktuğun ve umduğun, zarar ve faydayı\nkendilerinden gördüğün her şey senin ilâhındır. Bunların\nsenin gerçek ilahın olan Allah Teala’nın huzurunda mey-\ndana geldiğini idrak edemedin. Çok yakın bir zamanda\ngerçeği göreceksin.\nAllah (cc) senin kulağını, gözünü, elini, malını ve\nkendisinden başka bütün güvendiğin şeyleri alır ve seninle\ninsanlar arasındaki bağı keser. Onların kalplerini sana\nkarşı katılaştırarak, sana olan desteklerini keserek ve seni", "word_count": 165, "char_count": 1206, "has_topics": true}, {"page": 100, "printed_page": 99, "title": "Mehâfetullâh — Sayfa 100", "content_html": "<p class=\"book-paragraph\">meşguliyetinden uzaklaştırır. Bütün kapıları yüzüne kapar, seni bir kapıdan öbür kapıya dolaştırır. Sana bir lokma ve bir zerre dahi vermez. Dua etti ğin zaman duâna icabet etmez. Bütün bunlar senin O’na şirk koşman, O’ndan başkasına güvenmen, nimeti O’ndan değil de kullarından istemen, O’nun nimetleriyle O’na isyanda bulunman sebebiyledir.</p>\n<p class=\"book-paragraph\">Ben çoğu kere bu tür kişilerde genellikle de asilerde bu olayları müşahede ettim. Asilerden bir kısmı tevbe etmek suretiyle gerekli önlemleri tedarik eder. Allah (cc) da onun tevbesini kabul eder ve rahmet nazarı ile bakarak ona kerem ve lütuflarda bulunur.</p>\n<p class=\"book-paragraph\">Ey Allah’ın kulları!</p>\n<p class=\"book-paragraph\">Tevbe ediniz. Ey Alimler! Ey Fakihler! Ey Zahitler! Ey Abidler! Sizden tevbeye muhtaç olmayan kimse yoktur. Hepiniz tevbeye muhtaçsınız.</p>\n<p class=\"book-paragraph\">Sizden birinizin sermayesi
