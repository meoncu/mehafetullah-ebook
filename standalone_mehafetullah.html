eni ba şlamış kişi fâsıklardan ve asilerden\nkaçarken, bu yolun sonuna gelen kişi ise bu insanlardan\nkaçma yerine tam aksine onları ister. Onları nasıl isteme-\nsin ki; onların bütün tedavisi onun yanındadır. Bundan\ndolayı bazı Allah (cc) dostları (rahmetullahi aleyhim)\nşöyle dediler:\n“Fasık kişinin yüzüne ancak Allah dostları güler.”\nAncak marifetullahı kemale eren kişi Allah için kıla-\nvuzluk yapabilir. İnsanları dünya denizinden avlayan bir\nağ olur. Allah (cc) tarafından kendisine öyle bir güç verilir\nki; o güç sayesinde şeytanı ve onun ordularını hezimete\nuğratarak insanları şeytanların ellerinden kurtarır.\nEy zahitlik taslayarak inzivaya çekilen kişi!\nGel ve sana ne diyeceğimi dinle.\nEy yeryüzünün zahitleri! Geliniz ve uzlet binalarınızı\nyıkınız ve bana yaklaşınız. Hiçbir asla dayanmadan uzlete\nçekildiniz ve hiçbir şey de elde edemediniz. Buraya geli-\nniz ve buradan hikmet meyvelerini toplayınız. Allah size\nmerhamet etsin, sizin bana gelmenizi kendim için değil\nsizler için istiyorum.", "word_count": 161, "char_count": 1118, "has_topics": false}, {"page": 105, "printed_page": 104, "title": "Mehâfetullâh — Sayfa 105", "content_html": "<p class=\"book-paragraph\">Ey evladım!</p>\n<p class=\"book-paragraph\">Bir sanatı öğreninceye kadar yorgunluklara katlanmak zorundasın. Bin kere yapıp bozarak bozulmayacak şekilde güzel yapmayı öğrenirsin. Yapıp bozma uğrunda kendini tükettiğinde, Allah (cc) senin için yıkılmayacak bina inşa eder.</p>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Ne zaman akıllanacaksınız? Ne zaman gidilecek yolu idrak edeceksiniz? Hakk’ı isteyenleri dola şınız. Allah dostlarını bulduğunuz zaman da mallar ınızla ve canlarınızla onlara hizmet ediniz. Sâd ık müritlerin kendilerine mahsus kokuları, açık alametleri ve nurâni simaları vardır. Fakat afet sizde, sizin gözlerinizde, sakat anlay ışlarınızdadır. Sizler sâdık ile z ındığı, haram ile helali, zehir ile zehirsizi, müşrik ile muvahhidi, ihlasl ı ile münaf ığı, asi ile itaatkarı, hakkı isteyen ile halkı isteyenleri birbirinden ayırt edemiyorsunuz.</p>\n<p class=\"book-paragraph\">İlmiyle amel eden şeyhlere hizmet edinki; onlar da eşyaları size olduğu gibi tanıtsınlar. Hakkı tanıma konusunda çalışınız. Zira siz O’nu tan ıdığınızda O’nun dışındakileri de tanımış olursunuz. O’nu tanıyın, sonra da O’nu seviniz. O’nu başınızda ki gözlerinizle göremiyorsanız, kalp gözlerinizle görünüz. Eğer nimetlerin O’ndan olduğunu bilirseniz, zaruri olarak O’nu seversiniz. Hz. Peygamber (sav) şöyle buyurmuştur:</p>", "raw_text": "Ey evladım!\nBir sanatı öğreninceye kadar yorgunluklara katlanmak\nzorundasın. Bin kere yapıp bozarak bozulmayacak şekilde\ngüzel yapmayı öğrenirsin. Yapıp bozma uğrunda kendini\ntükettiğinde, Allah (cc) senin için yıkılmayacak bina inşa\neder.\nEy cemaat!\nNe zaman akıllanacaksınız? Ne zaman gidilecek yolu\nidrak edeceksiniz? Hakk’ı isteyenleri dola şınız. Allah\ndostlarını bulduğunuz zaman da mallar ınızla ve canları-\nnızla onlara hizmet ediniz. Sâd ık müritlerin kendilerine\nmahsus kokuları, açık alametleri ve nurâni simaları vardır.\nFakat afet sizde, sizin gözlerinizde, sakat anlay ışlarınız-\ndadır. Sizler sâdık ile z ındığı, haram ile helali, zehir ile\nzehirsizi, müşrik ile muvahhidi, ihlasl ı ile münaf ığı, asi\nile itaatkarı, hakkı isteyen ile halkı isteyenleri birbirinden\nayırt edemiyorsunuz.\nİlmiyle amel eden şeyhlere hizmet edinki; onlar da eş-\nyaları size olduğu gibi tanıtsınlar. Hakkı tanıma konusunda\nçalışınız. Zira siz O’nu tan ıdığınızda O’nun dışındakileri\nde tanımış olursunuz. O’nu tanıyın, sonra da O’nu sevi-\nniz. O’nu başınızda ki gözlerinizle göremiyorsanız, kalp\ngözlerinizle görünüz. Eğer nimetlerin O’ndan olduğunu\nbilirseniz, zaruri olarak O’nu seversiniz. Hz. Peygamber\n(sav) şöyle buyurmuştur:", "word_count": 167, "char_count": 1224, "has_topics": false}, {"page": 106, "printed_page": 105, "title": "Arif Kişinin Kalbi", "content_html": "<p class=\"book-paragraph\">“Sizi nimetleri ile beslediğinden dolayı Allah Teala’yı sevin, Allah (cc) beni sevdiğinden dolayı siz de beni sevin.”41</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Arif Kişinin Kalbi</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"khutba-callout\"><span class=\"callout-icon\">📿</span> <strong>Ey cemaat!</strong></div>\n<p class=\"book-paragraph\">Sizler annenizin karnında iken ve onların karınlarından çıktıktan sonra nimetleriyle sizleri Allah Teala besledi. Sonra sizlere sağlık, güç ve kuvvet verdi. Sizleri kendisine itaatle rızıklandırdı ve nebisine tabi olan Müslümanlardan kıldı. Peygambere müteşekkir olmak ve O’nu sevmek Allah Teala’ya şükretmek ve O’nu sevmek gibidir. Nimetlerin Allah Teala’dan olduğunu bilirseniz kalplerinizden halka olan sevgi yok olur.</p>\n<p class=\"book-paragraph\">Arif olan, O’nu seven, O’na kalp gözüyle bakan, iyiliği ve kötülüğü O’ndan bilir. Ona iyilik eden ve kötülük eden hiçbir kimseyi görmez. Eğer o insanlardan kendisine bir iyilik yapılacak olsa Allah’ın bu insanları kendisine iyilik yapmakla görevlendirdiği kişiler olarak görür. Eğer bu insanlardan kendisine bir kötülük gelecek olursa; o zaman da Allah Teala’nın kendisine bu kötülüğü yapmakla bu kişileri görevlendirdiğini bilir. Onun bu olaylara bakışı ve yorumlayışı halktan Hâlık’adır. Olayların arkasında halkı değil Hâlık’ı görür. O şeriatın emirlerini yerine getirir, şeriatın hükümlerini düşürmez.</p>\n<div class=\"footnote-box\"><span class=\"fn-badge\">Dipnot</span> 41 Sünen-i Tirmizî, 3789</div>", "raw_text": "“Sizi nimetleri ile beslediğinden dolayı Allah\nTeala’yı sevin, Allah (cc) beni sevdiğinden dolayı\nsiz de beni sevin.”41\nArif Kişinin Kalbi\nEy cemaat!\nSizler annenizin karnında iken ve onların karınlarından\nçıktıktan sonra nimetleriyle sizleri Allah Teala besledi. Sonra\nsizlere sağlık, güç ve kuvvet verdi. Sizleri kendisine itaatle\nrızıklandırdı ve nebisine tabi olan Müslümanlardan kıldı.\nPeygambere müteşekkir olmak ve O’nu sevmek Allah\nTeala’ya şükretmek ve O’nu sevmek gibidir. Nimetlerin\nAllah Teala’dan olduğunu bilirseniz kalplerinizden halka\nolan sevgi yok olur.\nArif olan, O’nu seven, O’na kalp gözüyle bakan, iyiliği\nve kötülüğü O’ndan bilir. Ona iyilik eden ve kötülük eden\nhiçbir kimseyi görmez. Eğer o insanlardan kendisine bir\niyilik yapılacak olsa Allah’ın bu insanları kendisine iyilik\nyapmakla görevlendirdiği kişiler olarak görür. Eğer bu in-\nsanlardan kendisine bir kötülük gelecek olursa; o zaman\nda Allah Teala’nın kendisine bu kötülüğü yapmakla bu\nkişileri görevlendirdiğini bilir. Onun bu olaylara bakışı ve\nyorumlayışı halktan Hâlık’adır. Olayların arkasında halkı\ndeğil Hâlık’ı görür. O şeriatın emirlerini yerine getirir,\nşeriatın hükümlerini düşürmez.\n41 Sünen-i Tirmizî, 3789", "word_count": 165, "char_count": 1204, "has_topics": true}, {"page": 107, "printed_page": 106, "title": "Mehâfetullâh — Sayfa 107", "content_html": "<p class=\"book-paragraph\">Arif kişinin kalbi; halktan gelecek şeyleri terk etme ve onlardan yüz çevirme, hakka rağbet ve tevekkül etme gibi duyguları kuvvetlenip pekişinceye kadar, devamlı bir halden diğer bir hale dönüşür. Eşyaları halktan alma duygusu ondan gider, eşyaları halktan alma esnasında onu Hakkın takdiriyle aldığının farkına varır. Halkla kendi arasındaki müşterek aklı güçlendiği gibi, diğer aklı da ziyadeleşir, o akıl da Allah (cc) tarafından ona bahşedilen akıldır. Ey mahlûkatın fakiri!</p>\n<p class=\"book-paragraph\">Ey onlar sebebiyle şirk koşan kişi!</p>\n<p class=\"book-paragraph\">Bulunduğun bu hal üzereyken ölmekten sakın. Allah (cc) kapısını senin ruhuna açmaz ve sanabakmaz. Çünkü o kendisinden başkasına güvenen müşrik kişiye çok öfkelidir. Senin önce kendi nefsinden, sonra mahlûkattan, sonra dünyadan, ardından ahiretten, en sonunda da Allah Teala’nın dışındaki her şeyden uzaklaşman gerekir. Allah (cc) ile kalmak istiyorsan, varlığından, tedbirlerinden ve hezeyanlarından sıyrıl.</p>\n<p class=\"book-paragraph\">Yazıklar olsun sana! Sen ibadethanede uzlet içersinde oturmaktasın. Oysa ki kalbin insanların evlerinde onların sana gelmesini ve hediyeler getirmesini bekler vaziyette bulunmaktadır.</p>\n<p class=\"book-paragraph\">Zamanın boşa gitti, sana da mânâs ız şekiller kaldı. Allah Teala’nın seni ehil görmediği bir şeyde sen kendini</p>", "raw_text": "Arif kişinin kalbi; halktan gelecek şeyleri terk etme ve\nonlardan yüz çevirme, hakka rağbet ve tevekkül etme gibi\nduyguları kuvvetlenip pekişinceye kadar, devamlı bir hal-\nden diğer bir hale dönüşür. Eşyaları halktan alma duygusu\nondan gider, eşyaları halktan alma esnasında onu Hakkın\ntakdiriyle aldığının farkına varır. Halkla kendi arasındaki\nmüşterek aklı güçlendiği gibi, diğer aklı da ziyadeleşir, o\nakıl da Allah (cc) tarafından ona bahşedilen akıldır.\nEy mahlûkatın fakiri!\nEy onlar sebebiyle şirk koşan kişi!\nBulunduğun bu hal üzereyken ölmekten sakın. Allah\n(cc) kapısını senin ruhuna açmaz ve sanabakmaz. Çünkü\no kendisinden başkasına güvenen müşrik kişiye çok öf-\nkelidir. Senin önce kendi nefsinden, sonra mahlûkattan,\nsonra dünyadan, ardından ahiretten, en sonunda da Allah\nTeala’nın dışındaki her şeyden uzaklaşman gerekir. Allah\n(cc) ile kalmak istiyorsan, varlığından, tedbirlerinden ve\nhezeyanlarından sıyrıl.\nYazıklar olsun sana! Sen ibadethanede uzlet içersinde\noturmaktasın. Oysa ki kalbin insanların evlerinde onların\nsana gelmesini ve hediyeler getirmesini bekler vaziyette\nbulunmaktadır.\nZamanın boşa gitti, sana da mânâs ız şekiller kaldı.\nAllah Teala’nın seni ehil görmediği bir şeyde sen kendini", "word_count": 169, "char_count": 1222, "has_topics": false}, {"page": 108, "printed_page": 107, "title": "Mehâfetullâh — Sayfa 108", "content_html": "<p class=\"book-paragraph\">ehil görme. Eğer Allah (cc) tarafından ehil görülmemişsen; onu ne sen, ne de ba şka insanlar takdir edebilir. Eğer Allah (cc) seni bir i şe ehil görmüşse seni o i şe hazırlar. Eğer için (bâtının) düzgün değilse, kalbin de hakkın dışındakilerden uzak değilse, sırf halvete çekilmen sana bir fayda sağlamaz.</p>\n<p class=\"book-paragraph\">Allah’ım! Söylediklerimden bana fayda ver, konuştuklarımdan ve dinlediklerinden onları faydalandır.</p>", "raw_text": "ehil görme. Eğer Allah (cc) tarafından ehil görülmemişsen;\nonu ne sen, ne de ba şka insanlar takdir edebilir. Eğer\nAllah (cc) seni bir i şe ehil görmüşse seni o i şe hazırlar.\nEğer için (bâtının) düzgün değilse, kalbin de hakkın dı-\nşındakilerden uzak değilse, sırf halvete çekilmen sana bir\nfayda sağlamaz.\nAllah’ım! Söylediklerimden bana fayda ver, konuştuk-\nlarımdan ve dinlediklerinden onları faydalandır.", "word_count": 62, "char_count": 409, "has_topics": false}, {"page": 109, "printed_page": 108, "title": "Bölüm Ayırıcı", "content_html": "<div class=\"section-divider-leaf\"><span class=\"leaf-ornament\">✦ ✦ ✦</span><p>Bölüm Ayırıcı Yaprak — Sayfa 109</p></div>", "raw_text": "", "word_count": 0, "char_count": 0, "has_topics": false}, {"page": 110, "printed_page": 109, "title": "Halka İltifat Etmemek", "content_html": "<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Halka İltifat Etmemek</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Dünya ahirete perdedir. Ahiret de dünya ve ahiretin Rabbini görmeye karşı bir perdedir. Her mahluk Allah Teala’yı görmeye bir perdedir. Beraber bulunduğun her mahluk senin için bir engeldir. Öyleyse yaratıklara, dünyaya ve Hakkın dışındakilere iltifat etme ki; Hakkın kapısına sarıl ki O’nun dışındakilerden sıyrılmış bir vaziyette sağlam bir zahitlikle O’na gelebilesin. O’ndan yardım dileyerek, O’nun ezeldeki takdirine ve ilmine bakarak O’ndan yardım alabilesin. Kalbin ve sırrının vuslatları gerçekleşip O’nun huzuruna girdiklerinde, O seni yaklaştırır, yakınına alır, sana selam eder, seni kalplere hakim kılar, kalplerin emiri ve tabibi yapar. İşte bu konuma geldikten sonra halka ve dünyaya döndürülürsün. Senin onlara döndürülmen onlar hakkında bir nimet olur. Dünyayı onların elinden alıp fakirlere vermen, kendi kısmetini de eksiksiz alman, ibadet, taat ve selamettir.</p>", "raw_text": "Halka İltifat Etmemek\nDünya ahirete perdedir. Ahiret de dünya ve ahiretin\nRabbini görmeye karşı bir perdedir. Her mahluk Allah\nTeala’yı görmeye bir perdedir. Beraber bulunduğun her\nmahluk senin için bir engeldir. Öyleyse yaratıklara, dünyaya\nve Hakkın dışındakilere iltifat etme ki; Hakkın kapısına\nsarıl ki O’nun dışındakilerden sıyrılmış bir vaziyette sağlam\nbir zahitlikle O’na gelebilesin. O’ndan yardım dileyerek,\nO’nun ezeldeki takdirine ve ilmine bakarak O’ndan yardım\nalabilesin. Kalbin ve sırrının vuslatları gerçekleşip O’nun\nhuzuruna girdiklerinde, O seni yaklaştırır, yakınına alır,\nsana selam eder, seni kalplere hakim kılar, kalplerin emiri\nve tabibi yapar. İşte bu konuma geldikten sonra halka\nve dünyaya döndürülürsün. Senin onlara döndürülmen\nonlar hakkında bir nimet olur. Dünyayı onların elinden\nalıp fakirlere vermen, kendi kısmetini de eksiksiz alman,\nibadet, taat ve selamettir.", "word_count": 123, "char_count": 900, "has_topics": true}, {"page": 111, "printed_page": 110, "title": "Velîlerin Yüzlerinde Velâyet İzleri Vardır", "content_html": "<p class=\"book-paragraph\">Dünya kendisini bu özelliklerden dolayı alan kişiye zarar vermez. Tam aksine o kişi selamette olur. Bulanık ve pis olmasına rağmen kendi kısmetini tertemiz olarak alır.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Velîlerin Yüzlerinde Velâyet İzleri Vardır</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Velîlerin yüzlerinde velâyet izleri vardır, bu izleri ferâset ehli kişiler bilirler. Dil değil işaretler velâyeti konuşur. Kurtuluşa ermek isteyen kişi canını ve malını Allah (cc) yoluna sarf etsin ki; bu durum, sütteki ve hamurdaki kılın çıkartılması gibi, onun kalbinin de yaratıklardan ve dünyadan sıyrılmasına sebep olsun. O, bunun dışındaki şeylerden ve hakkın dışındaki her şeyden böylece sıyrılmış olur. O takdirde onun huzurunda her hak sahibine hakkı tastamam verilir. Sen de dünya ve ahiretten nasibini yersin, sen hakkın kapısında dururken, dünya ve ahiret senin hizmetinde bulunurlar. Dünya yerinde otururken, sen ayağa kalkarak ondan nasibini yeme. Bilakis sen hükümdar olan Allah’ın kapısında otururken, dünyanın sana ayakta hizmet ederek, tepsileri başında dolaştırmasını bekle. Dünya, Hakkın kapısında bekleyene hizmet ederken, kendi kapısında bekleyeni de zelil eder. Dünyadan nasibini zenginlik elinle ve Allah Teala’nın sana verdiği izzet sebebiyle ye.</p>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Allah’ın Rızasını Kazanmak Her Şeyden Üstündür</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<div class=\"topic-header-block\">\n  <div class=\"topic-ornament\">❦</div>\n  <h2 class=\"topic-title\">Allah’ın Rızasını Kazanmak Her Şeyden Üstündür</h2>\n  <div class=\"topic-line\"></div>\n</div>\n<p class=\"book-paragraph\">Allah dostları, Allah (cc) rızasını kazanmayı dünyada maddeten iflas etmeğe, Allah Teala’nın kendisine yaklaştırmasını ahirete tercih etmişlerdir. Onlar Allah Teala’dan</p>", "raw_text": "Dünya kendisini bu özelliklerden dolayı alan kişiye zarar\nvermez. Tam aksine o kişi selamette olur. Bulanık ve pis\nolmasına rağmen kendi kısmetini tertemiz olarak alır.\nVelîlerin Yüzlerinde Velâyet İzleri Vardır\nVelîlerin yüzlerinde velâyet izleri vardır, bu izleri ferâset\nehli kişiler bilirler. Dil değil işaretler velâyeti konuşur. Kurtuluşa\nermek isteyen kişi canını ve malını Allah (cc) yoluna sarf\netsin ki; bu durum, sütteki ve hamurdaki kılın çıkartılması\ngibi, onun kalbinin de yaratıklardan ve dünyadan sıyrılma-\nsına sebep olsun. O, bunun dışındaki şeylerden ve hakkın\ndışındaki her şeyden böylece sıyrılmış olur. O takdirde onun\nhuzurunda her hak sahibine hakkı tastamam verilir. Sen de\ndünya ve ahiretten nasibini yersin, sen hakkın kapısında\ndururken, dünya ve ahiret senin hizmetinde bulunurlar.\nDünya yerinde otururken, sen ayağa kalkarak ondan na-\nsibini yeme. Bilakis sen hükümdar olan Allah’ın kapısında\notururken, dünyanın sana ayakta hizmet ederek, tepsileri\nbaşında dolaştırmasını bekle. Dünya, Hakkın kapısında bek-\nleyene hizmet ederken, kendi kapısında bekleyeni de zelil\neder. Dünyadan nasibini zenginlik elinle ve Allah Teala’nın\nsana verdiği izzet sebebiyle ye.\nAllah’ın Rızasını Kazanmak Her Şeyden\nÜstündür\nAllah dostları, Allah (cc) rızasını kazanmayı dünyada\nmaddeten iflas etmeğe, Allah Teala’nın kendisine yaklaş-\ntırmasını ahirete tercih etmişlerdir. Onlar Allah Teala’dan", "word_count": 194, "char_count": 1407, "has_topics": true}, {"page": 112, "printed_page": 111, "title": "Mehâfetullâh — Sayfa 112", "content_html": "<p class=\"book-paragraph\">O’nun dışında başka hiçbir şey istemezler. Onlar dünyanın ezelde taksim edildiğini bilirler ve O’nu istemeyi terk etmişlerdir. Yine onlar ahirette derecelerin ve nimetlerin taksim edildiğini bilirler ve bu yönde de istekte bulunmazlar ve bunun için de amel etmezler. Onlar Allah Teala’nın rızasının dışında hiçbir şey istemezler. Onlar cennete girdiklerinde de hakkın yüzünün nurunu görmedikçe gözlerini açmazlar. Hakkın dışındakilerden soyutlanıp, hakla birlikte olmayı sev. Kimin kalbi halktan ve sebeplerden sıyrılamamışsa, hatta kişi az bir dünyalıkla yetinip, geri kalan kısmı da kaderin eline bırakmamışsa; o kişi nebîlerin, sâdıkların ve salihlerin yoluna girmeye güç yetiremez. Dünyalıktan çok istemeye kalkma. Zira çok mal seni felakete götürür. Ama senin iraden dışında hak tarafından verilmişse bu konuda sen hak tarafından korunursun.</p>\n<p class=\"book-paragraph\">Hasan-ı Basri (rh) şöyle diyordu: “İnsanlara ilminle ve sözlerinle vaaz et. Ey vaiz! İnsanlara sırrının saflığı, kalbinin takvâsı ile aph\">Dünya; ömrü k ısa, nimetleri geçici, güzellikleri değişken, ahlakı çok kötü, eli kanlı, sözleri zehirli, zevkpe- rest, kendisine bir daha dönüşü olmayan, aslı da, vefası da olmayand ır. Dünyada kalmaya kalkmak su üzerine bina yapmak gibidir. Bundan dolayı gerçek mümin dünyayı kalbine karargâh, kendine yurt edinmez. O yava ş yavaş yükselir ve kendisine sağlam bir yer edinir ve böylece Hakk’ı tanır. Mümin dünyada da ahirette de kendisine karargâh</p>", "raw_text": "mede Allah (cc) ile beraber olur. Zira zahitlik insan ın\nkalbine yerle şirse; insan dünyal ık şeyleri elde etmekle\ndeğişmez, dünyadaki kısmetini alır.\nEğer mümin dünyay ı, dünya ehlini, şehvetleri lez-\nzetleri sevseydi, bunlardan bir an dahi geri kalmadan\ndevamlı bunlarla meşgul olurdu. Mümin bunları sevdiği\nzaman, Allah’a kulluk yapmaz, ibadetlerini yerine ge-\ntirmez, Allah Teala’y ı anmaz, O’na itaat etmezdi. Al-\nlah (cc) lütfü sebebiyle bu ki şiye kusurlar ını, ay ıplarını\ngösterdi de, o da geçmiş zamanlarda yaptığı bu günah-\nlarına pişman oldu ve tevbe etti. Yine Allah (cc) ona ki-\ntap, sünnet ve mürşitler sayesinde dünyanın kusurlarını\ngösterdi de o da bunlara kar şı dünyada zâhit oldu. O\nher ne zaman dünyan ın bir kusurunu görse, Allah (cc)\nona başka kusurları da gösterirdi. O bütün bunların fâni\nolduğunu anladı.\nDünya Nedir\nDünya; ömrü k ısa, nimetleri geçici, güzellikleri de-\nğişken, ahlakı çok kötü, eli kanlı, sözleri zehirli, zevkpe-\nrest, kendisine bir daha dönüşü olmayan, aslı da, vefası\nda olmayand ır. Dünyada kalmaya kalkmak su üzerine\nbina yapmak gibidir. Bundan dolayı gerçek mümin dün-\nyayı kalbine karargâh, kendine yurt edinmez. O yava ş\nyavaş yükselir ve kendisine sağlam bir yer edinir ve böy-\nlece Hakk’ı tanır.\nMümin dünyada da ahirette de kendisine karargâh", "word_count": 205, "char_count": 1297, "has_topics": true}, {"page": 119, "printed_page": 118, "title": "Mehâfetullâh — Sayfa 119", "content_html": "<p class=\"book-paragraph\">olarak Allah Teala’ya ya /**
 * MEHÂFETULLÂH (ALLAH KORKUSU) - E-Book Application Logic
 * Abdülkâdir Geylânî (k.s.)
 */

(function () {
  'use strict';

  // Global App State
  const state = {
    db: null,
    currentPage: 1,
    totalPages: 121,
    theme: 'sepia',
    fontSize: 18,
    fontFamily: 'serif',
    textAlign: 'justify',
    observer: null,
    isManualScroll: false
  };

  // DOM Elements
  const elements = {
    viewport: document.getElementById('readerViewport'),
    progressBar: document.getElementById('readingProgressBar'),
    pageBadge: document.getElementById('currentPageBadge'),
    chapterPreview: document.getElementById('chapterPreview'),
    btnPrev: document.getElementById('btnPrevPage'),
    btnNext: document.getElementById('btnNextPage'),
    btnJumpIndicator: document.getElementById('btnJumpIndicator'),
    
    // Drawers & Modals
    tocDrawer: document.getElementById('tocDrawerBackdrop'),
    settingsDrawer: document.getElementById('settingsDrawerBackdrop'),
    jumpModal: document.getElementById('jumpModalBackdrop'),
    searchModal: document.getElementById('searchModalBackdrop'),
    
    // Controls inside TOC
    tocList: document.getElementById('tocList'),
    tocSearch: document.getElementById('tocSearchInput'),
    
    // Controls inside Jump Modal
    jumpSlider: document.getElementById('jumpSlider'),
    jumpPageDisplay: document.getElementById('jumpPageDisplay'),
    jumpTitlePreview: document.getElementById('jumpTitlePreview'),
    btnConfirmJump: document.getElementById('btnConfirmJump'),
    
    // Controls inside Search Modal
    searchInput: document.getElementById('searchInput'),
    searchResults: document.getElementById('searchResultsList'),
    
    // Controls inside Settings
    fontSizeDisplay: document.getElementById('fontSizeDisplay'),
    btnFontDec: document.getElementById('btnFontDec'),
    btnFontInc: document.getElementById('btnFontInc')
  };

  // 1. Initialization
  function init() {
    // Load Database
    if (window.BOOK_DATABASE) {
      state.db = window.BOOK_DATABASE;
    } else {
      console.error('BOOK_DATABASE not loaded!');
      return;
    }

    state.totalPages = state.db.meta.total_pages || 121;

    // Load persisted settings
    loadSettings();

    // Render all 121 pages
    renderBookPages();

    // Populate TOC Drawer
    renderTOCDrawer();

    // Setup Intersection Observer for scrolling
    setupScrollObserver();

    // Setup Event Listeners
    setupEventListeners();

    // Register Service Worker
    registerSW();

    // Restore last read position
    const savedPage = parseInt(localStorage.getItem('mehafetullah_last_page') || '1', 10);
    if (savedPage > 1 && savedPage <= state.totalPages) {
      setTimeout(() => {
        goToPage(savedPage, false);
      }, 200);
    } else {
      updateHeaderIndicator(1);
    }
  }

  // 2. Settings Management
  function loadSettings() {
    const savedTheme = localStorage.getItem('mehafetullah_theme') || 'sepia';
    const savedFontSize = parseInt(localStorage.getItem('mehafetullah_font_size') || '18', 10);
    const savedFontFamily = localStorage.getItem('mehafetullah_font_family') || 'serif';
    const savedAlign = localStorage.getItem('mehafetullah_text_align') || 'justify';

    setTheme(savedTheme, false);
    setFontSize(savedFontSize, false);
    setFontFamily(savedFontFamily, false);
    setTextAlign(savedAlign, false);
  }

  function setTheme(theme, save = true) {
    state.theme = theme;
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-card-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
    });
    if (save) localStorage.setItem('mehafetullah_theme', theme);
  }

  function setFontSize(size, save = true) {
    state.fontSize = Math.min(28, Math.max(14, size));
    document.documentElement.style.setProperty('--reader-font-size', `${state.fontSize}px`);
    if (elements.fontSizeDisplay) {
      elements.fontSizeDisplay.textContent = `${state.fontSize}px`;
    }
    if (save) localStorage.setItem('mehafetullah_font_size', state.fontSize);
  }

  function setFontFamily(font, save = true) {
    state.fontFamily = font;
    const fontValue = font === 'sans' ? 'var(--font-sans)' : 'var(--font-serif)';
    document.documentElement.style.setProperty('--reader-font', fontValue);
    document.querySelectorAll('.font-family-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-font') === font);
    });
    if (save) localStorage.setItem('mehafetullah_font_family', font);
  }

  function setTextAlign(align, save = true) {
    state.textAlign = align;
    document.documentElement.style.setProperty('--reader-text-align', align);
    if (save) localStorage.setItem('mehafetullah_text_align', align);
  }

  // 3. Render Book Pages
  function renderBookPages() {
    const container = elements.viewport;
    container.innerHTML = '';

    const fragment = document.createDocumentFragment();

    state.db.pages.forEach(p => {
      const card = document.createElement('article');
      card.className = 'page-card';
      card.id = `page-${p.page}`;
      card.setAttribute('data-page', p.page);
      card.setAttribute('data-title', p.title);

      const header = document.createElement('div');
      header.className = 'page-card-header';
      header.innerHTML = `
        <span class="page-card-title">${escapeHTML(p.title)}</span>
        <span class="page-card-num">Sayfa ${p.page} / ${state.totalPages}</span>
      `;

      const body = document.createElement('div');
      body.className = 'page-card-body';
      body.innerHTML = p.content_html;

      card.appendChild(header);
      card.appendChild(body);
      fragment.appendChild(card);
    });

    container.appendChild(fragment);
  }

  // 4. Render Table of Contents in Drawer
  function renderTOCDrawer() {
    const list = elements.tocList;
    list.innerHTML = '';

    const fragment = document.createDocumentFragment();

    // First add special quick links
    const specials = [
      { title: 'Kapak', page: 1 },
      { title: 'Künye & Yayın Bilgileri', page: 3 },
      { title: 'İçindekiler Fihristi', page: 6 },
      { title: "Abdülkâdir Geylânî'nin Hayatı", page: 10 }
    ];

    specials.forEach(s => {
      const item = document.createElement('li');
      item.className = 'toc-drawer-item';
      item.innerHTML = `
        <span class="toc-drawer-title">📌 ${s.title}</span>
        <span class="toc-drawer-page">S. ${s.page}</span>
      `;
      item.addEventListener('click', () => {
        goToPage(s.page);
        closeAllDrawers();
      });
      fragment.appendChild(item);
    });

    // Divider
    const divider = document.createElement('li');
    divider.className = 'toc-drawer-divider';
    divider.style.padding = '8px 12px';
    divider.style.fontSize = '11px';
    divider.style.fontWeight = '700';
    divider.style.color = 'var(--text-muted)';
    divider.style.letterSpacing = '1px';
    divider.textContent = 'KİTAP BÖLÜM VE BAŞLIKLARI (76 KONU)';
    fragment.appendChild(divider);

    // Add all 69 TOC topics
    state.db.toc.forEach(t => {
      const item = document.createElement('li');
      item.className = 'toc-drawer-item';
      item.setAttribute('data-search', t.title.toLowerCase());
      item.innerHTML = `
        <span class="toc-drawer-title">❦ ${escapeHTML(t.title)}</span>
        <span class="toc-drawer-page">S. ${t.pdf_page}</span>
      `;
      item.addEventListener('click', () => {
        goToPage(t.pdf_page);
        closeAllDrawers();
      });
      fragment.appendChild(item);
    });

    list.appendChild(fragment);
  }

  // 5. Scroll Observer for Live Header Updates
  function setupScrollObserver() {
    const options = {
      root: null,
      rootMargin: '-20% 0px -70% 0px',
      threshold: 0
    };

    state.observer = new IntersectionObserver((entries) => {
      if (state.isManualScroll) return;

      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.getAttribute('data-page'), 10);
          const pageTitle = entry.target.getAttribute('data-title');
          updateHeaderIndicator(pageNum, pageTitle);
        }
      });
    }, options);

    document.querySelectorAll('.page-card').forEach(card => {
      state.observer.observe(card);
    });

    // Scroll progress bar
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      if (elements.progressBar) {
        elements.progressBar.style.width = `${scrolled}%`;
      }
    }, { passive: true });
  }

  // 6. Navigation Logic
  function updateHeaderIndicator(pageNum, title) {
    state.currentPage = pageNum;
    localStorage.setItem('mehafetullah_last_page', pageNum);

    const titleText = title || (state.db.pages[pageNum - 1] ? state.db.pages[pageNum - 1].title : `Sayfa ${pageNum}`);

    if (elements.pageBadge) {
      elements.pageBadge.textContent = `Sayfa ${pageNum} / ${state.totalPages}`;
    }
    if (elements.chapterPreview) {
      elements.chapterPreview.textContent = titleText;
    }
    if (elements.btnJumpIndicator) {
      elements.btnJumpIndicator.textContent = `Sayfa ${pageNum} / ${state.totalPages}`;
    }

    if (elements.btnPrev) elements.btnPrev.disabled = pageNum <= 1;
    if (elements.btnNext) elements.btnNext.disabled = pageNum >= state.totalPages;

    // Highlight active item in TOC drawer
    document.querySelectorAll('.toc-drawer-item').forEach(el => {
      const p = parseInt(el.querySelector('.toc-drawer-page')?.textContent.replace(/\D/g, '') || '0', 10);
      el.classList.toggle('active', p === pageNum);
    });
  }

  function goToPage(pageNum, smooth = true) {
    const targetNum = Math.min(state.totalPages, Math.max(1, pageNum));
    const targetEl = document.getElementById(`page-${targetNum}`);

    if (targetEl) {
      state.isManualScroll = true;
      const topOffset = targetEl.getBoundingClientRect().top + window.pageYOffset - 66;

      window.scrollTo({
        top: Math.max(0, topOffset),
        behavior: smooth ? 'smooth' : 'auto'
      });

      updateHeaderIndicator(targetNum);

      setTimeout(() => {
        state.isManualScroll = false;
      }, 600);
    }
  }

  window.goToPage = goToPage; // Export for inline onclicks

  // 7. Modals and Drawers
  function openDrawer(drawer) {
    if (!drawer) return;
    closeAllDrawers();
    drawer.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAllDrawers() {
    [elements.tocDrawer, elements.settingsDrawer, elements.jumpModal, elements.searchModal].forEach(d => {
      if (d) d.classList.remove('active');
    });
    document.body.style.overflow = '';
  }

  function openJumpModal() {
    const slider = elements.jumpSlider;
    slider.min = 1;
    slider.max = state.totalPages;
    slider.value = state.currentPage;
    updateJumpPreview(state.currentPage);
    openDrawer(elements.jumpModal);
  }

  function updateJumpPreview(pageNum) {
    const p = Math.min(state.totalPages, Math.max(1, parseInt(pageNum, 10)));
    elements.jumpPageDisplay.textContent = `Sayfa ${p}`;
    const pageObj = state.db.pages[p - 1];
    elements.jumpTitlePreview.textContent = pageObj ? pageObj.title : `Mehâfetullâh — Sayfa ${p}`;
  }

  // 8. Full-Text Search
  function performSearch(query) {
    const list = elements.searchResults;
    list.innerHTML = '';

    const q = query.trim().toLowerCase();
    if (!q || q.length < 2) {
      list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted);">Aramak istediğiniz kelimeyi giriniz (en az 2 harf)...</div>';
      return;
    }

    const results = [];
    const regex = new RegExp(`(${escapeRegex(q)})`, 'gi');

    state.db.pages.forEach(p => {
      const text = p.raw_text || '';
      const lower = text.toLowerCase();
      const idx = lower.indexOf(q);

      if (idx !== -1) {
        // Find snippet around index
        const start = Math.max(0, idx - 45);
        const end = Math.min(text.length, idx + q.length + 55);
        let snippet = text.substring(start, end).replace(/\s+/g, ' ');

        if (start > 0) snippet = '...' + snippet;
        if (end < text.length) snippet = snippet + '...';

        const highlighted = escapeHTML(snippet).replace(regex, '<mark>$1</mark>');

        results.push({
          page: p.page,
          title: p.title,
          snippet: highlighted
        });
      }
    });

    if (results.length === 0) {
      list.innerHTML = `<div style="padding:24px; text-align:center; color:var(--text-muted);">"<strong>${escapeHTML(query)}</strong>" ifadesi bulunamadı.</div>`;
      return;
    }

    const fragment = document.createDocumentFragment();
    const countInfo = document.createElement('div');
    countInfo.style.padding = '4px 8px 12px';
    countInfo.style.fontSize = '12px';
    countInfo.style.fontWeight = 'bold';
    countInfo.style.color = 'var(--accent-color)';
    countInfo.textContent = `${results.length} sonuç bulundu:`;
    fragment.appendChild(countInfo);

    results.forEach(res => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.innerHTML = `
        <div class="search-result-header">
          <span>${escapeHTML(res.title)}</span>
          <span>Sayfa ${res.page}</span>
        </div>
        <div class="search-result-snippet">${res.snippet}</div>
      `;
      item.addEventListener('click', () => {
        closeAllDrawers();
        goToPage(res.page);
      });
      fragment.appendChild(item);
    });

    list.appendChild(fragment);
  }

  // 9. Event Listeners Setup
  function setupEventListeners() {
    // Header buttons
    document.getElementById('btnOpenTOC').addEventListener('click', () => openDrawer(elements.tocDrawer));
    document.getElementById('btnOpenSettings').addEventListener('click', () => openDrawer(elements.settingsDrawer));
    document.getElementById('btnOpenSearch').addEventListener('click', () => {
      openDrawer(elements.searchModal);
      setTimeout(() => elements.searchInput.focus(), 150);
    });
    document.getElementById('headerCenterBtn').addEventListener('click', openJumpModal);

    // Bottom Navigation buttons
    elements.btnPrev.addEventListener('click', () => goToPage(state.currentPage - 1));
    elements.btnNext.addEventListener('click', () => goToPage(state.currentPage + 1));
    elements.btnJumpIndicator.addEventListener('click', openJumpModal);

    // Close drawers via backdrop clicks
    document.querySelectorAll('.drawer-backdrop, .modal-center-backdrop').forEach(bd => {
      bd.addEventListener('click', (e) => {
        if (e.target === bd) closeAllDrawers();
      });
    });

    // Close buttons inside drawers/modals
    document.getElementById('btnCloseTOC').addEventListener('click', closeAllDrawers);
    document.getElementById('btnCloseSettings').addEventListener('click', closeAllDrawers);
    document.getElementById('btnCancelJump').addEventListener('click', closeAllDrawers);
    document.getElementById('btnCloseSearch').addEventListener('click', closeAllDrawers);

    // TOC Search Filter
    elements.tocSearch.addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      document.querySelectorAll('#tocList .toc-drawer-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(val) ? 'flex' : 'none';
      });
    });

    // Jump Slider & Quick Buttons
    elements.jumpSlider.addEventListener('input', (e) => {
      updateJumpPreview(e.target.value);
    });

    elements.btnConfirmJump.addEventListener('click', () => {
      const p = parseInt(elements.jumpSlider.value, 10);
      closeAllDrawers();
      goToPage(p);
    });

    document.querySelectorAll('.quick-jump-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = parseInt(btn.getAttribute('data-page'), 10);
        elements.jumpSlider.value = p;
        updateJumpPreview(p);
      });
    });

    // Search Input
    let searchDebounce = null;
    elements.searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        performSearch(e.target.value);
      }, 250);
    });

    // Theme selector buttons
    document.querySelectorAll('.theme-card-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setTheme(btn.getAttribute('data-theme'));
      });
    });

    // Font size buttons
    elements.btnFontDec.addEventListener('click', () => setFontSize(state.fontSize - 1));
    elements.btnFontInc.addEventListener('click', () => setFontSize(state.fontSize + 1));

    // Font family buttons
    document.querySelectorAll('.font-family-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setFontFamily(btn.getAttribute('data-font'));
      });
    });

    // Keyboard navigation (desktop / bluetooth keyboards)
    window.addEventListener('keydown', (e) => {
      if (document.body.style.overflow === 'hidden') {
        if (e.key === 'Escape') closeAllDrawers();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        goToPage(state.currentPage + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToPage(state.currentPage - 1);
      }
    });
  }

  // Helper functions
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // Service Worker
  function registerSW() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration note:', err);
        });
      });
    }
  }

  // Start app on DOMContentLoaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
