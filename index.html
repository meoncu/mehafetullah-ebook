<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#fcf6ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mehâfetullâh (Allah Korkusu) — Abdülkâdir Geylânî (k.s.)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="cover.jpg">
</head>
<body data-theme="sepia">

  <!-- Top Progress Bar -->
  <div id="readingProgressBar"></div>

  <!-- Top Header Bar -->
  <header class="reader-header">
    <div class="header-left">
      <button id="btnOpenTOC" class="icon-btn" aria-label="İçindekiler Fihristi" title="İçindekiler">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>

    <div class="header-center" id="headerCenterBtn" title="Sayfaya Git (1 - 121)">
      <span class="page-indicator-badge" id="currentPageBadge">Sayfa 1 / 121</span>
      <span class="header-chapter-preview" id="chapterPreview">Kapak Görseli</span>
    </div>

    <div class="header-right">
      <button id="btnOpenSearch" class="icon-btn" aria-label="Kitapta Ara" title="Kitapta Ara">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <button id="btnOpenSettings" class="icon-btn" aria-label="Okuma Ayarları" title="Yazı & Tema">
        <span style="font-size:15px; font-weight:bold; font-family:serif;">Aa</span>
      </button>
    </div>
  </header>

  <!-- Reader Viewport (All 121 Pages) -->
  <main class="reader-viewport" id="readerViewport">
    <!-- Populated by app.js -->
  </main>

  <!-- Bottom Floating Navigation -->
  <nav class="reader-bottom-nav">
    <button class="nav-page-btn" id="btnPrevPage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Önceki</span>
    </button>

    <button class="nav-jump-btn" id="btnJumpIndicator">
      Sayfa 1 / 121
    </button>

    <button class="nav-page-btn" id="btnNextPage">
      <span>Sonraki</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </nav>

  <!-- 1. TOC (İçindekiler) Drawer (Left) -->
  <div class="drawer-backdrop" id="tocDrawerBackdrop">
    <div class="drawer-panel left">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          <span>İçindekiler (76 Konu)</span>
        </div>
        <button class="icon-btn" id="btnCloseTOC">✕</button>
      </div>
      <div class="drawer-body">
        <input type="text" id="tocSearchInput" class="toc-search-box" placeholder="Konu veya başlık ara...">
        <ul class="toc-drawer-list" id="tocList">
          <!-- Populated by app.js -->
        </ul>
      </div>
    </div>
  </div>

  <!-- 2. Settings (Yazı & Tema) Drawer (Right) -->
  <div class="drawer-backdrop" id="settingsDrawerBackdrop">
    <div class="drawer-panel right">
      <div class="drawer-header">
        <div class="drawer-title">
          <span>Okuma Ayarları</span>
        </div>
        <button class="icon-btn" id="btnCloseSettings">✕</button>
      </div>
      <div class="drawer-body">
        <!-- Themes -->
        <div class="settings-section">
          <label class="settings-label">Okuma Teması</label>
          <div class="theme-options-grid">
            <button class="theme-card-btn active" data-theme="sepia">
              <span class="theme-preview-dot" style="background:#fcf6ea;"></span>
              <span>Sepya (Kitap)</span>
            </button>
            <button class="theme-card-btn" data-theme="light">
              <span class="theme-preview-dot" style="background:#ffffff;"></span>
              <span>Gündüz (Açık)</span>
            </button>
            <button class="theme-card-btn" data-theme="dark">
              <span class="theme-preview-dot" style="background:#18191c;"></span>
              <span>Gece (Koyu)</span>
            </button>
            <button class="theme-card-btn" data-theme="oled">
              <span class="theme-preview-dot" style="background:#000000;"></span>
              <span>OLED Siyah</span>
            </button>
          </div>
        </div>

        <!-- Font Size -->
        <div class="settings-section">
          <label class="settings-label">Yazı Boyutu</label>
          <div class="font-size-row">
            <button class="font-size-btn" id="btnFontDec">A−</button>
            <span class="font-size-value" id="fontSizeDisplay">18px</span>
            <button class="font-size-btn" id="btnFontInc">A+</button>
          </div>
        </div>

        <!-- Font Family -->
        <div class="settings-section">
          <label class="settings-label">Yazı Tipi</label>
          <div class="font-family-grid">
            <button class="font-family-btn active" data-font="serif" style="font-family:serif;">
              Klasik Serif
            </button>
            <button class="font-family-btn" data-font="sans" style="font-family:sans-serif;">
              Modern Sans
            </button>
          </div>
        </div>

        <div style="margin-top:30px; padding:14px; background:var(--bg-secondary); border-radius:10px; font-size:12px; color:var(--text-muted); text-align:center;">
          <p><strong>Mehâfetullâh (Allah Korkusu)</strong></p>
          <p>Gavs-ı A'zam Abdülkâdir Geylânî (k.s.)</p>
          <p style="margin-top:4px;">121 Sayfa — Tam Metin Dijital E-Kitap</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. Jump to Page Center Modal -->
  <div class="modal-center-backdrop" id="jumpModalBackdrop">
    <div class="modal-card">
      <h3 class="modal-title">Sayfaya Git</h3>
      <div class="jump-slider-container">
        <div class="jump-page-number-display" id="jumpPageDisplay">Sayfa 1</div>
        <div class="jump-page-title-preview" id="jumpTitlePreview">Kapak Görseli</div>
        <input type="range" id="jumpSlider" class="jump-slider" min="1" max="121" value="1">
      </div>

      <div class="jump-quick-buttons">
        <button class="quick-jump-btn" data-page="1">Kapak (1)</button>
        <button class="quick-jump-btn" data-page="6">İçindekiler (6)</button>
        <button class="quick-jump-btn" data-page="10">Hayatı (10)</button>
        <button class="quick-jump-btn" data-page="14">Vaaz (14)</button>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelJump">İptal</button>
        <button class="btn-primary" id="btnConfirmJump">Git</button>
      </div>
    </div>
  </div>

  <!-- 4. Full-Text Search Modal -->
  <div class="modal-center-backdrop" id="searchModalBackdrop">
    <div class="search-modal-card">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="Kitapta kelime ara (Örn: Tevbe, Züht, Cihad)...">
        <button class="icon-btn" id="btnCloseSearch">✕</button>
      </div>
      <div class="search-results-list" id="searchResultsList">
        <div style="padding:24px; text-align:center; color:var(--text-muted);">
          Aramak istediğiniz kelimeyi yukarıya yazınız...
        </div>
      </div>
    </div>
  </div>

  <!-- Local Book Database & App Script -->
  <script src="book_database.js"></script>
  <script src="app.js"></script>
</body>
</html>
